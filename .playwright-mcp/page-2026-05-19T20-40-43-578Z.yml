      - paragraph [ref=e57]:
        - text: The Zone Diet is a dietary approach developed by Dr. Barry Sears. It
        - link "emphasizes a balanced ratio" [ref=e58] [cursor=pointer]:
          - /url: https://www.healthline.com/nutrition/zone-diet
        - text: "of macronutrients:"
      - list [ref=e59]:
