      - paragraph [ref=e256]: No food is banned on the Zone Diet, but foods not encouraged include those high in sugar and starch, processed, refined carbs, or added sugar. Water is the recommended beverage.
      - heading "How to Prepare the Zone Diet & Tips" [level=3] [ref=e257]
      - paragraph [ref=e258]:
        - text: When following the Zone Diet, you're urged to view food as a potent drug that has a powerful impact on your body and your health, more powerful
        - emphasis [ref=e259]: "\"than any drug your doctor could ever prescribe,\""
        - text: "according to Dr. Sears. Every meal and snack should have the desired balance of macronutrients that produce an appropriate and favorable hormonal response, like:"
      - list [ref=e260]:
        - listitem [ref=e261]: Protein
        - listitem [ref=e262]: Carbohydrates
        - listitem [ref=e263]: Fat
      - heading "Determining Individual Protein Requirements and Meal Distribution in the Zone Diet" [level=4] [ref=e264]
      - paragraph [ref=e265]:
        - text: You'll determine your
        - link "total daily protein requirement" [ref=e266] [cursor=pointer]:
          - /url: https://pressbooks.calstate.edu/nutritionandfitness/chapter/7-5-estimating-protein-needs/#:~:text=Examples,training%20and%20increasing%20protein%20intake.
        - text: . That amount of protein should be spread evenly throughout the day so that every meal contains roughly equal amounts and every snack includes a smaller amount. According to Dr. Sears, everyone's daily protein requirement is unique. To calculate yours, first, calculate your percentage of body fat. Then, you use the tables provided by Dr. Sears in his book to calculate total and lean body mass.
      - 'heading "The Zone Diet''s Macronutrient Balance: Protein, Carbohydrates, and Fat at Each Meal" [level=4] [ref=e267]'
      - paragraph [ref=e268]: Then, you’ll balance your protein with carbohydrate foods. Again, every meal and every snack should balance protein with carbohydrate, with a ratio of around one-third to two-thirds. You need to eat some fat at every meal. Fat in your diet helps to tell your body that you're full and don't need to eat any more food, and it serves as an essential building block of the eicosanoid hormones that the Zone Diet is attempting to promote.
      - heading "The Importance of Meal Timing and Frequency in Maintaining 'the Zone' on the Diet" [level=4] [ref=e269]
      - paragraph [ref=e270]: "The Zone Diet focuses heavily on keeping your body in \"the Zone.\" Therefore, timing your daily food intake is critical to accomplish the diet's goals. Specifically, following the Zone Diet, you’ll eat three meals daily:"
      - list [ref=e271]:
        - listitem [ref=e272]: Breakfast
        - listitem [ref=e273]: Lunch
        - listitem [ref=e274]: Dinner
      - paragraph [ref=e275]: Your meals will be evenly spaced throughout the day. Skipping meals is not recommended, nor is loading up at one meal and eating lightly at another. Just as you balance your food intake between protein, carbs, and fats, you'll balance it time-wise. People follow many other types of diets, such as gluten-free, vegetarian, or a diet that omits specific allergens, such as nuts or cow's milk.
      - heading "Adapting the Zone Diet for Vegetarian/Vegan Lifestyles, Gluten Sensitivity, and Considerations for Diabetics" [level=4] [ref=e276]
      - paragraph [ref=e277]: The Zone Diet doesn't require animal-based foods, so if you're a vegetarian or vegan, you can try the Zone Diet. You should be aware that many plant-based staple foods, including
      - paragraph [ref=e278]: grains and beans, are off-limits on the Zone Diet due to their high starch content. Since the Zone Diet omits all grain-based foods (many of which contain gluten), it's easy to make it gluten-free.
      - paragraph
      - paragraph [ref=e279]:
        - text: Therefore, people who have celiac disease or non-celiac gluten sensitivity may find that this diet fits in well with their goals and needs. If you have diabetes,
        - link "make sure to talk with your doctor" [ref=e280] [cursor=pointer]:
          - /url: https://www.sciencedirect.com/science/article/pii/S2161831322004896#:~:text=In%20individuals%20with%20type%202,side%20effects%20associated%20with%20overmedication.
        - text: before trying the Zone Diet. The program is designed to help balance blood sugar, but people with diabetes could run into trouble by eliminating so many common foods at once.
