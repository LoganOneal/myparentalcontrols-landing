        - listitem [ref=e67]: Increase your energy levels
      - paragraph
      - paragraph [ref=e68]: The diet has many ways to follow, and its main pillars are essential to remember.
      - heading "Can You Burn Fat Even in Your Sleep, Without Feeling Hungry" [level=3] [ref=e69]
      - paragraph [ref=e70]:
        - text: Barry Sears, PhD, the biochemist who created this best-selling diet, claims it can happen in “
        - emphasis [ref=e71]: The Zone
        - text: ".” The Zone Diet instructs its followers to stick to eating a specific ratio of:"
      - list [ref=e72]:
        - listitem [ref=e73]: 40% carbs
