        - listitem [ref=e75]: 30% fat
      - paragraph
      - paragraph [ref=e76]: As part of the diet, carbs should have a low glycemic index. This means they provide a slow release of sugar into the blood to keep you fuller for longer. Protein should be lean, and fat should be mostly monounsaturated.
      - heading "A Little Background on the Zone Diet" [level=3] [ref=e77]
      - paragraph [ref=e78]:
        - text: The Zone Diet was developed over 30 years ago by an American biochemist, Barry Sears. His best-selling book,
        - emphasis [ref=e79]: The Zone
        - text: ", was published in 1995. Dr. Sears created this diet after losing family members to early deaths from heart attacks. He felt he was at risk unless he found a way to fight it. The Zone Diet claims to reduce the inflammation in your body."
      - 'heading "The Zone Diet: An Overview of Claims and Rankings" [level=4] [ref=e80]'
      - paragraph [ref=e81]: Dr. Sears proposed that inflammation was why people gain weight, become sick, and age faster. Proponents of the diet claim that once you reduce inflammation, you will lose fat at the fastest rate possible, slow down aging, reduce your risk of chronic disease, and improve your performance.
      - paragraph
      - paragraph [ref=e82]:
        - text: The 2021 U.S. News and World Report Best Diets ranks the
        - link "Zone Diet number 20" [ref=e83] [cursor=pointer]:
          - /url: https://www.verywellfit.com/the-zone-diet-4769505
        - text: in Best Diets Overall, giving it an overall score 3/5. The Zone Diet has no specific phases and is designed to be followed for a lifetime.
      - heading "Two Ways to Follow the Zone Diet" [level=3] [ref=e84]
      - paragraph [ref=e85]: Two ways to follow the Zone Diet are the hand-eye method or Zone food blocks. Most people start with the hand-eye method and progress to using Zone food blocks later, as it is more advanced. You can switch between both methods whenever you feel like it, as they each have their benefits.
      - heading "The Hand-eye Method" [level=4] [ref=e86]
      - paragraph [ref=e87]:
        - text: The hand-eye method is the easiest way to start the Zone Diet. As the name suggests,
        - link "your hand and eye" [ref=e88] [cursor=pointer]:
          - /url: https://blog.zoneliving.com/lifestyletips/zone-diet-everything-you-need-to-know
        - text: are the only tools you need to get started, although wearing a watch is also recommended to keep an eye on when to eat. In this method, your hand takes on several uses. You use it to determine your portion sizes. Your five fingers remind you to eat five times daily and never go without food for five hours. Meanwhile, you use your eyes to estimate portions on your plate.
      - paragraph
      - paragraph [ref=e89]: To design a Zone-friendly plate, you first need to divide your plate into thirds.
      - list [ref=e90]:
        - listitem [ref=e91]:
          - strong [ref=e92]: "One-third lean protein:"
          - text: One-third of your plate should have a source of lean protein, roughly the size and thickness of your palm.
        - listitem [ref=e93]:
          - strong [ref=e94]: "Two-thirds carbs:"
          - text: Two-thirds of your plate should be filled with carbs with a low glycemic index.
        - listitem [ref=e95]:
          - strong [ref=e96]: "A little fat:"
          - text: "Add a dash of monounsaturated fat to your plate, such as:"
          - list [ref=e97]:
            - listitem [ref=e98]: Olive oil
            - listitem [ref=e99]: Avocado
            - listitem [ref=e100]: Almonds
      - paragraph
      - paragraph [ref=e101]: The hand-eye method is a simple way for a beginner to follow the Zone Diet. It is also flexible and allows you to eat at restaurants on the Zone Diet. Use your hand and eyes as tools to choose options that fit Zone recommendations.
      - heading "The Zone Food Block Method" [level=4] [ref=e102]
      - paragraph [ref=e103]:
        - text: Zone food blocks allow you to
        - link "personalize the Zone Diet" [ref=e104] [cursor=pointer]:
          - /url: https://catalystfitness.typepad.com/files/food-block-guide.pdf
        - text: "to your body by calculating how many grams of protein, carbs, and fat you can have per day. The number of Zone blocks you should eat per day depends on your measurements of your:"
      - list [ref=e105]:
        - listitem [ref=e106]: Weight
        - listitem [ref=e107]: Height
        - listitem [ref=e108]: Waist
        - listitem [ref=e109]: Hip
      - paragraph
      - paragraph [ref=e110]: You can calculate your number here. The average male eats 14 Zone blocks daily, while the average female eats 11 Zone blocks daily.
      - paragraph
      - paragraph [ref=e111]: "A main meal, such as breakfast, lunch, or dinner, contains three to five Zone blocks, while a snack always contains one Zone block. Each Zone block is made of a:"
      - list [ref=e112]:
        - listitem [ref=e113]:
          - strong [ref=e114]: "Protein block:"
          - text: Contains 7 grams of protein
        - listitem [ref=e115]:
          - strong [ref=e116]: "Fat block:"
          - text: Contains 1.5 grams of fat.
        - listitem [ref=e117]:
          - strong [ref=e118]: "Carb block:"
          - text: Contains 9 grams of carbs
      - heading "Four Pillars of the Zone Diet" [level=3] [ref=e119]
      - paragraph [ref=e120]: The Zone Diet also has four pillars. Bringing these together can make the Zone part of a person’s way of life.
      - paragraph
      - paragraph [ref=e121]: "A person should:"
      - list [ref=e122]:
        - listitem [ref=e123]:
          - strong [ref=e124]: "Restrict calories without hunger or fatigue:"
          - text: If a person consumes
          - link "more calories than they need" [ref=e125] [cursor=pointer]:
            - /url: https://www.medicalnewstoday.com/articles/245588
          - text: ", the body will convert this extra energy to fat, and excess fat can cause problems in the body. One way to do this is to avoid high-calorie, processed foods."
        - listitem [ref=e126]:
          - strong [ref=e127]: "Manage inflammation levels in the body:"
          - text: Short-term inflammation is a natural reaction that is part of the body’s immune response. However, chronic inflammation can adversely impact health in many ways. Supporters of the diet say, “you need some inflammation, but not too much.” Followers of the Zone Diet may take supplements to help achieve suitable levels. The diet does not appear to specify precise levels of inflammation, and a person can only know how much is present by taking a blood test.
        - listitem [ref=e128]:
          - strong [ref=e129]: "Use dietary polyphenols to activate genes to enhance wellbeing:"
          - text: This involves eating plenty of fresh fruits and vegetables and possibly taking supplements.
        - listitem [ref=e130]:
          - strong [ref=e131]: "Control inflammation that comes from gut microbes:"
          - text: Do this by consuming polyphenols, omega-3, and fermentable fiber. Balancing these aspects should help a person achieve and maintain a healthy body and mind. A person should aim for a lifelong strategy rather than a short-term diet.
