      - generic [ref=e144]:
        - generic [ref=e145] [cursor=pointer]:
          - heading "Real-time alerts the moment a predator makes contact" [level=3] [ref=e146]
          - paragraph [ref=e147]: MyParentalControls watches Roblox, Discord, Minecraft, Fortnite, and 40+ other chats running on your child's PC. The instant grooming language, a Discord invite from a stranger, or a request to “go private” appears, you get a push notification on your phone — not a weekly digest.
        - generic [ref=e148] [cursor=pointer]:
          - heading "Coverage across 40+ apps, games, and chat platforms" [level=3] [ref=e149]
          - paragraph [ref=e150]: One install monitors every app your kid actually uses — TikTok, Snapchat, Instagram, Character.AI, ChatGPT, BeReal, Discord, and dozens more. See the full list of monitored platforms and what we watch for on each.
        - generic [ref=e151] [cursor=pointer]:
          - heading "Catches self-harm, sexual content, and bullying — not just predators" [level=3] [ref=e152]
          - paragraph [ref=e153]: The same AI that flags grooming also flags suicide and self-harm conversations, sexting, sextortion, and pile-on bullying. You see what your child is going through before it becomes a crisis.
        - generic [ref=e154] [cursor=pointer]:
          - heading "Sees encrypted and disappearing messages on the device" [level=3] [ref=e155]
          - paragraph [ref=e156]: End-to-end encrypted Messenger, vanishing Snaps, and disappearing Instagram DMs all bypass platform-level parental dashboards. MyParentalControls reads them on the endpoint, so encryption isn't a blind spot.
