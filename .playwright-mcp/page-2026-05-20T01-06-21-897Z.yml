            - strong [ref=e225]: How does Bark work?
            - generic [ref=e226]: 
          - generic [ref=e227]:
            - paragraph [ref=e228]:
              - strong [ref=e229]: Content Monitoring
            - paragraph [ref=e230]:
              - text: Bark uses
              - link "advanced machine learning" [ref=e231] [cursor=pointer]:
                - /url: https://www.bark.us/how/
              - text: and statistical analysis techniques to recognize potential problems. Simple keyword searches are not enough to detect the majority of issues, which is why our parental control app uses contextual analysis and natural language processing to determine when something serious might be happening.
            - paragraph [ref=e232]:
              - text: For example, Bark knows the difference between a kid saying “This homework makes me wanna kill myself,” versus “Nobody cares about me!! I wanna kill myself.” Our algorithm also keeps up with the
              - link "latest in teen slang" [ref=e233] [cursor=pointer]:
                - /url: https://www.bark.us/blog/teen-text-speak-codes-every-parent-should-know/
              - text: .
            - paragraph [ref=e234]:
              - strong [ref=e235]: Screen Time Management and Website Blocking
            - paragraph [ref=e236]:
              - text: Families can manage not only
              - emphasis [ref=e237]: when
              - text: their kids can access the internet on their devices, but also which sites and apps they can visit.
            - paragraph [ref=e238]: You can create custom profiles for each child in your house, create screen time schedules, and manage access to a wide variety of websites — including video streaming, gaming, adult content, and more.
