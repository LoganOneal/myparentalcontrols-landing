        - generic [ref=e277]:
          - generic [ref=e278] [cursor=pointer]:
            - strong [ref=e279]: How does content monitoring work?
            - generic [ref=e280]: 
          - generic [ref=e281]:
            - paragraph [ref=e282]:
              - text: Add one of your child's devices or social media accounts to be
              - link "monitored" [ref=e283] [cursor=pointer]:
                - /url: https://www.bark.us/monitor-content/
              - text: . Then — thanks to our comprehensive AI, we'll start sending you alerts about potentially harmful activities on those devices and accounts.
            - paragraph [ref=e284]: You can also customize how sensitive you would like the alerts to be. Don't care about profanity but want all alerts about drugs? No problem.
        - generic [ref=e285]:
          - generic [ref=e286] [cursor=pointer]:
            - strong [ref=e287]: How is Bark's screen time feature different from Apple Screen Time or Google Family Link?
            - generic [ref=e288]: 
          - generic [ref=e289]:
            - paragraph [ref=e290]: With Bark, you can manage your children’s screen time from your own phone via the Bark app or website, regardless of whether you have an iPhone and your kids have an Android (or vice versa).
            - paragraph [ref=e291]: In terms of web filtering, Apple's Screen Time and Google Family Link web filters only block general content. Bark, on the other hand, breaks down a wide range of categories and exceptions to enable a more customized and refined level of protection.
        - generic [ref=e292]:
          - generic [ref=e293] [cursor=pointer]:
            - strong [ref=e294]: Do I need to jailbreak/root my child's phone?
            - generic [ref=e295]: 
          - paragraph [ref=e297]: No, you do not need to jailbreak your child's iOS device or root your child’s Android phone in order for Bark to work. As a third-party service, we strive to provide a program that keeps phones working properly and that does not void warranties or terms of service.
        - generic [ref=e298]:
          - generic [ref=e299] [cursor=pointer]:
            - strong [ref=e300]: Do I need a computer to set up the Bark App?
            - generic [ref=e301]: 
          - paragraph [ref=e303]:
            - text: Apple is strict when it comes to security and doesn’t allow any third-party solutions (including Bark) direct access to monitor iOS devices. You’ll need a computer to set up Bark Premium if your child has an iPhone, iPad, or iPod (you can see
            - link "step-by-step instructions for how to do setup on iOS devices here" [ref=e304] [cursor=pointer]:
              - /url: https://www.bark.us/ios/
            - text: ). If you don’t have a home computer, that’s also okay! You can order a
            - link "Bark Home" [ref=e305] [cursor=pointer]:
              - /url: https://www.bark.us/app/setup/33504385/cart/initial-offer#clicked_home_button
            - text: ", which is a small device that plugs into your home Wi-Fi router, and"
            - link "Bark Home will analyze the texts, photos, and videos on your child’s iOS device and send you alerts for potential issues" [ref=e306] [cursor=pointer]:
              - /url: https://support.bark.us/hc/en-us/articles/5715479538829-How-to-Monitor-iOS-Devices-with-the-Bark-Home
            - text: . For Androids, you won’t need a computer at all.
        - generic [ref=e307]:
          - generic [ref=e308] [cursor=pointer]:
            - strong [ref=e309]: Can you install Bark on any phone?
            - generic [ref=e310]: 
          - generic [ref=e311]:
            - paragraph [ref=e312]: Bark can be installed on most phones, but the setup and features vary depending on the device. On Android phones, users can easily download the Bark app to enable monitoring, set screen-time limits, filter web content, manage apps, track location, and receive alerts.
            - paragraph [ref=e313]: On iPhones and iPads, Bark operates slightly differently due to Apple’s privacy restrictions. Bark devices like the Bark Phone and Bark Watch come with Bark’s safety features built right in, so parents don’t need to install anything separately.
