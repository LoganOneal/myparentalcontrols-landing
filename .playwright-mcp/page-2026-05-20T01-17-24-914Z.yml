      - generic [ref=e195]:
        - generic [ref=e196] [cursor=pointer]:
          - heading "Real-time alerts the moment a predator makes contact" [level=3] [ref=e197]
          - paragraph [ref=e198]: MyParentalControls watches Roblox, Discord, Minecraft, Fortnite, and 40+ other chats running on your child's PC. The instant grooming language, a Discord invite from a stranger, or a request to “go private” appears, you get a push notification on your phone — not a weekly digest.
        - generic [ref=e199] [cursor=pointer]:
          - heading "Coverage across 40+ apps, games, and chat platforms" [level=3] [ref=e200]
          - paragraph [ref=e201]: One install monitors every app your kid actually uses — TikTok, Snapchat, Instagram, Character.AI, ChatGPT, BeReal, Discord, and dozens more. See the full list of monitored platforms and what we watch for on each.
        - generic [ref=e202] [cursor=pointer]:
          - heading "Catches self-harm, sexual content, and bullying — not just predators" [level=3] [ref=e203]
          - paragraph [ref=e204]: The same AI that flags grooming also flags suicide and self-harm conversations, sexting, sextortion, and pile-on bullying. You see what your child is going through before it becomes a crisis.
        - generic [ref=e205] [cursor=pointer]:
          - heading "Sees encrypted and disappearing messages on the device" [level=3] [ref=e206]
          - paragraph [ref=e207]: End-to-end encrypted Messenger, vanishing Snaps, and disappearing Instagram DMs all bypass platform-level parental dashboards. MyParentalControls reads them on the endpoint, so encryption isn't a blind spot.
