            - link "Xbox One" [ref=e566] [cursor=pointer]:
              - /url: /wiki/Xbox_One
            - text: at
            - link "E3 2014" [ref=e567] [cursor=pointer]:
              - /url: /wiki/E3_2014
            - text: . This enhanced version features an increased draw distance, finer texture details, denser traffic, upgraded weather effects, and new wildlife and vegetation.
            - superscript [ref=e568]:
              - link "[66]" [ref=e569] [cursor=pointer]:
                - /url: "#cite_note-Next_Gen_Reveal-80"
            - text: It includes a new on-foot first-person view option, which required the development team to overhaul the animation system to accommodate first-person gameplay.
            - superscript [ref=e570]:
              - link "[4]" [ref=e571] [cursor=pointer]:
                - /url: "#cite_note-First_Person_Perspective-5"
            - text: The PlayStation 4 and Xbox One versions were released on 18 November 2014.
            - superscript [ref=e572]:
              - link "[67]" [ref=e573] [cursor=pointer]:
                - /url: "#cite_note-ReReleaseDate-81"
            - text: The PC version, initially scheduled for simultaneous release with the console versions,
            - superscript [ref=e574]:
              - link "[66]" [ref=e575] [cursor=pointer]:
                - /url: "#cite_note-Next_Gen_Reveal-80"
            - text: was delayed until 14 April 2015.
            - superscript [ref=e576]:
              - link "[68]" [ref=e577] [cursor=pointer]:
                - /url: "#cite_note-PC_Delay_3-82"
            - text: According to Rockstar, it required extra development time for "polish".
            - superscript [ref=e578]:
              - link "[69]" [ref=e579] [cursor=pointer]:
