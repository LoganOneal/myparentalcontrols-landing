          - heading "Grand Theft Auto Online" [level=3] [ref=e625]
          - note [ref=e626]:
            - text: "Main article:"
            - link "Grand Theft Auto Online" [ref=e627] [cursor=pointer]:
              - /url: /wiki/Grand_Theft_Auto_Online
          - paragraph [ref=e628]:
            - text: Developed in tandem with the single-player mode, the online multiplayer mode Grand Theft Auto Online was conceived as a separate experience to be played in a continually evolving world.
            - superscript [ref=e629]:
              - link "[82]" [ref=e630] [cursor=pointer]:
                - /url: "#cite_note-CVG_Benzies-96"
            - text: Up to 30 players
            - superscript [ref=e631]:
              - link "[o]" [ref=e632] [cursor=pointer]:
                - /url: "#cite_note-98"
            - text: freely roam across the game world and enter lobbies to complete jobs (story-driven competitive and cooperative modes).
            - superscript [ref=e633]:
              - link "[83]" [ref=e634] [cursor=pointer]:
                - /url: "#cite_note-Persistent-97"
            - text: The Content Creator toolset lets players create their own parameters for custom jobs, like racetracks and
            - link "deathmatch" [ref=e635] [cursor=pointer]:
              - /url: /wiki/Deathmatch_(video_games)
            - text: weapon
            - link "spawn points" [ref=e636] [cursor=pointer]:
              - /url: /wiki/Spawning_(video_gaming)
            - text: .
            - superscript [ref=e637]:
              - link "[84]" [ref=e638] [cursor=pointer]:
                - /url: "#cite_note-CVG-online-99"
            - text: Players may band together in organised player teams called crews to complete jobs together.
            - link "Rockstar Games Social Club" [ref=e639] [cursor=pointer]:
              - /url: /wiki/Rockstar_Games_Social_Club
            - text: extends crews formed in Max Payne 3's multiplayer mode to those of Grand Theft Auto Online. Players may create their own crews and join up to five total. Crews win multiplayer matches to earn
            - link "experience points" [ref=e640] [cursor=pointer]:
              - /url: /wiki/Experience_point
            - text: and climb
            - link "online leaderboards" [ref=e641] [cursor=pointer]:
              - /url: /wiki/Online_leaderboards
            - text: .
            - superscript [ref=e642]:
              - link "[85]" [ref=e643] [cursor=pointer]:
                - /url: "#cite_note-krupa1-100"
          - paragraph [ref=e644]:
            - text: Grand Theft Auto Online launched on 1 October 2013, two weeks after Grand Theft Auto V's release.
            - superscript [ref=e645]:
              - link "[86]" [ref=e646] [cursor=pointer]:
                - /url: "#cite_note-IGN_online_start-101"
            - text: Many players reported connection difficulties and game freezes during load screens.
            - superscript [ref=e647]:
              - link "[87]" [ref=e648] [cursor=pointer]:
                - /url: "#cite_note-IGN_launch_issues-102"
            - superscript [ref=e649]:
              - link "[88]" [ref=e650] [cursor=pointer]:
                - /url: "#cite_note-Poly_online_live-103"
            - text: Rockstar released a technical patch on 5 October in an effort to resolve the issues,
            - superscript [ref=e651]:
              - link "[89]" [ref=e652] [cursor=pointer]:
                - /url: "#cite_note-Poly_connect-104"
            - text: but problems persisted the second week as some players reported their character progress as having disappeared.
            - superscript [ref=e653]:
              - link "[90]" [ref=e654] [cursor=pointer]:
                - /url: "#cite_note-VG_investigate-105"
            - text: Another technical patch was released on 10 October combating the issues,
            - superscript [ref=e655]:
              - link "[91]" [ref=e656] [cursor=pointer]:
                - /url: "#cite_note-IGN_delete-106"
            - text: and Rockstar offered a GTA$500,000 (in-game currency) stimulus to the accounts of all players connected to Online since launch as recompense.
            - superscript [ref=e657]:
              - link "[92]" [ref=e658] [cursor=pointer]:
                - /url: "#cite_note-EU_stimulus-107"
            - text: Because of the widespread technical issues present at launch, many reviewers bemoaned their Grand Theft Auto Online experience but generally recognised its open-ended exploration and dynamic content as strengths.
            - superscript [ref=e659]:
              - link "[93]" [ref=e660] [cursor=pointer]:
                - /url: "#cite_note-Digital_Spy_GTA_Online-108"
            - superscript [ref=e661]:
              - link "[94]" [ref=e662] [cursor=pointer]:
                - /url: "#cite_note-Destructoid_GTA_Online-109"
            - superscript [ref=e663]:
              - link "[95]" [ref=e664] [cursor=pointer]:
                - /url: "#cite_note-GameSpot_GTA_Online-110"
            - superscript [ref=e665]:
              - link "[96]" [ref=e666] [cursor=pointer]:
                - /url: "#cite_note-IGN_GTA_Online-111"
            - superscript [ref=e667]:
              - link "[97]" [ref=e668] [cursor=pointer]:
                - /url: "#cite_note-VideoGamer_GTA_Online-112"
          - paragraph [ref=e669]:
            - text: Post-release content is continually added to Grand Theft Auto Online through free title updates. Some updates add new game modes and features,
            - superscript [ref=e670]:
              - link "[98]" [ref=e671] [cursor=pointer]:
                - /url: "#cite_note-RS_DM_race-113"
            - superscript [ref=e672]:
              - link "[99]" [ref=e673] [cursor=pointer]:
                - /url: "#cite_note-RS_capture-114"
            - text: and others feature themed gameplay content, such as the
            - link "Independence Day" [ref=e674] [cursor=pointer]:
              - /url: /wiki/Independence_Day_(United_States)
            - text: Special update that added patriotic-themed content on 1 July 2014.
            - superscript [ref=e675]:
              - link "[100]" [ref=e676] [cursor=pointer]:
                - /url: "#cite_note-IGN_ID-115"
            - text: The widely anticipated
            - superscript [ref=e677]:
              - link "[101]" [ref=e678] [cursor=pointer]:
                - /url: "#cite_note-IGN_US-116"
            - superscript [ref=e679]:
              - link "[102]" [ref=e680] [cursor=pointer]:
                - /url: "#cite_note-highly-117"
            - text: Online Heists update launched on 10 March 2015 and suffered some initial technical difficulties due to the increased user load.
            - superscript [ref=e681]:
              - link "[103]" [ref=e682] [cursor=pointer]:
                - /url: "#cite_note-IGN_statement-118"
            - text: Shortly after the game's PC release, some players reported being banned from Grand Theft Auto Online for using
            - link "field of view" [ref=e683] [cursor=pointer]:
              - /url: /wiki/Field_of_view_in_video_games
            - text: and cosmetic
            - link "mods" [ref=e684] [cursor=pointer]:
              - /url: /wiki/Mod_(video_gaming)
            - text: in single-player.
            - superscript [ref=e685]:
              - link "[104]" [ref=e686] [cursor=pointer]:
                - /url: "#cite_note-IGN_mods-119"
            - text: Rockstar stated in their official blog that nobody had been banned from Online for using single-player mods, but that recent updates to the PC version had the "unintentional effect" of making such mods unplayable. They stated that mods are unauthorised and may cause unforeseen technical problems and instabilities.
            - superscript [ref=e687]:
              - link "[105]" [ref=e688] [cursor=pointer]:
                - /url: "#cite_note-RQ_editor-120"
