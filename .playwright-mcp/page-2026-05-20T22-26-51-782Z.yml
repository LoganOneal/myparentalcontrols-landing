            - text: channel;
            - superscript [ref=e612]:
              - link "[76]" [ref=e613] [cursor=pointer]:
                - /url: "#cite_note-PS5_dislike-90"
            - text: journalists noted that fans were frustrated by Rockstar's continued focus on the game instead of other projects such as a new Grand Theft Auto game, as well as a lack of apparent new features demonstrated in the trailer.
            - superscript [ref=e614]:
              - link "[77]" [ref=e615] [cursor=pointer]:
                - /url: "#cite_note-Re-re-release_anger_1-91"
            - superscript [ref=e616]:
