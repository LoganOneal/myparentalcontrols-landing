                - /url: "#cite_note-MC_All_Time_XBO-160"
            - text: and the second-highest rated PC game alongside several others.
            - superscript [ref=e1092]:
              - link "[146]" [ref=e1093] [cursor=pointer]:
                - /url: "#cite_note-MC_All_Time_PC-161"
          - paragraph [ref=e1094]:
            - text: Game Informer considered the addition of first-person "another significant breakthrough for the series" in the vein of
            - link "Grand Theft Auto III" [ref=e1096] [cursor=pointer]:
              - /url: /wiki/Grand_Theft_Auto_III
            - text: "'s shift to third-person from"
            - link "Grand Theft Auto" [ref=e1098] [cursor=pointer]:
              - /url: /wiki/Grand_Theft_Auto_(video_game)
            - text: "'s bird's-eye view."
            - superscript [ref=e1099]:
              - link "[138]" [ref=e1100] [cursor=pointer]:
                - /url: "#cite_note-Game_Informer_Review_2-153"
            - text: GameSpot found that playing in first-person heightened the impact of Grand Theft Auto V's violence, which made him reflect on morality and character motivation more than before.
            - superscript [ref=e1101]:
              - link "[137]" [ref=e1102] [cursor=pointer]:
                - /url: "#cite_note-GameSpot_Review_2-152"
            - text: VideoGamer.com opined that players feel like inhabitants of the world, rather than "guns attached to a floating camera".
            - superscript [ref=e1103]:
              - link "[142]" [ref=e1104] [cursor=pointer]:
                - /url: "#cite_note-VG_PS4_Review-157"
            - text: The first-person view, in IGN's opinion, aided immersion and created a "surprisingly different experience".
            - superscript [ref=e1105]:
              - link "[139]" [ref=e1106] [cursor=pointer]:
                - /url: "#cite_note-IGN_Review_2-154"
            - text: VideoGamer.com praised the "finer details" in first-person animations like camera lean when players take corners on motorcycles, or the navigational instruments in plane cockpits.
            - superscript [ref=e1107]:
              - link "[142]" [ref=e1108] [cursor=pointer]:
                - /url: "#cite_note-VG_PS4_Review-157"
            - text: Reviewers found playing the game more difficult in first-person,
            - superscript [ref=e1109]:
              - link "[137]" [ref=e1110] [cursor=pointer]:
                - /url: "#cite_note-GameSpot_Review_2-152"
            - superscript [ref=e1111]:
              - link "[139]" [ref=e1112] [cursor=pointer]:
                - /url: "#cite_note-IGN_Review_2-154"
            - text: but Game Informer preferred the challenge.
            - superscript [ref=e1113]:
              - link "[138]" [ref=e1114] [cursor=pointer]:
                - /url: "#cite_note-Game_Informer_Review_2-153"
          - paragraph [ref=e1115]:
            - text: GameSpot thought the improved graphics and
            - link "spatial anti-aliasing" [ref=e1116] [cursor=pointer]:
              - /url: /wiki/Spatial_anti-aliasing
            - text: made the open world "even more spectacular". They said that in first-person "everything looks bigger and more imposing".
            - superscript [ref=e1117]:
              - link "[137]" [ref=e1118] [cursor=pointer]:
                - /url: "#cite_note-GameSpot_Review_2-152"
            - text: IGN favoured the PlayStation 4 version's graphics over the Xbox One but thought both consoles rendered the game well and maintained mostly consistent frame rates.
            - superscript [ref=e1119]:
              - link "[139]" [ref=e1120] [cursor=pointer]:
                - /url: "#cite_note-IGN_Review_2-154"
            - text: They praised the increased frame rate and graphics options offered in the PC version.
            - superscript [ref=e1121]:
              - link "[147]" [ref=e1122] [cursor=pointer]:
                - /url: "#cite_note-IGN_PC_RIP-162"
            - text: VideoGamer.com called the console version's frame rate so consistent it was "scarcely believable",
            - superscript [ref=e1123]:
              - link "[142]" [ref=e1124] [cursor=pointer]:
                - /url: "#cite_note-VG_PS4_Review-157"
            - text: although GameSpot cited occasional frame rate dips.
            - superscript [ref=e1125]:
              - link "[137]" [ref=e1126] [cursor=pointer]:
                - /url: "#cite_note-GameSpot_Review_2-152"
            - text: They opined that the PC version let players "witness the full extent of Rockstar's admirable handiwork", but noted that it "retains evidence of its
            - link "last-gen" [ref=e1127] [cursor=pointer]:
              - /url: /wiki/History_of_video_game_consoles_(seventh_generation)
            - text: roots ... with simple geometry".
            - superscript [ref=e1128]:
              - link "[137]" [ref=e1129] [cursor=pointer]:
                - /url: "#cite_note-GameSpot_Review_2-152"
            - text: VideoGamer.com praised the Rockstar Editor's accessibility on PC but criticised some of its limitations and camera angle restrictions.
            - superscript [ref=e1130]:
              - link "[143]" [ref=e1131] [cursor=pointer]:
                - /url: "#cite_note-VG_PC_Review-158"
            - text: IGN appreciated the PC version's customisable controls,
            - superscript [ref=e1132]:
              - link "[147]" [ref=e1133] [cursor=pointer]:
                - /url: "#cite_note-IGN_PC_RIP-162"
            - text: and GameSpot felt that constant switching between the mouse and keyboard and a gamepad was necessary for "the best experience".
            - superscript [ref=e1134]:
              - link "[137]" [ref=e1135] [cursor=pointer]:
                - /url: "#cite_note-GameSpot_Review_2-152"
            - link "PC Gamer" [ref=e1137] [cursor=pointer]:
              - /url: /wiki/PC_Gamer
            - text: called the game "the most beautiful, expansive and generous" of the series.
            - superscript [ref=e1138]:
              - link "[141]" [ref=e1139] [cursor=pointer]:
                - /url: "#cite_note-PC_Gamer_review-156"
          - paragraph [ref=e1140]:
            - text: On the game's multiplayer, IGN reported low player counts in matches, long wait times in lobbies, server disconnection and occasional crashes. "Because of that," they wrote, "I can't strongly recommend ... the multiplayer experience alone".
            - superscript [ref=e1141]:
              - link "[139]" [ref=e1142] [cursor=pointer]:
                - /url: "#cite_note-IGN_Review_2-154"
            - text: VideoGamer.com found online character progression streamlined by comparison with the original version. According to them, the "grind of just doing
            - link "PvP" [ref=e1143] [cursor=pointer]:
              - /url: /wiki/PvP
            - text: until co-op Jobs arrive with regularity"
            - superscript [ref=e1144]:
              - link "[142]" [ref=e1145] [cursor=pointer]:
                - /url: "#cite_note-VG_PS4_Review-157"
            - text: was lost, and newcomers would likely find multiplayer enjoyable and balanced. However, they wrote of frequent server disconnection, especially during load screens.
            - superscript [ref=e1146]:
              - link "[142]" [ref=e1147] [cursor=pointer]:
                - /url: "#cite_note-VG_PS4_Review-157"
            - text: GameSpot thought the online mode was fun but "still suffers from a lack of direction" for its open-ended and frenetic gameplay.
            - superscript [ref=e1148]:
              - link "[137]" [ref=e1149] [cursor=pointer]:
                - /url: "#cite_note-GameSpot_Review_2-152"
            - text: Game Informer reported "minimal lag or issues in the expanded firefights and races".
            - superscript [ref=e1150]:
              - link "[138]" [ref=e1151] [cursor=pointer]:
                - /url: "#cite_note-Game_Informer_Review_2-153"
          - paragraph [ref=e1152]:
            - text: The PlayStation 5 and Xbox Series releases received tepid responses from critics, who questioned the value proposition of a new version of the ageing title. While the improved visual fidelity and quicker loading times were singled out for praise, reviewers generally found the core gameplay, storytelling and character models dated.
            - superscript [ref=e1153]:
              - link "[148]" [ref=e1154] [cursor=pointer]:
                - /url: "#cite_note-Hardcore_Gamer_2022-163"
            - superscript [ref=e1155]:
              - link "[149]" [ref=e1156] [cursor=pointer]:
                - /url: "#cite_note-GamingBolt_2022-164"
            - superscript [ref=e1157]:
              - link "[150]" [ref=e1158] [cursor=pointer]:
                - /url: "#cite_note-Jeuxvideo.com_2022-165"
            - superscript [ref=e1159]:
              - link "[151]" [ref=e1160] [cursor=pointer]:
                - /url: "#cite_note-Push_Square_2022-166"
            - text: Hardcore Gamer thought the lack of new content made the upgrade difficult to recommend to PlayStation 4 and Xbox One players.
            - superscript [ref=e1161]:
              - link "[148]" [ref=e1162] [cursor=pointer]:
                - /url: "#cite_note-Hardcore_Gamer_2022-163"
            - text: GamingBolt was apathetic towards the visual enhancements but praised the increased accessibility for Online newcomers.
            - superscript [ref=e1163]:
              - link "[149]" [ref=e1164] [cursor=pointer]:
                - /url: "#cite_note-GamingBolt_2022-164"
            - link "Jeuxvideo.com" [ref=e1166] [cursor=pointer]:
              - /url: /wiki/Jeuxvideo.com
            - text: thought the release offered the supreme console experience and highlighted the improved graphics and load times.
            - superscript [ref=e1167]:
              - link "[150]" [ref=e1168] [cursor=pointer]:
                - /url: "#cite_note-Jeuxvideo.com_2022-165"
            - text: Push Square faulted the antiquated humour but thought the visual and technical enhancements gave the "sunny sandbox a new lease of life".
            - superscript [ref=e1169]:
              - link "[151]" [ref=e1170] [cursor=pointer]:
                - /url: "#cite_note-Push_Square_2022-166"
          - heading "Awards" [level=3] [ref=e1172]
          - paragraph [ref=e1173]:
            - text: Grand Theft Auto V received multiple nominations and awards from
            - link "gaming publications" [ref=e1174] [cursor=pointer]:
              - /url: /wiki/Gaming_publications
            - text: . Before release, it won Most Anticipated Game at the
            - link "2012" [ref=e1175] [cursor=pointer]:
              - /url: /wiki/VGX_(award_show)#2012_Awards
            - link "Spike Video Game Awards" [ref=e1176] [cursor=pointer]:
              - /url: /wiki/Spike_Video_Game_Awards
            - text: .
            - superscript [ref=e1177]:
              - link "[60]" [ref=e1178] [cursor=pointer]:
                - /url: "#cite_note-spike2012-74"
            - text: The game was review aggregators Metacritic and GameRankings's highest-rated for the year 2013.
            - superscript [ref=e1179]:
              - link "[152]" [ref=e1180] [cursor=pointer]:
                - /url: "#cite_note-MC_2013_ratings-167"
            - superscript [ref=e1181]:
              - link "[153]" [ref=e1182] [cursor=pointer]:
                - /url: "#cite_note-GR_2013_ratings-168"
            - text: The game appeared on several year-end lists of 2013's best games, receiving
            - link "Game of the Year" [ref=e1183] [cursor=pointer]:
              - /url: /wiki/List_of_Game_of_the_Year_awards
            - text: wins from independent journalist
            - link "Tom Chick" [ref=e1184] [cursor=pointer]:
              - /url: /wiki/Tom_Chick
            - text: ","
            - superscript [ref=e1185]:
              - link "[154]" [ref=e1186] [cursor=pointer]:
                - /url: "#cite_note-Chick_2013-169"
            - text: CNET,
            - superscript [ref=e1187]:
              - link "[155]" [ref=e1188] [cursor=pointer]:
                - /url: "#cite_note-CNET_2013-170"
            - text: Edge,
            - superscript [ref=e1189]:
              - link "[156]" [ref=e1190] [cursor=pointer]:
                - /url: "#cite_note-EdgeBG-171"
            - text: the
            - link "31st Golden Joystick Awards" [ref=e1191] [cursor=pointer]:
              - /url: /wiki/Golden_Joystick_Awards
            - text: ","
            - superscript [ref=e1192]:
              - link "[157]" [ref=e1193] [cursor=pointer]:
                - /url: "#cite_note-goldenjoy-172"
            - text: the
            - link "5th Annual Inside Gaming Awards" [ref=e1194] [cursor=pointer]:
              - /url: /wiki/Inside_Gaming_Awards
            - text: ","
            - superscript [ref=e1195]:
              - link "[158]" [ref=e1196] [cursor=pointer]:
                - /url: "#cite_note-InsideGaming2013-173"
            - text: the
            - link "Spike VGX 2013 Awards" [ref=e1197] [cursor=pointer]:
              - /url: /wiki/VGX_2013
            - text: ","
            - superscript [ref=e1198]:
              - link "[159]" [ref=e1199] [cursor=pointer]:
                - /url: "#cite_note-VGX-win-174"
            - link "Slant Magazine" [ref=e1201] [cursor=pointer]:
              - /url: /wiki/Slant_Magazine
            - superscript [ref=e1202]:
              - link "[160]" [ref=e1203] [cursor=pointer]:
                - /url: "#cite_note-Slant_2013-175"
            - text: and
            - link "Time" [ref=e1205] [cursor=pointer]:
              - /url: /wiki/Time_(magazine)
            - text: .
            - superscript [ref=e1206]:
              - link "[161]" [ref=e1207] [cursor=pointer]:
                - /url: "#cite_note-Time_2013-176"
            - text: It was named the Best Xbox Game by
            - link "Canada.com" [ref=e1209] [cursor=pointer]:
              - /url: /wiki/Postmedia_News
            - text: ","
            - superscript [ref=e1210]:
              - link "[162]" [ref=e1211] [cursor=pointer]:
                - /url: "#cite_note-Canada-177"
            - text: GameSpot,
            - superscript [ref=e1212]:
              - link "[163]" [ref=e1213] [cursor=pointer]:
                - /url: "#cite_note-GSXBOX-178"
            - text: and IGN,
            - superscript [ref=e1214]:
              - link "[164]" [ref=e1215] [cursor=pointer]:
                - /url: "#cite_note-IGNXBOX-179"
            - text: and the Best Multiplatform Game by Destructoid.
            - superscript [ref=e1216]:
              - link "[165]" [ref=e1217] [cursor=pointer]:
                - /url: "#cite_note-Dest-MULT-180"
            - text: Rockstar Games and Rockstar North won Best Studio and Best Developer from Edge,
            - superscript [ref=e1218]:
              - link "[166]" [ref=e1219] [cursor=pointer]:
                - /url: "#cite_note-EdgeSOTY-181"
            - text: and the
            - link "BAFTA Academy Fellowship Award" [ref=e1220] [cursor=pointer]:
              - /url: /wiki/BAFTA_Academy_Fellowship_Award
            - text: at the
            - link "10th British Academy Video Games Awards" [ref=e1221] [cursor=pointer]:
              - /url: /wiki/10th_British_Academy_Video_Games_Awards
            - text: .
            - superscript [ref=e1222]:
              - link "[167]" [ref=e1223] [cursor=pointer]:
                - /url: "#cite_note-bafta-182"
          - paragraph [ref=e1224]:
            - text: Various in-game elements were recognised with awards. Trevor was named Best Character for the Official Xbox Magazine's Game of the Year Awards 2013,
            - superscript [ref=e1225]:
              - link "[168]" [ref=e1226] [cursor=pointer]:
                - /url: "#cite_note-OXM-183"
            - text: while Lamar Davis won the Best New Character award from Giant Bomb.
            - superscript [ref=e1227]:
              - link "[169]" [ref=e1228] [cursor=pointer]:
                - /url: "#cite_note-GiantBomb-184"
            - text: The music received awards from Spike VGX,
            - superscript [ref=e1229]:
              - link "[159]" [ref=e1230] [cursor=pointer]:
                - /url: "#cite_note-VGX-win-174"
            - text: Hardcore Gamer
            - superscript [ref=e1231]:
              - link "[170]" [ref=e1232] [cursor=pointer]:
                - /url: "#cite_note-HG-Sound-185"
            - text: and The Daily Telegraph.
            - superscript [ref=e1233]:
              - link "[171]" [ref=e1234] [cursor=pointer]:
                - /url: "#cite_note-Telegraph-186"
            - text: Grand Theft Auto Online won Best Multiplayer from GameTrailers,
            - superscript [ref=e1235]:
              - link "[172]" [ref=e1236] [cursor=pointer]:
                - /url: "#cite_note-GameTrailers-187"
            - text: and BAFTA,
            - superscript [ref=e1237]:
              - link "[167]" [ref=e1238] [cursor=pointer]:
                - /url: "#cite_note-bafta-182"
            - text: and Best Xbox 360 Multiplayer from IGN.
            - superscript [ref=e1239]:
              - link "[173]" [ref=e1240] [cursor=pointer]:
                - /url: "#cite_note-IGN-XBOXMultiplayer-188"
            - text: Online was also nominated for Biggest Disappointment by
            - link "Game Revolution" [ref=e1242] [cursor=pointer]:
              - /url: /wiki/Game_Revolution
            - superscript [ref=e1243]:
              - link "[174]" [ref=e1244] [cursor=pointer]:
                - /url: "#cite_note-GR-Disappoint-189"
            - text: and Hardcore Gamer.
            - superscript [ref=e1245]:
              - link "[175]" [ref=e1246] [cursor=pointer]:
                - /url: "#cite_note-HG-Disappoint-190"
            - text: Grand Theft Auto V won Best Technical Achievement in the Telegraph Video Game Awards,
            - superscript [ref=e1247]:
              - link "[171]" [ref=e1248] [cursor=pointer]:
                - /url: "#cite_note-Telegraph-186"
            - text: and Best Technology at the 14th Annual
            - link "Game Developers Choice Awards" [ref=e1249] [cursor=pointer]:
              - /url: /wiki/Game_Developers_Choice_Awards
            - text: .
            - superscript [ref=e1250]:
              - link "[176]" [ref=e1251] [cursor=pointer]:
                - /url: "#cite_note-GameDevelopersAwards-191"
            - text: The graphical and artistic design received awards from IGN,
            - superscript [ref=e1252]:
              - link "[177]" [ref=e1253] [cursor=pointer]:
                - /url: "#cite_note-IGN-XBOXGraphics-192"
            - text: The Daily Telegraph
            - superscript [ref=e1254]:
              - link "[171]" [ref=e1255] [cursor=pointer]:
                - /url: "#cite_note-Telegraph-186"
            - text: and BAFTA,
            - superscript [ref=e1256]:
              - link "[167]" [ref=e1257] [cursor=pointer]:
                - /url: "#cite_note-bafta-182"
            - text: and a nomination at the Game Developers Choice Awards.
            - superscript [ref=e1258]:
              - link "[176]" [ref=e1259] [cursor=pointer]:
                - /url: "#cite_note-GameDevelopersAwards-191"
            - text: The
            - link "Academy of Interactive Arts & Sciences" [ref=e1260] [cursor=pointer]:
              - /url: /wiki/Academy_of_Interactive_Arts_%26_Sciences
            - text: awarded the game with
            - link "Outstanding Achievement in Gameplay Engineering" [ref=e1261] [cursor=pointer]:
              - /url: /wiki/D.I.C.E._Award_for_Outstanding_Technical_Achievement
            - text: ", signifying \"the highest level of achievement for engineering"
            - link "artificial intelligence" [ref=e1262] [cursor=pointer]:
              - /url: /wiki/Artificial_intelligence_in_video_games
            - text: and related elements which contribute to a challenging game".
            - superscript [ref=e1263]:
              - link "[178]" [ref=e1264] [cursor=pointer]:
                - /url: "#cite_note-DICE-193"
          - paragraph [ref=e1265]:
            - text: The game received numerous other awards. It was awarded the title of Most Immersive Game at the Inside Gaming Awards.
            - superscript [ref=e1266]:
              - link "[158]" [ref=e1267] [cursor=pointer]:
                - /url: "#cite_note-InsideGaming2013-173"
            - text: The general public voted for the game to win the User Choice Award at the PlayStation Awards 2013
            - superscript [ref=e1268]:
              - link "[179]" [ref=e1269] [cursor=pointer]:
                - /url: "#cite_note-PlayStationAwards_2013-194"
            - text: and the Community Choice award from Destructoid.
            - superscript [ref=e1270]:
              - link "[180]" [ref=e1271] [cursor=pointer]:
                - /url: "#cite_note-Dest-COMM-195"
            - text: The game received the Platinum Award at the PlayStation Awards
            - superscript [ref=e1272]:
              - link "[179]" [ref=e1273] [cursor=pointer]:
                - /url: "#cite_note-PlayStationAwards_2013-194"
            - text: and was named the Best British Game from BAFTA.
            - superscript [ref=e1274]:
              - link "[167]" [ref=e1275] [cursor=pointer]:
                - /url: "#cite_note-bafta-182"
            - text: At IGN's Best of 2013 Awards, it earned multiple wins, including Best Xbox 360 Graphics,
            - superscript [ref=e1276]:
              - link "[177]" [ref=e1277] [cursor=pointer]:
                - /url: "#cite_note-IGN-XBOXGraphics-192"
            - text: Best Xbox 360 Sound,
            - superscript [ref=e1278]:
              - link "[181]" [ref=e1279] [cursor=pointer]:
                - /url: "#cite_note-IGN-XBOXSound-196"
            - text: and Best Action Game on Xbox 360,
            - superscript [ref=e1280]:
              - link "[164]" [ref=e1281] [cursor=pointer]:
                - /url: "#cite_note-IGNXBOX-179"
            - text: PlayStation 3
            - superscript [ref=e1282]:
              - link "[182]" [ref=e1283] [cursor=pointer]:
                - /url: "#cite_note-IGN-PS3Action-197"
            - text: and overall.
            - superscript [ref=e1284]:
              - link "[183]" [ref=e1285] [cursor=pointer]:
                - /url: "#cite_note-IGN-Action-198"
