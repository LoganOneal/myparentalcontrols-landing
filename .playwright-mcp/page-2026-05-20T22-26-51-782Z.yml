            - superscript [ref=e620]:
              - link "[80]" [ref=e621] [cursor=pointer]:
                - /url: "#cite_note-Re-re-release_anger_4-94"
            - text: The PC version received the enhancements in a free update on 4 March 2025.
            - superscript [ref=e622]:
