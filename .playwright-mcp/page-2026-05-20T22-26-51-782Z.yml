            - text: and
            - link "Xbox Series X/S" [ref=e605] [cursor=pointer]:
              - /url: /wiki/Xbox_Series_X/S
            - text: ","
            - superscript [ref=e606]:
              - link "[75]" [ref=e607] [cursor=pointer]:
                - /url: "#cite_note-Push_RT-89"
            - text: it features technical enhancements and performance updates.
            - superscript [ref=e608]:
              - link "[74]" [ref=e609] [cursor=pointer]:
                - /url: "#cite_note-GameSpot_PS5-88"
            - text: A trailer released for the new version in September 2021 was met with negativity, becoming one of the most-disliked videos on
            - link "PlayStation" [ref=e610] [cursor=pointer]:
              - /url: /wiki/PlayStation
            - text: "'s"
            - link "YouTube" [ref=e611] [cursor=pointer]:
