            - superscript [ref=e545]:
              - link "[62]" [ref=e546] [cursor=pointer]:
                - /url: "#cite_note-CNET_change-76"
            - text: The game missed its original projected Q2 2013 release date, pushed back to 17 September to allow for further polishing.
            - superscript [ref=e547]:
              - link "[63]" [ref=e548] [cursor=pointer]:
                - /url: "#cite_note-IGN_September-77"
            - text: To spur
            - link "pre-order" [ref=e549] [cursor=pointer]:
              - /url: /wiki/Pre-order
            - text: game sales, Rockstar collaborated with several retail outlets to make a
            - link "special edition" [ref=e550] [cursor=pointer]:
              - /url: /wiki/Special_edition
            - text: with extra in-game features.
            - superscript [ref=e551]:
              - link "[64]" [ref=e552] [cursor=pointer]:
