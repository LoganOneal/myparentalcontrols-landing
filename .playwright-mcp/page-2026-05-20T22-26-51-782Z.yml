            - rowgroup
          - heading "Controversies" [level=2] [ref=e1628]
          - figure "The mission \"By the Book\" requires players to use torture techniques including waterboarding to interrogate a man. Journalists noted the mission's function as political commentary, but some felt that the use of torture was in poor taste.[112][114][121]" [ref=e1629]:
            - link "A man is strapped to an overturned chair with a cloth concealing his face. Player character Trevor stands over him with a canister, about to pour water on his face. A text prompt in the upper left-hand corner reads \"Hold [left stick] to pour water.\"" [ref=e1630] [cursor=pointer]:
              - /url: /wiki/File:Grand_Theft_Auto_V_torture_sequence.jpg
              - img "A man is strapped to an overturned chair with a cloth concealing his face. Player character Trevor stands over him with a canister, about to pour water on his face. A text prompt in the upper left-hand corner reads \"Hold [left stick] to pour water.\"" [ref=e1631]
            - generic [ref=e1632]:
              - text: The mission "By the Book" requires players to use torture techniques including
              - link "waterboarding" [ref=e1633] [cursor=pointer]:
                - /url: /wiki/Waterboarding
              - text: to interrogate a man. Journalists noted the mission's function as political commentary, but some felt that the use of torture was in poor taste.
              - superscript [ref=e1634]:
                - link "[112]" [ref=e1635] [cursor=pointer]:
                  - /url: "#cite_note-Gamespot_Review-127"
              - superscript [ref=e1636]:
                - link "[114]" [ref=e1637] [cursor=pointer]:
                  - /url: "#cite_note-IGN_Review-129"
              - superscript [ref=e1638]:
                - link "[121]" [ref=e1639] [cursor=pointer]:
                  - /url: "#cite_note-Polygon_Review-136"
          - paragraph [ref=e1640]:
            - text: The mission "By the Book", which requires players to use torture equipment in a hostage
            - link "interrogation" [ref=e1641] [cursor=pointer]:
              - /url: /wiki/Interrogation
            - text: ", unsettled reviewers. They noted its political commentary on"
            - link "the use of torture by the United States government" [ref=e1642] [cursor=pointer]:
              - /url: /wiki/Torture_in_the_United_States
            - text: but found the sequence to be in poor taste.
            - superscript [ref=e1643]:
              - link "[114]" [ref=e1644] [cursor=pointer]:
                - /url: "#cite_note-IGN_Review-129"
            - superscript [ref=e1645]:
              - link "[121]" [ref=e1646] [cursor=pointer]:
                - /url: "#cite_note-Polygon_Review-136"
            - text: GameSpot felt that placing the torture scene in context with an analogous monologue by Trevor created a hypocrisy in the mission's function as a commentary device.
            - superscript [ref=e1647]:
              - link "[112]" [ref=e1648] [cursor=pointer]:
                - /url: "#cite_note-Gamespot_Review-127"
            - text: Eurogamer felt the close-up camera and
            - link "quick time events" [ref=e1649] [cursor=pointer]:
              - /url: /wiki/Quick_time_event
            - text: accentuated the sequence's impact beyond the violence depicted in previous Grand Theft Auto games, and considered the sequence lacking enough context to justify its violence.
            - superscript [ref=e1650]:
              - link "[199]" [ref=e1651] [cursor=pointer]:
                - /url: "#cite_note-EU_disturb-214"
            - text: The mission received criticism from politicians and anti-torture charity groups.
            - superscript [ref=e1652]:
              - link "[200]" [ref=e1653] [cursor=pointer]:
                - /url: "#cite_note-Guard_torture-215"
            - text: Independent journalist Tom Chick defended the torture sequence, and wrote that unlike
            - 'link "Call of Duty: Modern Warfare 2" [ref=e1655] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_2
            - text: "'s \""
            - link "No Russian" [ref=e1656] [cursor=pointer]:
              - /url: /wiki/No_Russian
            - text: "\" mission or the 2012 film"
            - link "Zero Dark Thirty" [ref=e1658] [cursor=pointer]:
              - /url: /wiki/Zero_Dark_Thirty
            - text: ", the underlying political commentary on torture in \"By the Book\" necessitated the violent content."
            - superscript [ref=e1659]:
              - link "[31]" [ref=e1660] [cursor=pointer]:
                - /url: "#cite_note-Tom_Chick_GTA_V-41"
            - text: The torture gameplay was cut from the Japanese release.
            - superscript [ref=e1661]:
              - link "[201]" [ref=e1662] [cursor=pointer]:
                - /url: "#cite_note-Japan_Torture_1-216"
            - superscript [ref=e1663]:
              - link "[202]" [ref=e1664] [cursor=pointer]:
                - /url: "#cite_note-Japan_Torture_2-217"
          - paragraph [ref=e1665]:
            - text: Several reviewers found the game's portrayal of women
            - link "misogynistic" [ref=e1666] [cursor=pointer]:
              - /url: /wiki/Misogynistic
            - text: ;
            - superscript [ref=e1667]:
              - link "[121]" [ref=e1668] [cursor=pointer]:
                - /url: "#cite_note-Polygon_Review-136"
            - superscript [ref=e1669]:
              - link "[203]" [ref=e1670] [cursor=pointer]:
                - /url: "#cite_note-LAT_Review-218"
            - link "VG247" [ref=e1672] [cursor=pointer]:
              - /url: /wiki/VG247
            - text: wrote the female characters were "either there to be rescued, shouted at, fucked, to be seen fucking, put up with, killed, heard prattling away like dullards on their mobile phones or shopping".
            - superscript [ref=e1673]:
              - link "[204]" [ref=e1674] [cursor=pointer]:
                - /url: "#cite_note-VG247_misogyny-219"
            - text: Edge noted the game treated its all-male lead characters in a similar vein through their stereotyped tendencies towards violence.
            - superscript [ref=e1675]:
              - link "[125]" [ref=e1676] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEEdge201388-140"
            - text: After GameSpot's Carolyn Petit claimed the game was misogynistic, her review was met with backlash as users responded with 20,000 largely negative comments on the webpage and a
            - link "Change.org" [ref=e1677] [cursor=pointer]:
              - /url: /wiki/Change.org
            - text: petition for her firing.
            - superscript [ref=e1678]:
              - link "[205]" [ref=e1679] [cursor=pointer]:
                - /url: "#cite_note-MCV_Petit-220"
            - text: Many journalists defended her right to an opinion and lamented the gaming community's defensiveness towards criticism.
            - superscript [ref=e1680]:
              - link "[206]" [ref=e1681] [cursor=pointer]:
                - /url: "#cite_note-GTA5_Misogynistic_Violent-221"
            - superscript [ref=e1682]:
              - link "[207]" [ref=e1683] [cursor=pointer]:
                - /url: "#cite_note-Tele_degrade-222"
          - paragraph [ref=e1684]:
            - text: Australian department stores
            - link "Target" [ref=e1685] [cursor=pointer]:
              - /url: /wiki/Target_Australia
            - text: and
            - link "Kmart" [ref=e1686] [cursor=pointer]:
              - /url: /wiki/Kmart_Australia
            - text: pulled the game from their stores in December 2014 after a Change.org petition against depictions of violence towards women in the game amassed over 40,000 signatures.
            - superscript [ref=e1687]:
              - link "[208]" [ref=e1688] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Target-223"
            - superscript [ref=e1689]:
              - link "[209]" [ref=e1690] [cursor=pointer]:
                - /url: "#cite_note-ABC_Target-224"
            - link "Take-Two Interactive" [ref=e1691] [cursor=pointer]:
              - /url: /wiki/Take-Two_Interactive
            - text: chief operating officer
            - link "Strauss Zelnick" [ref=e1692] [cursor=pointer]:
              - /url: /wiki/Strauss_Zelnick
            - text: publicly expressed the company's disappointment that the game had been pulled from the retailers, and affirmed that he "stand[s] behind our products, the people who create them, and the consumers who play them".
            - superscript [ref=e1693]:
              - link "[208]" [ref=e1694] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Target-223"
            - text: IGN called the Change.org petition "misinformed", stating that its complaints about incentives for committing sexual violence in the game are untrue. Sexual violence in games is forbidden by the
            - link "Australian Classification Board" [ref=e1695] [cursor=pointer]:
              - /url: /wiki/Australian_Classification_Board
            - text: ", meaning the game would have been refused classification."
            - superscript [ref=e1696]:
              - link "[210]" [ref=e1697] [cursor=pointer]:
                - /url: "#cite_note-Target_snub-225"
            - link "Kotaku" [ref=e1699] [cursor=pointer]:
              - /url: /wiki/Kotaku
            - text: said that the depiction of women is inherently problematic, and that Target were within their rights to refuse to stock the game and were obligated to respond to the petition's wide support.
            - superscript [ref=e1700]:
              - link "[211]" [ref=e1701] [cursor=pointer]:
                - /url: "#cite_note-Kotaku_Target-226"
          - paragraph [ref=e1702]:
            - text: Petit (writing for Kotaku) and online anti-harassment activist Ben Colliver criticised the game's depiction of
            - link "transgender" [ref=e1703] [cursor=pointer]:
              - /url: /wiki/Transgender
            - text: characters as
            - link "sex workers" [ref=e1704] [cursor=pointer]:
              - /url: /wiki/Sex_worker
            - text: with primarily muscular bodies, describing it as harmful
            - link "transphobic" [ref=e1705] [cursor=pointer]:
              - /url: /wiki/Transphobic
            - text: stereotypes;
            - superscript [ref=e1706]:
              - link "[212]" [ref=e1707] [cursor=pointer]:
                - /url: "#cite_note-Colliver-227"
            - superscript [ref=e1708]:
              - link "[213]" [ref=e1709] [cursor=pointer]:
                - /url: "#cite_note-Petit_trans-228"
            - text: Colliver wrote that the representation "does not reflect the complex, nuanced structures that often regulate transgender people's lives".
            - superscript [ref=e1710]:
              - link "[212]" [ref=e1711] [cursor=pointer]:
                - /url: "#cite_note-Colliver-227"
            - text: The April 2022 re-release on PlayStation 5 and Xbox Series X/S removed the content from all portions of the game except Director Mode, meaning their models are accessible but without dialogue options. Some journalists recognised the removal may have been prompted by an
            - link "open letter" [ref=e1712] [cursor=pointer]:
              - /url: /wiki/Open_letter
            - text: written by
            - link "LGBTQ+" [ref=e1713] [cursor=pointer]:
              - /url: /wiki/LGBTQ%2B
            - text: advocacy group Out Making Games, who requested the removal after reading Petit's article. The group praised Rockstar's decision to remove the content.
            - superscript [ref=e1714]:
              - link "[214]" [ref=e1715] [cursor=pointer]:
                - /url: "#cite_note-VGC_trans-229"
            - superscript [ref=e1716]:
              - link "[215]" [ref=e1717] [cursor=pointer]:
                - /url: "#cite_note-GS_trans-230"
            - superscript [ref=e1718]:
              - link "[216]" [ref=e1719] [cursor=pointer]:
                - /url: "#cite_note-EU_trans-231"
          - paragraph [ref=e1720]:
            - text: In October 2013, rapper
            - link "Daz Dillinger" [ref=e1721] [cursor=pointer]:
              - /url: /wiki/Daz_Dillinger
            - text: issued a cease and desist letter to Rockstar Games and Take Two Interactive for allegedly using two of his songs without authorisation.
            - superscript [ref=e1722]:
              - link "[217]" [ref=e1723] [cursor=pointer]:
                - /url: "#cite_note-Dillinger-232"
            - superscript [ref=e1724]:
              - link "[p]" [ref=e1725] [cursor=pointer]:
                - /url: "#cite_note-233"
            - text: In February 2014, television personality Karen Gravano of the reality television programme
            - link "Mob Wives" [ref=e1727] [cursor=pointer]:
              - /url: /wiki/Mob_Wives
            - text: filed suit against Rockstar Games in allegation that a character in the game is based on her likeness and story and was depicted without her consent.
            - superscript [ref=e1728]:
              - link "[218]" [ref=e1729] [cursor=pointer]:
                - /url: "#cite_note-Gravano-234"
            - superscript [ref=e1730]:
              - link "[q]" [ref=e1731] [cursor=pointer]:
                - /url: "#cite_note-235"
            - text: Rockstar filed to dismiss Gravano's lawsuit in April, and stated that the allegations are foreclosed by the
            - link "First Amendment" [ref=e1732] [cursor=pointer]:
              - /url: /wiki/First_Amendment
            - text: .
            - superscript [ref=e1733]:
              - link "[219]" [ref=e1734] [cursor=pointer]:
                - /url: "#cite_note-LS_lawsuit-236"
            - text: In July, actress
            - link "Lindsay Lohan" [ref=e1735] [cursor=pointer]:
              - /url: /wiki/Lindsay_Lohan
            - text: filed a lawsuit, claiming elements in the game, including the Lacey Jonas character, were influenced by her image, voice and clothing line without permission.
            - superscript [ref=e1736]:
              - link "[220]" [ref=e1737] [cursor=pointer]:
                - /url: "#cite_note-bbc_lohan-237"
            - text: Rockstar responded in court papers that sought a dismissal of the case, saying that the case was frivolous and filed for publicity purposes.
            - superscript [ref=e1738]:
              - link "[221]" [ref=e1739] [cursor=pointer]:
                - /url: "#cite_note-EU_Lohan-238"
            - text: In 2016, both lawsuits were dismissed.
            - superscript [ref=e1740]:
              - link "[222]" [ref=e1741] [cursor=pointer]:
                - /url: "#cite_note-CTV_dismiss-239"
          - heading "Sales" [level=2] [ref=e1743]
          - paragraph [ref=e1744]:
            - text: Within 24 hours of its release, Grand Theft Auto V generated more than US$815 million in worldwide revenue, equating to approximately 11.21 million copies sold for Take-Two Interactive.
            - superscript [ref=e1745]:
              - link "[223]" [ref=e1746] [cursor=pointer]:
                - /url: "#cite_note-guinness-240"
            - superscript [ref=e1747]:
              - link "[r]" [ref=e1748] [cursor=pointer]:
                - /url: "#cite_note-242"
            - text: The numbers nearly doubled analysts' expectations for the title.
            - superscript [ref=e1749]:
              - link "[225]" [ref=e1750] [cursor=pointer]:
                - /url: "#cite_note-Variety_800-243"
            - superscript [ref=e1751]:
              - link "[226]" [ref=e1752] [cursor=pointer]:
                - /url: "#cite_note-Reuters_800-244"
            - text: Three days after its release, the game had surpassed one billion dollars in sales, making it the fastest-selling entertainment product in history.
            - superscript [ref=e1753]:
              - link "[227]" [ref=e1754] [cursor=pointer]:
                - /url: "#cite_note-IGN_1_bn-245"
            - superscript [ref=e1755]:
              - link "[s]" [ref=e1756] [cursor=pointer]:
                - /url: "#cite_note-247"
            - text: Six weeks after its release, Rockstar had shipped nearly 29 million copies of the game to retailers, exceeding the lifetime figures of Grand Theft Auto IV.
            - superscript [ref=e1757]:
              - link "[229]" [ref=e1758] [cursor=pointer]:
                - /url: "#cite_note-EU_6_wks-248"
            - text: On 7 October 2013, the game became the best-selling digital release on
            - link "PlayStation Store" [ref=e1759] [cursor=pointer]:
              - /url: /wiki/PlayStation_Store
            - text: for PlayStation 3, breaking the previous record set by
            - link "The Last of Us" [ref=e1761] [cursor=pointer]:
              - /url: /wiki/The_Last_of_Us_(video_game)
            - text: ", though numerical sales figures were not disclosed."
            - superscript [ref=e1762]:
              - link "[230]" [ref=e1763] [cursor=pointer]:
                - /url: "#cite_note-PS3_digital-249"
            - superscript [ref=e1764]:
              - link "[231]" [ref=e1765] [cursor=pointer]:
                - /url: "#cite_note-IGN_lifetime-250"
            - text: It broke seven
            - link "Guinness World Records" [ref=e1766] [cursor=pointer]:
              - /url: /wiki/Guinness_World_Records
            - text: "on 8 October: best-selling video game in 24 hours, best-selling action-adventure video game in 24 hours, highest-grossing video game in 24 hours, fastest entertainment property to gross US$1 billion, fastest video game to gross US$1 billion, highest revenue generated by an entertainment product in 24 hours, and most viewed trailer for an action-adventure video game."
            - superscript [ref=e1767]:
              - link "[2]" [ref=e1768] [cursor=pointer]:
                - /url: "#cite_note-Guinness_World_Record-3"
          - paragraph [ref=e1769]:
            - text: A digital version was released on 18 October for the Xbox 360,
            - superscript [ref=e1770]:
              - link "[232]" [ref=e1771] [cursor=pointer]:
                - /url: "#cite_note-X360_digital-251"
            - text: which went on to become the highest-grossing day-one and week-one release on
            - link "Xbox Live" [ref=e1772] [cursor=pointer]:
              - /url: /wiki/Xbox_Live
            - text: .
            - superscript [ref=e1773]:
              - link "[233]" [ref=e1774] [cursor=pointer]:
                - /url: "#cite_note-CVG_29-252"
            - text: By May 2014, the game had generated nearly US$1.98 billion in revenue.
            - superscript [ref=e1775]:
              - link "[234]" [ref=e1776] [cursor=pointer]:
                - /url: "#cite_note-Forbes_2_bn-253"
            - text: As of August 2014, the game had sold-in over 34 million units to retailers for the PlayStation 3 and Xbox 360.
            - superscript [ref=e1777]:
              - link "[235]" [ref=e1778] [cursor=pointer]:
                - /url: "#cite_note-T2_34-254"
            - text: By December 2014, the game had shipped 45 million copies, including 10 million copies of the re-released version.
            - superscript [ref=e1779]:
              - link "[236]" [ref=e1780] [cursor=pointer]:
                - /url: "#cite_note-Eurogamer_Sales_1-255"
            - text: By April 2018,
            - link "MarketWatch" [ref=e1782] [cursor=pointer]:
              - /url: /wiki/MarketWatch
            - text: reported the game had generated about $6 billion and was the most profitable entertainment product of all time;
            - superscript [ref=e1783]:
              - link "[237]" [ref=e1784] [cursor=pointer]:
                - /url: "#cite_note-VG247_profitable-256"
            - superscript [ref=e1785]:
              - link "[238]" [ref=e1786] [cursor=pointer]:
                - /url: "#cite_note-PCG_profitable-257"
            - text: it had nearly sold around 100 million copies by July 2018,
            - superscript [ref=e1787]:
              - link "[239]" [ref=e1788] [cursor=pointer]:
                - /url: "#cite_note-Variety_100-258"
            - text: and by July 2021, it had shipped over 150 million copies.
            - superscript [ref=e1789]:
              - link "[240]" [ref=e1790] [cursor=pointer]:
                - /url: "#cite_note-GS_150-259"
            - text: More copies were sold in 2020 than any other year since the game's launch in 2013.
            - superscript [ref=e1791]:
              - link "[241]" [ref=e1792] [cursor=pointer]:
                - /url: "#cite_note-CBS_140-260"
            - text: By late 2023,
            - link "Barron's" [ref=e1794] [cursor=pointer]:
              - /url: /wiki/Barron%27s
            - text: reported the game's lifetime revenue figures had increased to $8.5 billion, consistently generating over $500 million annually with about 22 million monthly active players;
            - superscript [ref=e1795]:
              - link "[242]" [ref=e1796] [cursor=pointer]:
                - /url: "#cite_note-Barrons-261"
            - text: by December 2025, the game had shipped 225 million copies worldwide across all platforms.
            - superscript [ref=e1797]:
              - link "[243]" [ref=e1798] [cursor=pointer]:
                - /url: "#cite_note-GameSpot_225-262"
            - text: In May 2025,
            - link "The Hindu" [ref=e1800] [cursor=pointer]:
              - /url: /wiki/The_Hindu
            - text: reported that the game had generated nearly $10 billion in revenue since its release.
            - superscript [ref=e1801]:
              - link "[244]" [ref=e1802] [cursor=pointer]:
                - /url: "#cite_note-The_Hindu-263"
          - paragraph [ref=e1803]:
            - text: In the United Kingdom, the game became the all-time fastest-selling game, selling more than 2.25 million copies in five days. This broke the record set by
            - 'link "Call of Duty: Black Ops" [ref=e1805] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops
            - text: at two million copies over the same period. It broke the day one record by selling 1.57 million copies and generating £65 million.
            - superscript [ref=e1806]:
              - link "[245]" [ref=e1807] [cursor=pointer]:
                - /url: "#cite_note-IGN_UK_sales-264"
            - text: In two weeks, the game sold more than 2.6 million copies and generated £90 million, which accounted for 52% of games sold in September 2013.
            - superscript [ref=e1808]:
              - link "[246]" [ref=e1809] [cursor=pointer]:
                - /url: "#cite_note-VG247_UK-265"
            - text: After three weeks on sale, it beat Grand Theft Auto IV's lifetime sales in the United Kingdom.
            - superscript [ref=e1810]:
              - link "[247]" [ref=e1811] [cursor=pointer]:
                - /url: "#cite_note-EU_UK-266"
            - text: In its fourth week, it became the fastest-selling title to break the three million barrier in the UK, thus overtaking
            - link "Black Ops II" [ref=e1813] [cursor=pointer]:
              - /url: /wiki/Black_Ops_II
            - text: "'s lifetime sales."
            - superscript [ref=e1814]:
              - link "[248]" [ref=e1815] [cursor=pointer]:
                - /url: "#cite_note-EU_3_mln-267"
            - text: In November 2014, the game became the best-selling game of all time in the UK, overtaking Black Ops.
            - superscript [ref=e1816]:
              - link "[249]" [ref=e1817] [cursor=pointer]:
                - /url: "#cite_note-EU_UK_best-268"
            - text: "The game was similarly successful in North America: it was the best selling game in September, representing over 50% of software sales"
            - superscript [ref=e1818]:
              - link "[250]" [ref=e1819] [cursor=pointer]:
                - /url: "#cite_note-GS_surging-269"
            - text: and boosting overall software sales by 52% compared to September 2012.
            - superscript [ref=e1820]:
              - link "[251]" [ref=e1821] [cursor=pointer]:
                - /url: "#cite_note-CVG_revitalise-270"
          - heading "Legacy" [level=2] [ref=e1823]
          - paragraph [ref=e1824]:
            - text: Critics agreed that Grand Theft Auto V was among
            - link "seventh-generation console gaming" [ref=e1825] [cursor=pointer]:
              - /url: /wiki/Seventh_generation_of_video_game_consoles
            - text: "'s best"
            - superscript [ref=e1826]:
              - link "[27]" [ref=e1827] [cursor=pointer]:
                - /url: "#cite_note-GamesRadar_Review-35"
            - text: and a great closing title before the
            - link "eighth generation" [ref=e1828] [cursor=pointer]:
              - /url: /wiki/Eighth_generation_of_video_game_consoles
            - text: "'s emergence."
            - superscript [ref=e1829]:
              - link "[252]" [ref=e1830] [cursor=pointer]:
                - /url: "#cite_note-XGN_Review-271"
            - superscript [ref=e1831]:
              - link "[253]" [ref=e1832] [cursor=pointer]:
                - /url: "#cite_note-Gameplanet_Review-272"
            - text: Polygon observed that the game would "bridge between games' present and the future", and declared it "the closure of this generation, and the benchmark for the next".
            - superscript [ref=e1833]:
              - link "[121]" [ref=e1834] [cursor=pointer]:
                - /url: "#cite_note-Polygon_Review-136"
            - text: Kyle Prahl of PlayStation Universe felt that the game "gives this console generation the send-off it deserves",
            - superscript [ref=e1835]:
              - link "[254]" [ref=e1836] [cursor=pointer]:
                - /url: "#cite_note-PSU.com_Review-273"
            - text: and VideoGamer.com considered it "the ultimate
            - link "swansong" [ref=e1837] [cursor=pointer]:
              - /url: /wiki/Swan_song
            - text: for this console cycle" that would "cast a long shadow over the next".
            - superscript [ref=e1838]:
              - link "[255]" [ref=e1839] [cursor=pointer]:
                - /url: "#cite_note-VideoGamer.com_Review-274"
            - text: Three days after its release, the game ranked second on IGN''s "Top 25 Xbox 360 Games" list. They considered that the open world's scale and detail succeeded the majority of other Xbox 360 games. They called the game "a triumph both for gamers and for the medium itself, and it deserves its runaway success".
            - superscript [ref=e1840]:
              - link "[256]" [ref=e1841] [cursor=pointer]:
                - /url: "#cite_note-IGN_X360_25-275"
            - text: In November 2013, Hardcore Gamer placed the game third on their "Top 100 Games of the Generation" list. They cited its improved shooting and driving mechanics over its predecessors, and considered the multiple protagonist design "a welcome change of pace" that could become an eighth-generation gaming benchmark.
            - superscript [ref=e1842]:
              - link "[257]" [ref=e1843] [cursor=pointer]:
                - /url: "#cite_note-HG_generation-276"
            - text: In December, The Daily Telegraph listed the game among their "50 best games of the console generation". They called it a "cultural behemoth" that "will be Rockstar's lasting legacy".
            - superscript [ref=e1844]:
              - link "[258]" [ref=e1845] [cursor=pointer]:
                - /url: "#cite_note-Tele_generation-277"
          - paragraph [ref=e1846]:
            - text: In January 2014, Computer and Video Games ranked the game fourth on their "Games of the Generation" list. They said that for the first time, Rockstar created an "utterly beautiful" open world. They found that the game did away with Grand Theft Auto IV's repetitive mission design and focused instead on fun gameplay.
            - superscript [ref=e1847]:
              - link "[259]" [ref=e1848] [cursor=pointer]:
                - /url: "#cite_note-CVG_generation-278"
            - text: In May, IGN ranked it eighth on their "Top 100 Games of a Generation" list and called it a "huge, raucous, and wildly ambitious bridge towards the [eighth] generation of console gaming".
            - superscript [ref=e1849]:
              - link "[260]" [ref=e1850] [cursor=pointer]:
                - /url: "#cite_note-IGN_generation-279"
            - text: "The next month, it placed third on IGN's \"Games of a Generation: Your Top 100\" list as voted by the site's readers."
            - superscript [ref=e1851]:
              - link "[261]" [ref=e1852] [cursor=pointer]:
                - /url: "#cite_note-IGN_your_100-280"
            - text: In August, Game Informer ranked it third on their "Top 10 Action Games Of The Generation" list. They compared the game's quality to that of its predecessor but thought that its ensemble character set-up, varied missions and multiplayer superseded Grand Theft Auto IV's placement on the list. They wrote of the story's absurd drama and the open world's vastness, and did not "regret a single second" spent playing the game.
            - superscript [ref=e1853]:
              - link "[262]" [ref=e1854] [cursor=pointer]:
                - /url: "#cite_note-GI_generation-281"
            - text: In November, Edge named it the fifth-best game of its generation and commented that "no other game studio is even daring to attempt an open world game in its tradition because there is simply no possibility of measuring up to [its] standards."
            - superscript [ref=e1855]:
              - link "[263]" [ref=e1856] [cursor=pointer]:
                - /url: "#cite_note-E272-282"
            - text: In 2015, the publication rated it the second-greatest video game of all time.
            - superscript [ref=e1857]:
              - link "[264]" [ref=e1858] [cursor=pointer]:
                - /url: "#cite_note-Edge_100-283"
          - paragraph [ref=e1859]:
            - text: The game ranked high on several best game lists determined by the public; it featured eighth on
            - link "Empire" [ref=e1861] [cursor=pointer]:
              - /url: /wiki/Empire_(magazine)
            - text: "'s \"100 Greatest Video Games Of All Time\" list, and fifth on"
            - link "Good Game" [ref=e1863] [cursor=pointer]:
              - /url: /wiki/Good_Game_(TV_program)
            - text: "'s \"Top 100 Games\" list, as voted by the magazine and programme's respective audiences."
            - superscript [ref=e1864]:
              - link "[265]" [ref=e1865] [cursor=pointer]:
                - /url: "#cite_note-Empire_100-284"
            - superscript [ref=e1866]:
              - link "[266]" [ref=e1867] [cursor=pointer]:
                - /url: "#cite_note-GG_100-285"
            - text: Grand Theft Auto V was the most
            - link "tweeted" [ref=e1868] [cursor=pointer]:
              - /url: /wiki/Twitter
            - text: game of 2015, despite being released over a year earlier.
            - superscript [ref=e1869]:
              - link "[267]" [ref=e1870] [cursor=pointer]:
                - /url: "#cite_note-Tweeted-286"
            - text: In 2025,
            - link "Rolling Stone" [ref=e1872] [cursor=pointer]:
              - /url: /wiki/Rolling_Stone
            - text: ranked it the third-best game, citing its "profound effect" on the medium.
            - superscript [ref=e1873]:
              - link "[268]" [ref=e1874] [cursor=pointer]:
                - /url: "#cite_note-RS_50-287"
            - text: According to
            - link "Circana" [ref=e1875] [cursor=pointer]:
              - /url: /wiki/Circana
            - text: senior director Mat Piscatella, the game was the third-most-played game on PlayStation in the United States in both 2024 and 2025.
            - superscript [ref=e1876]:
              - link "[269]" [ref=e1877] [cursor=pointer]:
                - /url: "#cite_note-VGC_Circana-288"
          - paragraph [ref=e1878]:
            - text: Development of
            - link "Grand Theft Auto VI" [ref=e1880] [cursor=pointer]:
              - /url: /wiki/Grand_Theft_Auto_VI
            - text: was confirmed by Rockstar in February 2022;
