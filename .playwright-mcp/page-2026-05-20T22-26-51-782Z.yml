          - paragraph [ref=e215]:
            - generic [ref=e216]: Grand Theft Auto V
            - text: is a 2013
            - link "action-adventure game" [ref=e217] [cursor=pointer]:
              - /url: /wiki/Action-adventure_game
            - text: developed by
            - link "Rockstar North" [ref=e218] [cursor=pointer]:
              - /url: /wiki/Rockstar_North
            - text: and published by
            - link "Rockstar Games" [ref=e219] [cursor=pointer]:
              - /url: /wiki/Rockstar_Games
            - text: . It is the seventh main entry in the
            - link "Grand Theft Auto series" [ref=e220] [cursor=pointer]:
              - /url: /wiki/Grand_Theft_Auto
            - text: ", following 2008's"
            - link "Grand Theft Auto IV" [ref=e222] [cursor=pointer]:
              - /url: /wiki/Grand_Theft_Auto_IV
            - text: ", and the fifteenth instalment overall. Set within the fictional state of"
            - link "San Andreas" [ref=e223] [cursor=pointer]:
              - /url: /wiki/San_Andreas_(Grand_Theft_Auto)
            - text: ", based on"
            - link "Southern California" [ref=e224] [cursor=pointer]:
              - /url: /wiki/Southern_California
            - text: ", the"
            - link "single-player" [ref=e225] [cursor=pointer]:
              - /url: /wiki/Single-player
            - text: story follows three
            - link "protagonists" [ref=e226] [cursor=pointer]:
              - /url: /wiki/Protagonist
            - text: —retired
            - link "bank robber" [ref=e227] [cursor=pointer]:
              - /url: /wiki/Bank_robber
            - text: Michael De Santa (
            - link "Ned Luke" [ref=e228] [cursor=pointer]:
              - /url: /wiki/Ned_Luke
            - text: ), street
            - link "gangster" [ref=e229] [cursor=pointer]:
              - /url: /wiki/Gangster
            - text: Franklin Clinton (
            - link "Shawn Fonteno" [ref=e230] [cursor=pointer]:
              - /url: /wiki/Shawn_Fonteno
            - text: ), and drug dealer and
            - link "gunrunner" [ref=e231] [cursor=pointer]:
              - /url: /wiki/Gunrunner
            - link "Trevor Philips" [ref=e232] [cursor=pointer]:
              - /url: /wiki/Trevor_Philips
            - text: (
            - link "Steven Ogg" [ref=e233] [cursor=pointer]:
              - /url: /wiki/Steven_Ogg
            - text: )—and their attempts to commit heists while under pressure from a corrupt government agency and powerful criminals. Players
            - link "freely roam" [ref=e234] [cursor=pointer]:
              - /url: /wiki/Nonlinear_gameplay
            - text: San Andreas's
            - link "open world" [ref=e235] [cursor=pointer]:
              - /url: /wiki/Open_world
            - text: countryside and fictional city of Los Santos, based on
            - link "Los Angeles" [ref=e236] [cursor=pointer]:
              - /url: /wiki/Los_Angeles
            - text: .
          - paragraph [ref=e237]:
            - text: The game world is navigated on foot and by vehicle, from either a
            - link "third-person" [ref=e238] [cursor=pointer]:
              - /url: /wiki/Third-person_(video_games)
            - text: or
            - link "first-person" [ref=e239] [cursor=pointer]:
              - /url: /wiki/First-person_(video_games)
            - text: perspective. Players control the protagonists throughout single-player and switch among them, both during and outside missions. The story is centred on the heist sequences, and many missions involve shooting and driving gameplay. A "wanted" system governs the aggression of law enforcement response to players who commit crimes. In
            - link "Grand Theft Auto Online" [ref=e241] [cursor=pointer]:
              - /url: /wiki/Grand_Theft_Auto_Online
            - text: ", the game's"
            - link "online multiplayer" [ref=e242] [cursor=pointer]:
              - /url: /wiki/Online_multiplayer
            - text: mode, up to 30 players engage in a variety of different
            - link "cooperative" [ref=e243] [cursor=pointer]:
              - /url: /wiki/Cooperative_video_game
            - text: and competitive game modes.
          - paragraph [ref=e244]:
            - text: Shared between many of Rockstar's studios worldwide,
            - link "the game's development" [ref=e245] [cursor=pointer]:
              - /url: /wiki/Development_of_Grand_Theft_Auto_V
            - text: began around the time of Grand Theft Auto IV's release. The developers drew influence from many of their previous projects (such as
            - link "Red Dead Redemption" [ref=e247] [cursor=pointer]:
              - /url: /wiki/Red_Dead_Redemption
            - text: and
            - link "Max Payne 3" [ref=e249] [cursor=pointer]:
              - /url: /wiki/Max_Payne_3
            - text: ) and designed the game around three lead protagonists to innovate on the core structure of its predecessors. Much of the development work constituted the open world's creation, and several team members conducted field research around California to capture footage for the design team.
            - link "The game's soundtrack" [ref=e250] [cursor=pointer]:
              - /url: /wiki/Music_of_Grand_Theft_Auto_V
            - text: features an original score composed by a team of producers who collaborated over several years. Grand Theft Auto V was released in September 2013 for the
            - link "PlayStation 3" [ref=e251] [cursor=pointer]:
              - /url: /wiki/PlayStation_3
            - text: and
            - link "Xbox 360" [ref=e252] [cursor=pointer]:
              - /url: /wiki/Xbox_360
            - text: ", in November 2014 for the"
            - link "PlayStation 4" [ref=e253] [cursor=pointer]:
              - /url: /wiki/PlayStation_4
            - text: and
            - link "Xbox One" [ref=e254] [cursor=pointer]:
              - /url: /wiki/Xbox_One
            - text: ", in April 2015 for"
            - link "Windows" [ref=e255] [cursor=pointer]:
              - /url: /wiki/Windows
            - text: ", and in March 2022 for the"
            - link "PlayStation 5" [ref=e256] [cursor=pointer]:
              - /url: /wiki/PlayStation_5
            - text: and
            - link "Xbox Series X/S" [ref=e257] [cursor=pointer]:
              - /url: /wiki/Xbox_Series_X/S
            - text: .
          - paragraph [ref=e258]:
            - text: Extensively marketed and widely anticipated, the game broke industry sales records and became the fastest-selling entertainment product in history, earning $800 million in its first day and $1 billion in its first three days. It received critical acclaim, with praise directed at its multiple-protagonist design, open world, presentation and gameplay. However, its depiction of violence and women caused controversies. Several
            - link "gaming publications" [ref=e259] [cursor=pointer]:
              - /url: /wiki/Gaming_publications
            - text: awarded the game year-end accolades including
            - link "Game of the Year" [ref=e260] [cursor=pointer]:
              - /url: /wiki/List_of_Game_of_the_Year_awards
            - text: awards. In retrospect, it is considered one of
            - link "seventh" [ref=e261] [cursor=pointer]:
              - /url: /wiki/History_of_video_game_consoles_(seventh_generation)
            - text: and
            - link "eighth generation console gaming" [ref=e262] [cursor=pointer]:
              - /url: /wiki/History_of_video_game_consoles_(eighth_generation)
            - text: "'s most significant titles and among the"
            - link "best video games ever made" [ref=e263] [cursor=pointer]:
              - /url: /wiki/Best_video_games_ever_made
            - text: . It is the
            - link "second-best-selling video game of all time" [ref=e264] [cursor=pointer]:
              - /url: /wiki/List_of_best-selling_video_games
            - text: with 225 million copies shipped, and one of the most financially successful entertainment products of all time, with nearly $10 billion in worldwide revenue. Its successor,
            - link "Grand Theft Auto VI" [ref=e266] [cursor=pointer]:
              - /url: /wiki/Grand_Theft_Auto_VI
            - text: ", is scheduled to be released in November 2026."
          - heading "Gameplay" [level=2] [ref=e268]
          - paragraph [ref=e269]:
            - text: Grand Theft Auto V is an
            - link "action-adventure game" [ref=e270] [cursor=pointer]:
              - /url: /wiki/Action-adventure_game
            - superscript [ref=e271]:
              - link "[2]" [ref=e272] [cursor=pointer]:
                - /url: "#cite_note-Guinness_World_Record-3"
            - text: played from either a
            - link "third-person" [ref=e273] [cursor=pointer]:
              - /url: /wiki/Third-person_(video_games)
            - superscript [ref=e274]:
              - link "[3]" [ref=e275] [cursor=pointer]:
                - /url: "#cite_note-Kotaku_Immersive-4"
            - text: or
            - link "first-person perspective" [ref=e276] [cursor=pointer]:
              - /url: /wiki/First-person_(video_games)
            - text: .
            - superscript [ref=e277]:
              - link "[b]" [ref=e278] [cursor=pointer]:
                - /url: "#cite_note-first-person-6"
            - text: Players complete missions—linear scenarios with set objectives—to progress through the story.
            - superscript [ref=e279]:
              - link "[5]" [ref=e280] [cursor=pointer]:
                - /url: "#cite_note-IGN_Reinventing-7"
            - text: Outside of the missions, players may
            - link "freely roam" [ref=e281] [cursor=pointer]:
              - /url: /wiki/Nonlinear_gameplay
            - text: the
            - link "open world" [ref=e282] [cursor=pointer]:
              - /url: /wiki/Open_world
            - text: . Composed of the
            - link "San Andreas" [ref=e283] [cursor=pointer]:
              - /url: /wiki/San_Andreas_(Grand_Theft_Auto)
            - text: open countryside area, and its fictional Blaine County and city of Los Santos, the world is much larger in area than earlier entries in the series.
            - superscript [ref=e284]:
              - link "[6]" [ref=e285] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Biggest_World-8"
            - superscript [ref=e286]:
              - link "[c]" [ref=e287] [cursor=pointer]:
                - /url: "#cite_note-10"
            - text: It may be fully explored after the game's beginning without restriction, although story progress unlocks more gameplay content.
            - superscript [ref=e288]:
              - link "[8]" [ref=e289] [cursor=pointer]:
                - /url: "#cite_note-Unseen_Mastermind-11"
          - figure "Players can take cover behind objects during firefights to avoid taking damage from enemies.[9]" [ref=e290]:
            - link "The player character crouched behind a vehicle while in combat. The head-up display elements are visible on-screen." [ref=e291] [cursor=pointer]:
              - /url: /wiki/File:Grand_Theft_Auto_V_combat.jpg
              - img "The player character crouched behind a vehicle while in combat. The head-up display elements are visible on-screen." [ref=e292]
            - generic [ref=e293]:
              - text: Players can take cover behind objects during firefights to avoid taking damage from enemies.
              - superscript [ref=e294]:
                - link "[9]" [ref=e295] [cursor=pointer]:
                  - /url: "#cite_note-Telegraph_Preview-12"
          - paragraph [ref=e296]:
            - text: Players use
            - link "melee" [ref=e297] [cursor=pointer]:
              - /url: /wiki/Melee_(gaming)
            - text: attacks, firearms and explosives to fight enemies,
            - superscript [ref=e298]:
              - link "[d]" [ref=e299] [cursor=pointer]:
                - /url: "#cite_note-14"
            - text: and may run, jump, swim or use vehicles to navigate the world.
            - superscript [ref=e300]:
              - link "[e]" [ref=e301] [cursor=pointer]:
                - /url: "#cite_note-16"
            - text: To accommodate the map's size, the game introduces vehicle types absent in its predecessor
            - link "Grand Theft Auto IV" [ref=e303] [cursor=pointer]:
              - /url: /wiki/Grand_Theft_Auto_IV
            - text: ", such as"
            - link "fixed-wing aircraft" [ref=e304] [cursor=pointer]:
              - /url: /wiki/Fixed-wing_aircraft
            - text: .
            - superscript [ref=e305]:
              - link "[12]" [ref=e306] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Inside_Story-17"
            - text: In combat,
            - link "auto-aim" [ref=e307] [cursor=pointer]:
              - /url: /wiki/Auto-aim
            - text: and a
            - link "cover system" [ref=e308] [cursor=pointer]:
              - /url: /wiki/Cover_system
            - text: may be used to assist against enemies.
            - superscript [ref=e309]:
              - link "[9]" [ref=e310] [cursor=pointer]:
                - /url: "#cite_note-Telegraph_Preview-12"
            - text: Should players take damage, their
            - link "health meter" [ref=e311] [cursor=pointer]:
              - /url: /wiki/Health_meter
            - text: will gradually regenerate to its halfway point.
            - superscript [ref=e312]:
              - link "[f]" [ref=e313] [cursor=pointer]:
                - /url: "#cite_note-18"
            - text: Players
            - link "respawn" [ref=e314] [cursor=pointer]:
              - /url: /wiki/Respawn
            - text: at hospitals when their health depletes.
            - superscript [ref=e315]:
              - link "[11]" [ref=e316] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBogennBarba201313-15"
            - text: If players commit crimes, law enforcement may respond as indicated by a "
            - link "wanted" [ref=e317] [cursor=pointer]:
              - /url: /wiki/Fugitive
            - text: "\" meter in the"
            - link "heads-up display" [ref=e318] [cursor=pointer]:
              - /url: /wiki/HUD_(video_gaming)
            - text: (HUD).
            - superscript [ref=e319]:
              - link "[13]" [ref=e320] [cursor=pointer]:
                - /url: "#cite_note-Guardian_Preview-19"
            - text: Stars displayed on the meter indicate the current wanted level (for example, at the maximum five-star level, police helicopters and
            - link "SWAT" [ref=e321] [cursor=pointer]:
              - /url: /wiki/SWAT
            - text: teams swarm to lethally dispatch players).
            - superscript [ref=e322]:
              - link "[14]" [ref=e323] [cursor=pointer]:
                - /url: "#cite_note-Kotaku_Six-Star-20"
            - superscript [ref=e324]:
              - link "[g]" [ref=e325] [cursor=pointer]:
                - /url: "#cite_note-22"
            - text: Officers will search for players who leave the wanted vicinity. The meter enters a cool-down mode and eventually recedes when players are hidden from the officers' line of sight that displays on the
            - link "mini-map" [ref=e326] [cursor=pointer]:
              - /url: /wiki/Mini-map
            - text: for a period of time.
            - superscript [ref=e327]:
              - link "[16]" [ref=e328] [cursor=pointer]:
                - /url: "#cite_note-Destructoid_Review-23"
            - superscript [ref=e329]:
              - link "[h]" [ref=e330] [cursor=pointer]:
                - /url: "#cite_note-25"
          - paragraph [ref=e331]:
            - text: "In the single-player mode, players control three characters: Michael De Santa,"
            - link "Trevor Philips" [ref=e332] [cursor=pointer]:
              - /url: /wiki/Trevor_Philips
            - text: and Franklin Clinton—criminals whose stories interconnect as they complete missions. Some missions are completed with only one character while others feature two or all three.
            - superscript [ref=e333]:
              - link "[18]" [ref=e334] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBogennBarba201357-26"
            - text: Outside the missions, players may switch between characters at will by a directional compass on the HUD, although this feature is restricted at certain points during the story. During missions, characters may automatically switch to complete specific objectives. A character's compass
            - link "avatar" [ref=e335] [cursor=pointer]:
              - /url: /wiki/Avatar_(computing)
            - text: will flash red if he is in danger and needs help, and flash white if he has a strategic advantage.
            - superscript [ref=e336]:
              - link "[19]" [ref=e337] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Hands-On-27"
            - text: Though players complete missions with the protagonists, the more difficult heist missions require aid from
            - link "AI" [ref=e338] [cursor=pointer]:
              - /url: /wiki/Artificial_intelligence_(video_games)
            - text: "-controlled accomplices with unique skill sets like computer hacking and driving. If an accomplice survives a successful heist, they take a cut from the cash reward"
            - superscript [ref=e339]:
              - link "[20]" [ref=e340] [cursor=pointer]:
                - /url: "#cite_note-Gamespot_Heist-28"
            - text: and may be available for later missions with improvements to their unique skills.
            - superscript [ref=e341]:
              - link "[21]" [ref=e342] [cursor=pointer]:
                - /url: "#cite_note-GI_Art-29"
            - text: Some heists afford multiple strategies; in a
            - link "holdup" [ref=e343] [cursor=pointer]:
              - /url: /wiki/Holdup
            - text: mission, players may either stealthily subdue civilians with an
            - link "incapacitating agent" [ref=e344] [cursor=pointer]:
              - /url: /wiki/Incapacitating_agent
            - text: or conspicuously storm the venue with guns drawn.
            - superscript [ref=e345]:
              - link "[22]" [ref=e346] [cursor=pointer]:
                - /url: "#cite_note-IGN_New-30"
          - paragraph [ref=e347]:
            - text: Each character has a set of eight skills that represent their ability in specific areas such as shooting and driving. Though skills improve through play, each character has a skill with expertise by default (e.g. Trevor's flying skill).
            - superscript [ref=e348]:
              - link "[23]" [ref=e349] [cursor=pointer]:
                - /url: "#cite_note-Open_World_Rulebook-31"
            - text: The eighth "special" skill determines proficiency in an ability that is unique to each respective character. Michael enters
            - link "bullet time" [ref=e350] [cursor=pointer]:
              - /url: /wiki/Bullet_time
            - text: in combat, Franklin slows down time while driving, and Trevor deals twice as much damage to enemies while taking half as much in combat.
            - superscript [ref=e351]:
              - link "[24]" [ref=e352] [cursor=pointer]:
                - /url: "#cite_note-Running_And_Gunning-32"
            - text: A meter on each character's HUD depletes when an ability is being used and regenerates when players perform skilful actions (for example,
            - link "drifting" [ref=e353] [cursor=pointer]:
              - /url: /wiki/Drifting_(motorsport)
            - text: in vehicles as Franklin or performing
            - link "headshots" [ref=e354] [cursor=pointer]:
              - /url: /wiki/Glossary_of_video_game_terms#H
            - text: as Michael).
            - superscript [ref=e355]:
              - link "[25]" [ref=e356] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBogennBarba20136-33"
          - paragraph [ref=e357]:
            - text: While free-roaming the game world, players may engage in context-specific activities such as
            - link "scuba diving" [ref=e358] [cursor=pointer]:
              - /url: /wiki/Scuba_diving
            - text: and
            - link "BASE jumping" [ref=e359] [cursor=pointer]:
              - /url: /wiki/BASE_jumping
            - text: ", and visit businesses such as"
            - link "cinemas" [ref=e360] [cursor=pointer]:
              - /url: /wiki/Cinemas
            - text: and
            - link "strip clubs" [ref=e361] [cursor=pointer]:
              - /url: /wiki/Strip_clubs
            - text: . Each character has a
            - link "smartphone" [ref=e362] [cursor=pointer]:
              - /url: /wiki/Smartphone
            - text: for contacting friends, starting activities, and accessing an in-game Internet.
            - superscript [ref=e363]:
              - link "[26]" [ref=e364] [cursor=pointer]:
                - /url: "#cite_note-detailsDestructoid-34"
            - text: The Internet lets players trade in stocks via a
            - link "stock market" [ref=e365] [cursor=pointer]:
              - /url: /wiki/Stock_market
            - text: .
            - superscript [ref=e366]:
              - link "[27]" [ref=e367] [cursor=pointer]:
                - /url: "#cite_note-GamesRadar_Review-35"
            - text: Players may purchase properties such as garages and businesses, upgrade the weapons and vehicles in each character's arsenal, and customise their appearance by purchasing outfits, haircuts and tattoos.
            - superscript [ref=e368]:
              - link "[28]" [ref=e369] [cursor=pointer]:
                - /url: "#cite_note-GI_Stamp-36"
          - heading "Plot" [level=2] [ref=e371]
          - paragraph [ref=e372]:
            - text: In 2004,
            - superscript [ref=e373]:
              - link "[i]" [ref=e374] [cursor=pointer]:
                - /url: "#cite_note-38"
            - text: criminals Michael Townley (
            - link "Ned Luke" [ref=e375] [cursor=pointer]:
              - /url: /wiki/Ned_Luke
            - text: ), Trevor Philips (
            - link "Steven Ogg" [ref=e376] [cursor=pointer]:
              - /url: /wiki/Steven_Ogg
            - text: ), and Brad Snider (Ryan Woodle) partake in a failed robbery in Ludendorff, North Yankton,
            - superscript [ref=e377]:
              - link "[j]" [ref=e378] [cursor=pointer]:
                - /url: "#cite_note-40"
            - text: resulting in Michael being presumed dead. Nine years later, Michael lives with his family in the city of Los Santos under the alias Michael De Santa, having made a secret agreement with Federal Investigation Bureau (FIB)
            - superscript [ref=e379]:
              - link "[k]" [ref=e380] [cursor=pointer]:
                - /url: "#cite_note-42"
            - text: agent Dave Norton (Julian Gamble) to stay hidden. Across town, gangbanger Franklin Clinton (
            - link "Shawn Fonteno" [ref=e381] [cursor=pointer]:
              - /url: /wiki/Shawn_Fonteno
            - text: ) works for a corrupt car salesman and meets Michael while attempting to fraudulently
            - link "repossess" [ref=e382] [cursor=pointer]:
              - /url: /wiki/Repossess
            - text: his son's car. The two later become friends. When Michael finds his wife sleeping with her tennis coach, he and Franklin chase the coach to a mansion, which Michael damages in anger. The owner,
            - link "drug lord" [ref=e383] [cursor=pointer]:
              - /url: /wiki/Drug_lord
            - text: Martin Madrazo (Alfredo Huereca), demands monetary compensation, so Michael returns to a life of crime to obtain the funds, enlisting Franklin as an accomplice. With the help of Michael's old friend Lester Crest (
            - link "Jay Klaitz" [ref=e384] [cursor=pointer]:
              - /url: /wiki/Jay_Klaitz
            - text: ), a disabled hacker, they rob a jewellery store to pay off the debt.
          - paragraph [ref=e385]:
            - text: Meanwhile, Trevor, who lives in squalor in rural Blaine County, hears of the heist and recognises Michael's work; Trevor had believed the FIB killed him in the Ludendorff heist. Trevor finds Michael and reunites with him, forcing the latter to reluctantly accept the former back into his life. As time goes on, the protagonists' lives spiral out of control. Michael's criminal behaviour prompts his family to leave him. When he later becomes a
            - link "movie producer" [ref=e386] [cursor=pointer]:
              - /url: /wiki/Movie_producer
            - text: ", he comes into conflict with Devin Weston (Jonathan Walker), a billionaire"
            - link "venture capitalist" [ref=e387] [cursor=pointer]:
              - /url: /wiki/Venture_capital
            - text: and
            - link "corporate raider" [ref=e388] [cursor=pointer]:
              - /url: /wiki/Corporate_raid
            - text: ", who attempts to shut down the studio. Michael thwarts his efforts and inadvertently kills his lawyer, to which Devin vows revenge. Meanwhile, Franklin has to rescue his friend Lamar Davis ("
            - link "Slink Johnson" [ref=e389] [cursor=pointer]:
              - /url: /wiki/Slink_Johnson
            - text: ) from rival gangbanger Harold "Stretch" Joseph (
            - link "Hassan Johnson" [ref=e390] [cursor=pointer]:
              - /url: /wiki/Hassan_Johnson
            - text: ), who sets up and attempts to kill him multiple times.
          - paragraph [ref=e391]:
            - text: Concurrently, Trevor tries to consolidate his control over various
            - link "black markets" [ref=e392] [cursor=pointer]:
              - /url: /wiki/Black_market
            - text: in Blaine County, waging war against the Lost
            - link "outlaw motorcycle club" [ref=e393] [cursor=pointer]:
              - /url: /wiki/Outlaw_motorcycle_club
            - text: ","
            - link "Latino" [ref=e394] [cursor=pointer]:
              - /url: /wiki/Latino_(demonym)
            - text: street gangs, rival
            - link "meth" [ref=e395] [cursor=pointer]:
              - /url: /wiki/Meth
            - text: dealers, the
            - link "private military company" [ref=e396] [cursor=pointer]:
              - /url: /wiki/Private_military_company
            - text: Merryweather, and
            - link "triad" [ref=e397] [cursor=pointer]:
              - /url: /wiki/Triad_(organized_crime)
            - text: kingpin Wei Cheng (
            - link "George Cheung" [ref=e398] [cursor=pointer]:
              - /url: /wiki/George_Cheung
            - text: ). Having broken his agreement with Dave by committing robberies again, Michael is coerced by him and his superior, Steve Haines (
            - link "Robert Bogue" [ref=e399] [cursor=pointer]:
              - /url: /wiki/Robert_Bogue
            - text: ), to perform a series of operations alongside Franklin and Trevor to undermine the International Affairs Agency (IAA).
            - superscript [ref=e400]:
              - link "[l]" [ref=e401] [cursor=pointer]:
                - /url: "#cite_note-43"
            - text: Under Steve's direction and with Lester's help, they attack an
            - link "armored car" [ref=e402] [cursor=pointer]:
              - /url: /wiki/Armored_car_(valuables)
            - text: carrying funds for the IAA and steal an experimental
            - link "nerve agent" [ref=e403] [cursor=pointer]:
              - /url: /wiki/Nerve_agent
            - text: from an IAA lab. As Steve comes under increasing scrutiny, he forces Michael and Franklin to break into the FIB building and erase evidence against him from the servers. Michael takes the opportunity to wipe the data on his own activities, destroying Steve's leverage over him.
          - paragraph [ref=e404]:
            - text: "After reconciling with his family, Michael starts planning his final heist with Trevor, Franklin, and Lester: raiding the Union Depository's gold bullion reserve. However, Trevor discovers that Brad was not imprisoned as he was led to believe, but killed during the Ludendorff heist and buried in the grave marked for Michael. Deducing the heist was a setup and that he was supposed to be killed in Brad's place, Trevor feels betrayed and leaves Michael for dead during a shootout with Cheng's henchmen. Although Franklin rescues Michael, Trevor's anger towards the latter causes friction within the group and threatens to undermine their plans. Meanwhile, Steve attempts to arrest Michael, but they both, alongside Dave, become caught in a"
            - link "Mexican standoff" [ref=e405] [cursor=pointer]:
              - /url: /wiki/Mexican_standoff
            - text: between the FIB, the IAA, and Merryweather. Steve escapes while Michael and Dave are saved by Trevor, who believes only he has the right to kill Michael.
          - paragraph [ref=e406]:
            - text: "The Union Depository heist is successful, but Franklin is afterwards approached by Steve and Dave, who contend that Trevor is a liability, and Devin, still seeking vengeance on Michael. Franklin has three options: kill Trevor, kill Michael, or attempt to save both in a"
            - link "suicide mission" [ref=e407] [cursor=pointer]:
              - /url: /wiki/Suicide_mission
            - text: . Should Franklin choose to kill either Michael or Trevor, his relationship with the man he spares ceases, and he returns to his old life.
            - superscript [ref=e408]:
              - link "[32]" [ref=e409] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_2-44"
            - superscript [ref=e410]:
              - link "[33]" [ref=e411] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_3-45"
            - text: Otherwise, the trio, aided by Lamar and Lester, withstand an onslaught from the FIB and Merryweather before going on to kill Cheng, Stretch, Steve, and Devin. Michael and Trevor reconcile, and the three protagonists cease working together but remain friends.
            - superscript [ref=e412]:
              - link "[34]" [ref=e413] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_4-46"
          - heading "Development" [level=2] [ref=e415]
          - note [ref=e416]:
            - text: "Main article:"
            - link "Development of Grand Theft Auto V" [ref=e417] [cursor=pointer]:
              - /url: /wiki/Development_of_Grand_Theft_Auto_V
          - paragraph [ref=e418]:
            - link "Rockstar North" [ref=e419] [cursor=pointer]:
              - /url: /wiki/Rockstar_North
            - text: began to develop Grand Theft Auto V in 2008, around Grand Theft Auto IV's release.
            - superscript [ref=e420]:
              - link "[35]" [ref=e421] [cursor=pointer]:
                - /url: "#cite_note-Inside_Rockstar_North_1-47"
            - text: The development team totalled more than 1,000 people, including Rockstar North's core team and staff from parent company
            - link "Rockstar Games" [ref=e422] [cursor=pointer]:
              - /url: /wiki/Rockstar_Games
            - text: "' studios around the world."
            - superscript [ref=e423]:
              - link "[36]" [ref=e424] [cursor=pointer]:
                - /url: "#cite_note-Inside_Rockstar_North_2-48"
            - text: The proprietary
            - link "Rockstar Advanced Game Engine" [ref=e425] [cursor=pointer]:
              - /url: /wiki/Rockstar_Advanced_Game_Engine
            - text: (RAGE) was overhauled for the game to improve its
            - link "draw distance" [ref=e426] [cursor=pointer]:
              - /url: /wiki/Draw_distance
            - text: rendering capabilities.
            - superscript [ref=e427]:
              - link "[37]" [ref=e428] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertz201293-49"
            - text: The
            - link "Euphoria" [ref=e429] [cursor=pointer]:
              - /url: /wiki/Euphoria_(software)
            - text: and
            - link "Bullet" [ref=e430] [cursor=pointer]:
              - /url: /wiki/Bullet_(software)
            - text: software handle additional animation and rendering tasks.
            - superscript [ref=e431]:
              - link "[38]" [ref=e432] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Face-Off-50"
            - text: Having become familiar with the
            - link "PlayStation 3" [ref=e433] [cursor=pointer]:
              - /url: /wiki/PlayStation_3
            - text: and
            - link "Xbox 360" [ref=e434] [cursor=pointer]:
              - /url: /wiki/Xbox_360
            - text: hardware over time, Rockstar found they were able to push the consoles' graphical capabilities further than in previous games.
            - superscript [ref=e435]:
              - link "[39]" [ref=e436] [cursor=pointer]:
                - /url: "#cite_note-Building_the_World_Of_GTA_V-51"
            - text: Analyst estimations place the game's combined development and marketing budget at more than
            - generic [ref=e437]:
              - link "£" [ref=e438] [cursor=pointer]:
                - /url: /wiki/Pound_sterling
              - text: 170 million
            - text: (US$265 million), which would make it the
            - link "most expensive game ever made" [ref=e439] [cursor=pointer]:
              - /url: /wiki/List_of_most_expensive_video_games_to_develop
            - text: at that time.
            - superscript [ref=e440]:
              - link "[40]" [ref=e441] [cursor=pointer]:
                - /url: "#cite_note-Most_Expensive-52"
            - superscript [ref=e442]:
              - link "[m]" [ref=e443] [cursor=pointer]:
                - /url: "#cite_note-54"
          - paragraph [ref=e444]:
            - text: The open world was modelled on
            - link "Southern California" [ref=e445] [cursor=pointer]:
              - /url: /wiki/Southern_California
            - text: and
            - link "Los Angeles" [ref=e446] [cursor=pointer]:
              - /url: /wiki/Los_Angeles
            - text: ","
            - superscript [ref=e447]:
              - link "[42]" [ref=e448] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Back_To_San_Andreas-55"
            - text: and its design and in-game render constituted much of the game's early work.
            - superscript [ref=e449]:
              - link "[43]" [ref=e450] [cursor=pointer]:
                - /url: "#cite_note-Garbut_on_GTA_V-56"
            - text: Key members of the game world production team took field research trips throughout the region and documented their research with photo and video footage.
            - superscript [ref=e451]:
              - link "[39]" [ref=e452] [cursor=pointer]:
                - /url: "#cite_note-Building_the_World_Of_GTA_V-51"
            - link "Google Maps" [ref=e453] [cursor=pointer]:
              - /url: /wiki/Google_Maps
            - text: projections of Los Angeles were used by the team to help design Los Santos's road networks.
            - superscript [ref=e454]:
              - link "[44]" [ref=e455] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertz201291-57"
            - superscript [ref=e456]:
              - link "[45]" [ref=e457] [cursor=pointer]:
                - /url: "#cite_note-Inside_Rockstar_North_4-58"
            - text: To reflect and reproduce Los Angeles's demographic spread, the developers studied census data and watched documentaries about the city.
            - superscript [ref=e458]:
              - link "[37]" [ref=e459] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertz201293-49"
            - text: The team considered creating the open world the most technically demanding aspect of the game's production.
            - superscript [ref=e460]:
              - link "[46]" [ref=e461] [cursor=pointer]:
                - /url: "#cite_note-Meet_Dan_Houser-59"
          - paragraph [ref=e462]:
            - text: A fundamental design goal from the outset was to innovate on
            - link "the series" [ref=e463] [cursor=pointer]:
              - /url: /wiki/Grand_Theft_Auto
            - text: "' core structure by giving players control of three lead protagonists instead of one."
            - superscript [ref=e464]:
              - link "[43]" [ref=e465] [cursor=pointer]:
                - /url: "#cite_note-Garbut_on_GTA_V-56"
            - text: The idea was first raised during
            - 'link "Grand Theft Auto: San Andreas" [ref=e467] [cursor=pointer]':
              - /url: /wiki/Grand_Theft_Auto:_San_Andreas
            - text: "' development, but contemporaneous hardware restrictions made it infeasible."
            - superscript [ref=e468]:
              - link "[35]" [ref=e469] [cursor=pointer]:
                - /url: "#cite_note-Inside_Rockstar_North_1-47"
            - text: Having developed two Grand Theft Auto IV episodic expansion packs featuring new protagonists in 2009, the team wanted to base Grand Theft Auto V around three simultaneously controlled protagonists.
            - superscript [ref=e470]:
              - link "[12]" [ref=e471] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Inside_Story-17"
            - text: The team viewed it as a spiritual successor to many of their previous games (such as Grand Theft Auto IV,
            - link "Red Dead Redemption" [ref=e473] [cursor=pointer]:
              - /url: /wiki/Red_Dead_Redemption
            - text: and
            - link "Max Payne 3" [ref=e475] [cursor=pointer]:
              - /url: /wiki/Max_Payne_3
            - text: ), and designed it to improve upon their gameplay mechanics.
            - superscript [ref=e476]:
              - link "[19]" [ref=e477] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Hands-On-27"
            - superscript [ref=e478]:
              - link "[47]" [ref=e479] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Sum_Of_All_Peers-60"
            - text: They sought to improve the action gameplay by refining the shooting mechanics and cover system
            - superscript [ref=e480]:
              - link "[48]" [ref=e481] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Gun_Combat-61"
            - text: and reworked the driving mechanics to correct Grand Theft Auto IV's awkward vehicle controls.
            - superscript [ref=e482]:
              - link "[49]" [ref=e483] [cursor=pointer]:
                - /url: "#cite_note-FOOTNOTEBertz201276-62"
          - generic [ref=e485]:
            - generic [ref=e486]:
              - generic [ref=e487]:
                - link [ref=e490] [cursor=pointer]:
                  - /url: /wiki/File:Shawn_Fonteno_by_Gage_Skidmore.jpg
                  - img [ref=e491]
                - link "Shawn Fonteno" [ref=e493] [cursor=pointer]:
                  - /url: /wiki/Shawn_Fonteno
              - generic [ref=e494]:
                - link [ref=e497] [cursor=pointer]:
                  - /url: /wiki/File:Ned_Luke_by_Gage_Skidmore.jpg
                  - img [ref=e498]
                - link "Ned Luke" [ref=e500] [cursor=pointer]:
                  - /url: /wiki/Ned_Luke
              - generic [ref=e501]:
                - link [ref=e504] [cursor=pointer]:
                  - /url: /wiki/File:Steven_Ogg_by_Gage_Skidmore.jpg
                  - img [ref=e505]
                - link "Steven Ogg" [ref=e507] [cursor=pointer]:
                  - /url: /wiki/Steven_Ogg
            - generic [ref=e509]:
              - text: Fonteno, Luke, and Ogg (pictured in 2024) portray the game's protagonists, Franklin, Michael, and
              - link "Trevor" [ref=e510] [cursor=pointer]:
                - /url: /wiki/Trevor_Philips
              - text: ", respectively."
              - superscript [ref=e511]:
                - link "[50]" [ref=e512] [cursor=pointer]:
                  - /url: "#cite_note-USAT_Interview-63"
          - paragraph [ref=e513]:
            - text: After an audition process, Ned Luke, Shawn Fonteno, and Steven Ogg were selected to portray Michael, Franklin and Trevor, respectively.
            - superscript [ref=e514]:
              - link "[50]" [ref=e515] [cursor=pointer]:
                - /url: "#cite_note-USAT_Interview-63"
            - text: Their performances were mostly recorded using
            - link "motion capture" [ref=e516] [cursor=pointer]:
              - /url: /wiki/Motion_capture
            - text: technology,
            - superscript [ref=e517]:
              - link "[51]" [ref=e518] [cursor=pointer]:
                - /url: "#cite_note-Inside_GTA_V_Creative-64"
            - text: but dialogue for scenes with characters seated in vehicles was recorded in studios instead.
            - superscript [ref=e519]:
              - link "[52]" [ref=e520] [cursor=pointer]:
                - /url: "#cite_note-TSA_Ogg-65"
            - text: The game's
            - link "original score" [ref=e521] [cursor=pointer]:
              - /url: /wiki/Music_of_Grand_Theft_Auto_V
            - text: was composed by a team of producers who collaborated over several years.
            - superscript [ref=e522]:
              - link "[53]" [ref=e523] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Soundscape-66"
            - text: Licensed music provided by an in-game radio is also used.
            - superscript [ref=e524]:
              - link "[54]" [ref=e525] [cursor=pointer]:
                - /url: "#cite_note-Pav_THR_Interview-67"
            - text: The team licensed more than 241 tracks shared between fifteen radio stations, with an additional two stations providing
            - link "talk radio" [ref=e526] [cursor=pointer]:
              - /url: /wiki/Talk_radio
            - text: .
            - superscript [ref=e527]:
              - link "[n]" [ref=e528] [cursor=pointer]:
                - /url: "#cite_note-69"
            - text: Some of the tracks were written specifically for the game, such as rapper and producer
            - link "Flying Lotus" [ref=e529] [cursor=pointer]:
              - /url: /wiki/Flying_Lotus
            - text: "' original work composed for the FlyLo FM radio station he hosts."
            - superscript [ref=e530]:
              - link "[56]" [ref=e531] [cursor=pointer]:
                - /url: "#cite_note-GTA_V_Soundtrack-70"
          - heading "Release" [level=3] [ref=e533]
          - paragraph [ref=e534]:
            - text: Rockstar Games announced the game on 25 October 2011.
            - superscript [ref=e535]:
              - link "[57]" [ref=e536] [cursor=pointer]:
                - /url: "#cite_note-GS_Announce-71"
            - text: They released its debut trailer one week later,
            - superscript [ref=e537]:
              - link "[58]" [ref=e538] [cursor=pointer]:
                - /url: "#cite_note-Guardian_Hollywood-72"
            - text: with an official press release acknowledging its setting.
            - superscript [ref=e539]:
              - link "[59]" [ref=e540] [cursor=pointer]:
                - /url: "#cite_note-CVG_Los_Santos-73"
            - text: Journalists noted the widespread industry anticipation ignited by the announcement, which they owed to the series' cultural significance.
            - superscript [ref=e541]:
              - link "[60]" [ref=e542] [cursor=pointer]:
                - /url: "#cite_note-spike2012-74"
            - superscript [ref=e543]:
