          - paragraph [ref=e601]:
            - text: A new version, commonly referred to as "Expanded & Enhanced", was announced in June 2020.
            - superscript [ref=e602]:
              - link "[74]" [ref=e603] [cursor=pointer]:
                - /url: "#cite_note-GameSpot_PS5-88"
            - text: Released on 15 March 2022 for
            - link "PlayStation 5" [ref=e604] [cursor=pointer]:
