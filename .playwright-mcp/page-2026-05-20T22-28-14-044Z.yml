            - link "Black Ops" [ref=e1160] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Black_Ops
            - text: . Developed by
            - link "n-Space" [ref=e1161] [cursor=pointer]:
              - /url: /wiki/N-Space
            - text: ", the game takes place in the same setting as the main console game, but follows a different storyline and cast of characters."
            - superscript [ref=e1162]:
              - link "[63]" [ref=e1163] [cursor=pointer]:
                - /url: "#cite_note-DSpreviewKotaku-67"
            - superscript [ref=e1164]:
