              - /url: /wiki/Call_of_Duty:_Modern_Warfare_3_%E2%80%93_Defiance
          - paragraph [ref=e1170]:
            - text: "Call of Duty: Modern Warfare 3 – Defiance is the Nintendo DS companion game for"
            - link "Modern Warfare 3" [ref=e1172] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_3
            - text: .
          - 'heading "Call of Duty: Black Ops: Declassified" [level=4] [ref=e1174]'
          - note [ref=e1175]:
            - text: "Main article:"
            - 'link "Call of Duty: Black Ops: Declassified" [ref=e1176] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops:_Declassified
          - paragraph [ref=e1177]:
            - text: "Call of Duty: Black Ops: Declassified is a"
            - link "PlayStation Vita" [ref=e1178] [cursor=pointer]:
              - /url: /wiki/PlayStation_Vita
            - text: Call of Duty game.
            - superscript [ref=e1179]:
              - link "[65]" [ref=e1180] [cursor=pointer]:
                - /url: "#cite_note-69"
          - heading "Mobile titles" [level=3] [ref=e1182]
          - heading "Call of Duty (for Mobile)" [level=4] [ref=e1184]: Call of Duty (for Mobile)
          - paragraph [ref=e1185]:
            - text: Call of Duty is the J2ME mobile spin-off of 2003's Call of Duty.
            - superscript [ref=e1186]:
              - link "[66]" [ref=e1187] [cursor=pointer]:
                - /url: "#cite_note-COD_Mobile_1&2-70"
          - heading "Call of Duty 2 (for Mobile)" [level=4] [ref=e1189]: Call of Duty 2 (for Mobile)
          - paragraph [ref=e1190]:
            - text: Call of Duty 2 is the J2ME mobile spin-off of Call of Duty 2.
            - superscript [ref=e1191]:
              - link "[66]" [ref=e1192] [cursor=pointer]:
                - /url: "#cite_note-COD_Mobile_1&2-70"
          - heading "Call of Duty 3 (for Mobile)" [level=4] [ref=e1194]: Call of Duty 3 (for Mobile)
          - paragraph [ref=e1195]: Call of Duty 3 is the J2ME mobile spin-off of Call of Duty 3.
          - heading "Call of Duty 2 Pocket PC Edition" [level=4] [ref=e1197]
          - paragraph [ref=e1198]: Call of Duty 2 Pocket PC Edition is the Windows Mobile spin-off of Call of Duty 2.
          - 'heading "Call of Duty 4: Modern Warfare (for Mobile)" [level=4] [ref=e1200]': "Call of Duty 4: Modern Warfare (for Mobile)"
          - paragraph [ref=e1201]: "Call of Duty 4: Modern Warfare is the J2ME mobile spin-off of 2007's Modern Warfare."
          - 'heading "Call of Duty: World at War (for Mobile)" [level=4] [ref=e1203]': "Call of Duty: World at War (for Mobile)"
          - paragraph [ref=e1204]: "Call of Duty: World at War is the J2ME mobile spin-off of World at War."
          - 'heading "Call of Duty: Modern Warfare 2: Force Recon" [level=4] [ref=e1206]'
          - paragraph [ref=e1207]:
            - text: "Call of Duty: Modern Warfare 2: Force Recon is the J2ME mobile spin-off of Modern Warfare 2. Developed by"
            - link "Glu Mobile" [ref=e1208] [cursor=pointer]:
              - /url: /wiki/Glu_Mobile
            - text: ", the game takes place in Mexico five years after Modern Warfare."
          - 'heading "Call of Duty: World at War – Zombies" [level=4] [ref=e1210]': "Call of Duty: World at War – Zombies"
          - note [ref=e1211]:
            - text: "Main article:"
            - 'link "Call of Duty: World at War – Zombies" [ref=e1212] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_World_at_War_%E2%80%93_Zombies
          - paragraph [ref=e1213]:
            - text: "Call of Duty: World at War – Zombies is a first-person shooter video game developed by Ideaworks Game Studio and published by Activision for"
            - link "iOS" [ref=e1214] [cursor=pointer]:
              - /url: /wiki/IOS
            - text: . It is a
            - link "spin-off" [ref=e1215] [cursor=pointer]:
              - /url: /wiki/Spin-off_(media)
            - text: of the Call of Duty series and based on the "Nazi Zombies" mode of
            - 'link "Call of Duty: World at War" [ref=e1217] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_World_at_War
            - text: .
          - 'heading "Call of Duty: Black Ops Mobile" [level=4] [ref=e1219]'
          - paragraph [ref=e1220]: "Call of Duty: Black Ops Mobile is the J2ME mobile spin-off of Black Ops."
          - 'heading "Call of Duty: Black Ops – Zombies" [level=4] [ref=e1222]': "Call of Duty: Black Ops – Zombies"
          - note [ref=e1223]:
            - text: "Main article:"
            - 'link "Call of Duty: Black Ops – Zombies" [ref=e1224] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops_%E2%80%93_Zombies
          - paragraph [ref=e1225]:
            - text: "Call of Duty: Black Ops – Zombies is a first-person shooter video game developed by Ideaworks Game Studio and published by Activision for"
            - link "Android" [ref=e1226] [cursor=pointer]:
              - /url: /wiki/Android_(operating_system)
            - text: "and iOS. It is a sequel to Call of Duty: World at War – Zombies."
          - 'heading "Call of Duty: Strike Team" [level=4] [ref=e1228]'
          - note [ref=e1229]:
            - text: "Main article:"
            - 'link "Call of Duty: Strike Team" [ref=e1230] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Strike_Team
          - paragraph [ref=e1231]:
            - text: "Call of Duty: Strike Team is a first and third-person shooter game developed by The Blast Furnace and published by Activision for iOS and Android. The game is set in 2020 with players tasked with leading a U.S."
            - link "Joint Special Operations" [ref=e1232] [cursor=pointer]:
              - /url: /wiki/Joint_Special_Operations_Command
            - text: Team after the country "finds themselves in a war with an unknown enemy".
          - heading "Compilations" [level=2] [ref=e1234]
          - 'heading "Call of Duty: The War Collection" [level=3] [ref=e1236]'
          - paragraph [ref=e1237]:
            - text: "Call of Duty: The War Collection is a boxed set compilation of Call of Duty 2, Call of Duty 3 and Call of Duty: World at War. It was released for the Xbox 360 on June 1, 2010."
            - superscript [ref=e1238]:
              - link "[67]" [ref=e1239] [cursor=pointer]:
                - /url: "#cite_note-71"
          - heading "Canceled titles" [level=2] [ref=e1241]
          - 'heading "Call of Duty: Combined Forces" [level=3] [ref=e1243]'
          - paragraph [ref=e1244]:
            - text: "Call of Duty: Combined Forces was a proposed concept draft originally intended to be a sequel to"
            - 'link "Call of Duty: Finest Hour" [ref=e1246] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Finest_Hour
            - text: . However, due to multiple legal issues that arose between
            - link "Spark Unlimited" [ref=e1247] [cursor=pointer]:
              - /url: /wiki/Spark_Unlimited
            - text: ","
            - link "Electronic Arts" [ref=e1248] [cursor=pointer]:
              - /url: /wiki/Electronic_Arts
            - text: ", and"
            - link "Activision" [ref=e1249] [cursor=pointer]:
              - /url: /wiki/Activision
            - text: as well as other production problems, the game's draft and scripts never came to be. The game was projected to cost $10.5 million to produce after Finest Hour was complete. Eventually, Activision deemed the pitch as more of an expansion than something entirely new, causing the company to reject the proposal and end their contract with Spark Unlimited shortly after.
            - superscript [ref=e1250]:
              - link "[68]" [ref=e1251] [cursor=pointer]:
                - /url: "#cite_note-72"
          - 'heading "Call of Duty: Devil''s Brigade" [level=3] [ref=e1253]': "Call of Duty: Devil's Brigade"
          - paragraph [ref=e1254]:
            - text: "Call of Duty: Devil's Brigade was a canceled first-person shooter for the"
            - link "Xbox 360" [ref=e1255] [cursor=pointer]:
              - /url: /wiki/Xbox_360
            - text: developed by Underground Entertainment. The game was set in World War II, mainly focusing on the Italian Campaign.
            - superscript [ref=e1256]:
              - link "[69]" [ref=e1257] [cursor=pointer]:
                - /url: "#cite_note-73"
          - 'heading "Call of Duty: Future Warfare / NX1" [level=3] [ref=e1259]': "Call of Duty: Future Warfare / NX1"
          - paragraph [ref=e1260]:
            - text: In 2010, after the fracturing of
            - link "Infinity Ward" [ref=e1261] [cursor=pointer]:
              - /url: /wiki/Infinity_Ward
            - text: and departure of Jason West and
            - link "Vince Zampella" [ref=e1262] [cursor=pointer]:
              - /url: /wiki/Vince_Zampella
            - text: ", studio"
            - link "Neversoft" [ref=e1263] [cursor=pointer]:
              - /url: /wiki/Neversoft
            - text: was tasked by Activision to develop a sci-fi spinoff in the Call of Duty franchise, experimenting with low-gravity gameplay and other aspects of the engine. At an unknown point in time, the project was scrapped, and assets were reused in Ghosts and Infinite Warfare. Footage of the project (known as Future Warfare) was leaked online in January 2024, revealing a complete opening mission, and an in-development multiplayer that was still reusing assets from 2009's Modern Warfare 2. After the leaks, former Neversoft developer Brian Bright came along and confirmed the leaks, stating that the game had two or three complete missions, and a large amount of multiplayer work done. He also referred to the project as "NX1", and that the game was meant to be released in 2013 in place of Ghosts.
            - superscript [ref=e1264]:
              - link "[70]" [ref=e1265] [cursor=pointer]:
                - /url: "#cite_note-74"
            - superscript [ref=e1266]:
              - link "[71]" [ref=e1267] [cursor=pointer]:
                - /url: "#cite_note-75"
          - 'heading "Call of Duty: Vietnam" [level=3] [ref=e1269]'
          - paragraph [ref=e1270]:
            - text: "Call of Duty: Vietnam was a"
            - link "third-person shooter" [ref=e1271] [cursor=pointer]:
              - /url: /wiki/Third-person_shooter
            - text: set during the
            - link "Vietnam War" [ref=e1272] [cursor=pointer]:
              - /url: /wiki/Vietnam_War
            - text: . It was in development for at least six to eight months at
            - link "Sledgehammer Games" [ref=e1273] [cursor=pointer]:
              - /url: /wiki/Sledgehammer_Games
            - text: . The development was stopped because Infinity Ward needed help finishing
            - 'link "Call of Duty: Modern Warfare 3" [ref=e1275] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_3
            - text: due to
            - link "the employee firings and departures in 2010" [ref=e1276] [cursor=pointer]:
              - /url: /wiki/Infinity_Ward#2010_employee_firings_and_departures
            - text: .
            - superscript [ref=e1277]:
              - link "[72]" [ref=e1278] [cursor=pointer]:
                - /url: "#cite_note-76"
            - superscript [ref=e1279]:
              - link "[73]" [ref=e1280] [cursor=pointer]:
                - /url: "#cite_note-77"
          - 'heading "Call of Duty: Roman Wars" [level=3] [ref=e1282]'
          - paragraph [ref=e1283]:
            - text: "Call of Duty: Roman Wars was a canceled third and first-person video game in the Call of Duty franchise developed by"
            - link "Vicarious Visions" [ref=e1284] [cursor=pointer]:
              - /url: /wiki/Vicarious_Visions
            - text: . The game was set in
            - link "ancient Rome" [ref=e1285] [cursor=pointer]:
              - /url: /wiki/Ancient_Rome
            - text: ", and allowed players to take control of famous historical figure"
            - link "Julius Caesar" [ref=e1286] [cursor=pointer]:
              - /url: /wiki/Julius_Caesar
            - text: ", along with \"low grunts\", and officers of the"
            - link "Tenth Legion" [ref=e1287] [cursor=pointer]:
              - /url: /wiki/Legio_X_Equestris
            - text: . It was eventually canceled, as
            - link "Activision" [ref=e1288] [cursor=pointer]:
              - /url: /wiki/Activision
            - text: had uncertainties about branding it as a Call of Duty title.
            - superscript [ref=e1289]:
              - link "[74]" [ref=e1290] [cursor=pointer]:
                - /url: "#cite_note-78"
          - heading "Untitled Call of Duty Zombies game" [level=3] [ref=e1292]
          - paragraph [ref=e1293]:
            - text: Between 2012 and 2013,
            - link "Raven Software" [ref=e1294] [cursor=pointer]:
              - /url: /wiki/Raven_Software
            - text: was developing a stand-alone Call of Duty Zombies game, after
            - link "Treyarch" [ref=e1295] [cursor=pointer]:
              - /url: /wiki/Treyarch
            - text: "'s internal decision to move from the traditional Black Ops Zombies mode and focusing on the single-player and multiplayer aspects of their next game,"
            - 'link "Call of Duty: Black Ops III" [ref=e1297] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops_III
            - text: (2015). Designed to be a
            - link "free-to-play" [ref=e1298] [cursor=pointer]:
              - /url: /wiki/Free-to-play_game
            - text: arena, the game was taking inspirations from the
            - link "Mad Max" [ref=e1300] [cursor=pointer]:
              - /url: /wiki/Mad_Max
            - text: movies. Former Raven's lead designer Michael Gulmmelt came along and confirmed the leaks in April 2024, and revealed that Raven canceled the project after Treyarch move back on the production of Black Ops Zombies and decided that Raven's game would create an internal competition.
            - superscript [ref=e1301]:
              - link "[75]" [ref=e1302] [cursor=pointer]:
                - /url: "#cite_note-CODZombies-79"
          - heading "Other media" [level=2] [ref=e1304]
          - heading "Comic books" [level=3] [ref=e1306]
          - paragraph [ref=e1307]:
            - 'link "Modern Warfare 2: Ghost" [ref=e1309] [cursor=pointer]':
              - /url: /wiki/Modern_Warfare_2:_Ghost
            - text: "is a six-part comic book mini-series based on Call of Duty: Modern Warfare 2. The storyline focuses on the backstory of the character"
            - link "Simon \"Ghost\" Riley" [ref=e1310] [cursor=pointer]:
              - /url: /wiki/Simon_%22Ghost%22_Riley
            - text: . The series is published by
            - link "WildStorm" [ref=e1311] [cursor=pointer]:
              - /url: /wiki/WildStorm_Productions
            - text: and the first issue was released on November 10, 2009, alongside the game.
            - superscript [ref=e1312]:
              - link "[76]" [ref=e1313] [cursor=pointer]:
                - /url: "#cite_note-Comic-80"
          - paragraph [ref=e1314]:
            - text: "Call of Duty: Zombies is a six-part comic book series published by"
            - link "Dark Horse Comics" [ref=e1315] [cursor=pointer]:
              - /url: /wiki/Dark_Horse_Comics
            - text: . The series ties in with the Zombies game mode of the Black Ops subseries developed by
            - link "Treyarch" [ref=e1316] [cursor=pointer]:
              - /url: /wiki/Treyarch
            - text: . The series is co-written by
            - link "Justin Jordan" [ref=e1317] [cursor=pointer]:
              - /url: /wiki/Justin_Jordan
            - text: ", Treyarch's Jason Blundell and Craig Houston. The series is illustrated by artist Jonathan Wayshak and colorist Dan Jackson. The cover arts are handled by artist"
            - link "Simon Bisley" [ref=e1318] [cursor=pointer]:
              - /url: /wiki/Simon_Bisley
            - text: ". The series was announced by Treyarch in July 2016, with the first issue slated for release in October. After a slight delay, the first issue was released on October 26, 2016. The five other issues were released in the months of 2017: issue #2 released on January 11, 2017; issue #3 released on March 1, 2017; issue #4 released on April 19, 2017; issue #5 released on June 21, 2017; and issue #6 released on August 23, 2017. A paperback edition containing all six issues was released on November 15, 2017."
            - superscript [ref=e1319]:
              - link "[77]" [ref=e1320] [cursor=pointer]:
                - /url: "#cite_note-81"
          - heading "Merchandise" [level=3] [ref=e1322]
          - paragraph [ref=e1323]:
            - text: In 2004,
            - link "Activision" [ref=e1324] [cursor=pointer]:
              - /url: /wiki/Activision
            - text: ", in cooperation with the companies Plan-B Toys and Radioactive Clown, released the \"Call of Duty: Series 1\" line of action figures, which included three American soldiers and three German soldiers from the World War II era."
            - superscript [ref=e1325]:
              - link "[78]" [ref=e1326] [cursor=pointer]:
                - /url: "#cite_note-82"
            - text: While the American G.I. action figure was made in 2004,
            - superscript [ref=e1327]:
              - link "[79]" [ref=e1328] [cursor=pointer]:
                - /url: "#cite_note-83"
            - text: Plan-B Toys later discontinued a controversial Nazi SS Guard action figure based on the Nazi Totenkopf officer seen in Call of Duty.
            - superscript [ref=e1329]:
              - link "[80]" [ref=e1330] [cursor=pointer]:
                - /url: "#cite_note-84"
            - text: In 2008,
            - link "McFarlane Toys" [ref=e1331] [cursor=pointer]:
              - /url: /wiki/McFarlane_Toys
            - text: "announced their partnership with Activision to produce action figures for the Call of Duty series. McFarlane Toys' first series of action figures were released in October 2008 and consists of four different figures: Marine with Flamethrower, Marine Infantry, British Special Ops, and Marine with Machine Gun."
            - superscript [ref=e1332]:
              - link "[81]" [ref=e1333] [cursor=pointer]:
                - /url: "#cite_note-85"
          - heading "Short films" [level=3] [ref=e1335]
          - paragraph [ref=e1336]:
            - text: Find Makarov is a fan-made film that was well received by Call of Duty publishers, Activision, who contacted We Can Pretend and subsequently produced a second short film, Operation Kingfish.
            - superscript [ref=e1337]:
              - link "[82]" [ref=e1338] [cursor=pointer]:
                - /url: "#cite_note-Joystiq-86"
          - paragraph [ref=e1339]:
            - 'link "Find Makarov: Operation Kingfish" [ref=e1341] [cursor=pointer]':
              - /url: /wiki/Find_Makarov:_Operation_Kingfish
            - text: is a fan-made
            - link "prequel" [ref=e1342] [cursor=pointer]:
              - /url: /wiki/Prequel
            - text: to
            - 'link "Call of Duty: Modern Warfare 2" [ref=e1344] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_2
            - text: and was first shown at Call of Duty XP. The video was produced by We Can Pretend, with visual effects by The Junction, and was endorsed by
            - link "Activision" [ref=e1345] [cursor=pointer]:
              - /url: /wiki/Activision
            - text: . The video tells the story of how
            - link "Captain Price" [ref=e1346] [cursor=pointer]:
              - /url: /wiki/Captain_Price
            - text: ended up in a Russian
            - link "Gulag" [ref=e1347] [cursor=pointer]:
              - /url: /wiki/Gulag
            - text: set before the events of Modern Warfare 2.
          - heading "Films" [level=3] [ref=e1349]
          - paragraph [ref=e1350]:
            - text: On November 6, 2015, upon the release of Black Ops III, The Hollywood Reporter reported that Activision Blizzard launched a production studio called
            - link "Activision Blizzard Studios" [ref=e1351] [cursor=pointer]:
              - /url: /wiki/Activision_Blizzard_Studios
            - text: and are planning a live action Call of Duty cinematic universe in 2019.
            - superscript [ref=e1352]:
              - link "[83]" [ref=e1353] [cursor=pointer]:
                - /url: "#cite_note-87"
            - text: On February 16, 2018, it was announced that
            - link "Stefano Sollima" [ref=e1354] [cursor=pointer]:
              - /url: /wiki/Stefano_Sollima
            - text: will direct the film. Days later, he told Metro UK that he is considering having both
            - link "Tom Hardy" [ref=e1355] [cursor=pointer]:
              - /url: /wiki/Tom_Hardy
            - text: and
            - link "Chris Pine" [ref=e1356] [cursor=pointer]:
              - /url: /wiki/Chris_Pine
            - text: as the leads for the film.
            - superscript [ref=e1357]:
              - link "[84]" [ref=e1358] [cursor=pointer]:
                - /url: "#cite_note-88"
            - superscript [ref=e1359]:
              - link "[85]" [ref=e1360] [cursor=pointer]:
                - /url: "#cite_note-89"
            - text: In an interview with FilmSlash, Sollima stated that the film will be a real soldier movie, not a war movie.
            - superscript [ref=e1361]:
              - link "[86]" [ref=e1362] [cursor=pointer]:
                - /url: "#cite_note-90"
            - text: On November 27, 2018, it was announced that
            - link "Joe Robert Cole" [ref=e1363] [cursor=pointer]:
              - /url: /wiki/Joe_Robert_Cole
            - text: will be writing the sequel.
            - superscript [ref=e1364]:
              - link "[87]" [ref=e1365] [cursor=pointer]:
                - /url: "#cite_note-91"
            - text: Filming of the first film was supposed to start in Spring 2019 for a 2020 or 2021 release.
            - superscript [ref=e1366]:
              - link "[88]" [ref=e1367] [cursor=pointer]:
                - /url: "#cite_note-92"
            - text: In February 2020, Sollima revealed in an interview that the film had been put on hold as it was not Activision's priority.
            - superscript [ref=e1368]:
              - link "[89]" [ref=e1369] [cursor=pointer]:
                - /url: "#cite_note-93"
          - paragraph [ref=e1370]:
            - text: In September 2025,
            - link "Paramount Pictures" [ref=e1371] [cursor=pointer]:
              - /url: /wiki/Paramount_Pictures
            - text: announced that they and
            - link "Microsoft" [ref=e1372] [cursor=pointer]:
              - /url: /wiki/Microsoft
            - text: owned
            - link "Activision" [ref=e1373] [cursor=pointer]:
              - /url: /wiki/Activision
            - text: have signed a deal that would see the studio develop, produce and distribute a live-action film based on the Call of Duty franchise.
            - superscript [ref=e1374]:
              - link "[90]" [ref=e1375] [cursor=pointer]:
                - /url: "#cite_note-94"
            - text: In October 2025, it was announced that
            - link "Peter Berg" [ref=e1376] [cursor=pointer]:
              - /url: /wiki/Peter_Berg
            - text: had been attached to direct, with
            - link "Taylor Sheridan" [ref=e1377] [cursor=pointer]:
              - /url: /wiki/Taylor_Sheridan
            - text: co-writing the screenplay and co-producing with Berg.
            - superscript [ref=e1378]:
              - link "[91]" [ref=e1379] [cursor=pointer]:
                - /url: "#cite_note-95"
            - text: On April 15, 2026, it was announced that the film would be released on June 30, 2028.
            - superscript [ref=e1380]:
              - link "[92]" [ref=e1381] [cursor=pointer]:
                - /url: "#cite_note-96"
          - heading "Esports" [level=2] [ref=e1383]
          - paragraph [ref=e1384]:
            - text: The Call of Duty games were used in
            - link "esports" [ref=e1385] [cursor=pointer]:
              - /url: /wiki/Esports
            - text: ", starting in 2006, alongside the game released at the time,"
            - 'link "Call of Duty 4: Modern Warfare" [ref=e1387] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty_4:_Modern_Warfare
            - text: .
            - superscript [ref=e1388]:
              - link "[93]" [ref=e1389] [cursor=pointer]:
                - /url: "#cite_note-97"
            - text: Over the years, the series has extended with releases such as
            - 'link "Call of Duty: World at War" [ref=e1391] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_World_at_War
            - text: ","
            - 'link "Call of Duty: Modern Warfare 2" [ref=e1393] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_2
            - text: ","
            - 'link "Call of Duty: Black Ops" [ref=e1395] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops
            - text: ","
            - 'link "Call of Duty: Modern Warfare 3" [ref=e1397] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_3
            - text: ","
            - 'link "Call of Duty: Black Ops II" [ref=e1399] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops_II
            - text: ","
            - 'link "Call of Duty: Ghosts" [ref=e1401] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Ghosts
            - text: ", and"
            - 'link "Call of Duty: Mobile" [ref=e1403] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Mobile
            - text: . Games are played in leagues like
            - link "Major League Gaming" [ref=e1404] [cursor=pointer]:
              - /url: /wiki/Major_League_Gaming
            - text: .
          - paragraph [ref=e1405]:
            - text: Players can compete in ladders or tournaments. The ladders are divided into several sub ladders such as the singles ladder, doubles ladder, team ladder (3v3 – 6v6) and hardcore team ladder (3v3 – 6v6). The difference between the regular team ladder and the hardcore team ladder is the in-game settings and thus a rule differentiation. Winning ladder matches on a competitive website rewards the user with experience points which add up to give them an overall rank.
            - superscript [ref=e1406]:
              - link "[94]" [ref=e1407] [cursor=pointer]:
                - /url: "#cite_note-98"
          - paragraph [ref=e1408]:
            - text: "The tournaments offered on these websites provide players with the opportunity to win cash prizes and trophies. The trophies are registered and saved on the player's profile if/when they win a tournament, and the prize money is deposited into his or her bank account. Call of Duty: Ghosts was the most competitively played game in 2014, with an average of 15,000 teams participating every season."
            - superscript [ref=e1409]:
              - link "[95]" [ref=e1410] [cursor=pointer]:
                - /url: "#cite_note-99"
          - paragraph [ref=e1411]:
            - text: For the past 6 seasons in competitive Call of Duty,
            - link "Full Sail University" [ref=e1412] [cursor=pointer]:
              - /url: /wiki/Full_Sail_University
            - text: has hosted a prize giveaway, giving $2,500 to the top team each season.
            - superscript [ref=e1413]:
              - link "[96]" [ref=e1414] [cursor=pointer]:
                - /url: "#cite_note-100"
            - text: "The other ladders give out credits and medals registered on players' profiles. Tournaments hosted on the Call of Duty: Ghosts's Arena give cost from 15 to 30 credits, thus averaging at a cost of about $18.75 per tournament. If the player competes with a team, the prize money is divided, and an equal cut is given to each player. Other tournaments with substantial prizes are hosted in specific cities and countries for"
            - link "LAN" [ref=e1415] [cursor=pointer]:
              - /url: /wiki/LAN
            - text: teams.
          - paragraph [ref=e1416]:
            - text: The biggest Call of Duty tournament hosted was
            - 'link "Call of Duty: Experience 2011" [ref=e1417] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Experience_2011
            - text: ", a tournament that began when Call of Duty: Modern Warfare 3 was released."
            - superscript [ref=e1418]:
              - link "[97]" [ref=e1419] [cursor=pointer]:
                - /url: "#cite_note-101"
          - paragraph [ref=e1420]:
            - text: Playing Call of Duty competitively is most popular in Europe and North America, with users who participate in tournaments and ladder matches daily.
            - superscript [ref=e1421]:
              - link "[98]" [ref=e1422] [cursor=pointer]:
                - /url: "#cite_note-102"
          - paragraph [ref=e1423]:
            - text: Activision launched a 12 team
            - link "Call of Duty League" [ref=e1424] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty_League
            - text: ", following a similar city-based franchise structure as the"
            - link "Overwatch League" [ref=e1425] [cursor=pointer]:
              - /url: /wiki/Overwatch_League
            - text: ", in January 2020. The league's teams include those from"
            - link "Atlanta" [ref=e1426] [cursor=pointer]:
              - /url: /wiki/Atlanta_FaZe
            - text: ","
            - link "Boston" [ref=e1427] [cursor=pointer]:
              - /url: /wiki/Boston_Breach
            - text: ","
            - link "the Carolinas" [ref=e1428] [cursor=pointer]:
              - /url: /wiki/Carolina_Royal_Ravens
            - text: ","
            - link "Las Vegas" [ref=e1429] [cursor=pointer]:
              - /url: /wiki/Vegas_Legion
            - text: ","
            - link "Miami" [ref=e1430] [cursor=pointer]:
              - /url: /wiki/Miami_Heretics
            - text: ","
            - link "Minnesota" [ref=e1431] [cursor=pointer]:
              - /url: /wiki/Minnesota_ROKKR
            - text: ","
            - link "New York" [ref=e1432] [cursor=pointer]:
              - /url: /wiki/New_York_Subliners
            - text: ","
            - link "Seattle" [ref=e1433] [cursor=pointer]:
              - /url: /wiki/Seattle_Surge
            - text: ","
            - link "Texas" [ref=e1434] [cursor=pointer]:
              - /url: /wiki/OpTic_Texas
            - text: and
            - link "Toronto" [ref=e1435] [cursor=pointer]:
              - /url: /wiki/Toronto_Ultra
            - text: ", and with two teams from Los Angeles, the"
            - link "Los Angeles Thieves" [ref=e1436] [cursor=pointer]:
              - /url: /wiki/Los_Angeles_Thieves
            - text: and
            - link "Los Angeles Guerrillas" [ref=e1437] [cursor=pointer]:
              - /url: /wiki/Los_Angeles_Guerrillas
            - text: .
            - superscript [ref=e1438]:
              - link "[99]" [ref=e1439] [cursor=pointer]:
                - /url: "#cite_note-103"
          - heading "Call of Duty Endowment" [level=2] [ref=e1441]
          - paragraph [ref=e1442]:
            - text: The
            - link "Call of Duty Endowment (CODE)" [ref=e1443] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty_Endowment_(CODE)
            - text: is a nonprofit foundation created by Activision Blizzard to help find employment for U.S. military veterans. The first donation, consisting of $125,000, was presented to the
            - link "Paralyzed Veterans of America" [ref=e1444] [cursor=pointer]:
              - /url: /wiki/Paralyzed_Veterans_of_America
            - text: .
            - superscript [ref=e1445]:
              - link "[100]" [ref=e1446] [cursor=pointer]:
                - /url: "#cite_note-104"
          - paragraph [ref=e1447]:
            - text: Co-chairman General
            - link "James L. Jones" [ref=e1448] [cursor=pointer]:
              - /url: /wiki/James_L._Jones
            - text: is a former
            - link "U.S. National Security Advisor" [ref=e1449] [cursor=pointer]:
              - /url: /wiki/National_Security_Advisor_(United_States)
            - text: .
            - superscript [ref=e1450]:
              - link "[101]" [ref=e1451] [cursor=pointer]:
                - /url: "#cite_note-105"
            - text: Founder
            - link "Robert Kotick" [ref=e1452] [cursor=pointer]:
              - /url: /wiki/Robert_Kotick
            - text: is the CEO of Activision Blizzard. Upon its founding in 2009, the organization announced a commitment to create thousands of career opportunities for veterans, including those returning from the
            - link "Middle East" [ref=e1453] [cursor=pointer]:
              - /url: /wiki/Middle_East
            - text: .
            - superscript [ref=e1454]:
              - link "[102]" [ref=e1455] [cursor=pointer]:
                - /url: "#cite_note-CODE-106"
            - text: Annual awards given by the endowment include the "Seal of Distinction", a $30,000 initial grant given to selected veteran's service organizations.
            - superscript [ref=e1456]:
              - link "[103]" [ref=e1457] [cursor=pointer]:
                - /url: "#cite_note-BKdannouncesreci-107"
            - text: In November 2014, the endowment launched the "Race to 1,000 Jobs" campaign to encourage gamers to donate money to and get involved in organizations that provide veterans with services.
            - superscript [ref=e1458]:
              - link "[104]" [ref=e1459] [cursor=pointer]:
                - /url: "#cite_note-BKecracejobs-108"
            - text: As of 2015 , the Call of Duty Endowment had provided around $12 million in grants to veterans' organizations in the United States, which has helped find jobs for 14,700 veterans.
            - superscript [ref=e1460]:
              - link "[105]" [ref=e1461] [cursor=pointer]:
                - /url: "#cite_note-callofendowment-109"
          - paragraph [ref=e1462]:
            - text: "On March 30, 2010, CODE presented 3,000 copies of Call of Duty: Modern Warfare 2, approximately $180,000 in value, to the"
            - link "U.S. Navy" [ref=e1463] [cursor=pointer]:
              - /url: /wiki/U.S._Navy
            - text: . The copies were delivered to over 300 ships and submarines as well as Navy Morale, Welfare, and Recreation facilities worldwide.
            - superscript [ref=e1464]:
              - link "[106]" [ref=e1465] [cursor=pointer]:
                - /url: "#cite_note-110"
          - heading "Criticism, controversies, and legal actions" [level=2] [ref=e1467]: Criticism, controversies, and legal actions
          - heading "Accusations of stereotyping and Western bias" [level=3] [ref=e1469]
          - paragraph [ref=e1470]:
            - text: The Call of Duty series has been the subject of criticism for its "western-centric worldview, clumsy stereotyping and fetishisation of military power", according to
            - link "The Guardian" [ref=e1472] [cursor=pointer]:
              - /url: /wiki/The_Guardian
            - text: "'s Keith Stuart."
            - superscript [ref=e1473]:
              - link "[107]" [ref=e1474] [cursor=pointer]:
                - /url: "#cite_note-The_Guardian_COD_3-111"
            - text: Writing for
            - link "GameSpot" [ref=e1476] [cursor=pointer]:
              - /url: /wiki/GameSpot
            - text: ", Phil Hornshall said the series \"usually comes off as pro-gun and pro-military at the very least, and even"
            - link "jingoistic" [ref=e1477] [cursor=pointer]:
              - /url: /wiki/Jingoistic
            - text: ."
            - superscript [ref=e1478]:
              - link "[108]" [ref=e1479] [cursor=pointer]:
                - /url: "#cite_note-GameSpot_COD-112"
            - text: Sam Biddle of
            - link "The New Yorker" [ref=e1481] [cursor=pointer]:
              - /url: /wiki/The_New_Yorker
            - text: wrote that the series maintains "massive bipartisan appeal" owing to its "reactionary nature". He criticized Activision Blizzard's claim that the games were
            - link "apolitical" [ref=e1482] [cursor=pointer]:
              - /url: /wiki/Apolitical
            - text: ", writing they \"now pushed so deeply into the territory of right-wing fantasy that it reaches a point of inadvertent parody\"."
            - superscript [ref=e1483]:
              - link "[109]" [ref=e1484] [cursor=pointer]:
                - /url: "#cite_note-The_New_Yorker_COD-113"
            - text: Similarly,
            - link "PC Gamer" [ref=e1486] [cursor=pointer]:
              - /url: /wiki/PC_Gamer
            - text: "'s Tyler Wilde criticized marketing that Call of Duty: WWII was made from anti-war sentiment and that playing as a virtual soldier could increase empathy; he felt through the game's announcement trailer it instead glorified a \"brutal but noble\" conflict in a game series that was no deeper than an action drama."
            - superscript [ref=e1487]:
              - link "[110]" [ref=e1488] [cursor=pointer]:
                - /url: "#cite_note-PC_Gamer_COD-114"
          - paragraph [ref=e1489]:
            - text: Others have faulted Call of Duty's representation of
            - link "ethnic" [ref=e1490] [cursor=pointer]:
              - /url: /wiki/Ethnic
            - text: and
            - link "religious" [ref=e1491] [cursor=pointer]:
              - /url: /wiki/Religious
            - text: groups.
            - link "Kotaku" [ref=e1493] [cursor=pointer]:
              - /url: /wiki/Kotaku
            - text: "'s Alyssa Mercante, alongside several"
            - link "Muslim" [ref=e1494] [cursor=pointer]:
              - /url: /wiki/Muslim
            - text: and
            - link "Arab" [ref=e1495] [cursor=pointer]:
              - /url: /wiki/Arab
            - text: members of the games industry, thought the series "historically dehumanize[s]" the aforementioned groups with harmful stereotypes and narratives. This included portraying the
            - link "Middle East" [ref=e1496] [cursor=pointer]:
              - /url: /wiki/Middle_East
            - text: as undesirable where "the line between truth and fiction can blur", and creating localized fictional regions in a way that "perpetuat[es] the idea that there is a singular, Middle Eastern country".
            - superscript [ref=e1497]:
              - link "[111]" [ref=e1498] [cursor=pointer]:
                - /url: "#cite_note-Kotaku_COD-115"
            - link "Inverse" [ref=e1500] [cursor=pointer]:
              - /url: /wiki/Inverse_(website)
            - text: "'s Gregory Lawrence felt that Call of Duty avoided accusations of"
            - link "Islamophobia" [ref=e1501] [cursor=pointer]:
              - /url: /wiki/Islamophobia
            - text: by including "good" Muslim characters, but without further exploring their morality.
            - superscript [ref=e1502]:
              - link "[112]" [ref=e1503] [cursor=pointer]:
                - /url: "#cite_note-Inverse_COD-116"
            - text: Writing for
            - link "The Progressive" [ref=e1505] [cursor=pointer]:
              - /url: /wiki/The_Progressive
            - text: ", Joe Mayall thought that the games' depiction of its antagonists as"
            - link "anti-Western" [ref=e1506] [cursor=pointer]:
              - /url: /wiki/Anti-Western_sentiment
            - text: was a "dangerous oversimplification", the same attitude of which had led to the United States' (US)
            - link "participation in wars" [ref=e1507] [cursor=pointer]:
              - /url: /wiki/List_of_wars_involving_the_United_States
            - text: .
            - superscript [ref=e1508]:
              - link "[113]" [ref=e1509] [cursor=pointer]:
                - /url: "#cite_note-The_Progressive_COD-117"
          - paragraph [ref=e1510]:
            - text: A perceived strong Western bias in the series has been a point of criticism.
            - superscript [ref=e1511]:
              - link "[111]" [ref=e1512] [cursor=pointer]:
                - /url: "#cite_note-Kotaku_COD-115"
            - superscript [ref=e1513]:
              - link "[113]" [ref=e1514] [cursor=pointer]:
                - /url: "#cite_note-The_Progressive_COD-117"
            - superscript [ref=e1515]:
              - link "[114]" [ref=e1516] [cursor=pointer]:
                - /url: "#cite_note-TheGamer_COD-118"
            - superscript [ref=e1517]:
              - link "[115]" [ref=e1518] [cursor=pointer]:
                - /url: "#cite_note-UnHerd_COD-119"
            - text: TheGamer's Tessa Kaur condemned its portrayal of war that she thought depicted
            - link "U.S. soldiers" [ref=e1519] [cursor=pointer]:
              - /url: /wiki/United_States_Armed_Forces
            - text: as heroes while having "no moral quandary", being "distinctively pro-
            - link "intervention" [ref=e1520] [cursor=pointer]:
              - /url: /wiki/Military_intervention
            - text: "\", and \"perpetuat[ing] false beliefs\" about real-world conflicts. Kaur questioned if the games could ever move beyond glorifying the U.S. military to tell \"impactful and honest stories about the cruelty of war\"."
            - superscript [ref=e1521]:
              - link "[114]" [ref=e1522] [cursor=pointer]:
                - /url: "#cite_note-TheGamer_COD-118"
            - text: Mayall wrote Call of Duty "exaggerates the effectiveness and cleanliness of
            - link "militarism" [ref=e1523] [cursor=pointer]:
              - /url: /wiki/United_States_militarism
            - text: while understating the repercussions", leaving audiences with a heavily skewed version of reality. He felt this did the most harm by portraying military intervention as the best form of
            - link "foreign policy" [ref=e1524] [cursor=pointer]:
              - /url: /wiki/Foreign_policy
            - text: .
            - superscript [ref=e1525]:
              - link "[113]" [ref=e1526] [cursor=pointer]:
                - /url: "#cite_note-The_Progressive_COD-117"
            - text: Conversely, Lawrence thought that the series had a surprising indifference in presenting the U.S. military favorably; he cited the rebooted Modern Warfare sub-series involving player-characters serving "corrupt masters embedded in a corrupt operation run by more corrupt masters".
            - superscript [ref=e1527]:
              - link "[112]" [ref=e1528] [cursor=pointer]:
                - /url: "#cite_note-Inverse_COD-116"
          - paragraph [ref=e1529]:
            - text: Some have linked the sensed partiality with the
            - link "U.S. government" [ref=e1530] [cursor=pointer]:
              - /url: /wiki/Federal_government_of_the_United_States
            - text: "'s"
            - link "military–entertainment complex" [ref=e1531] [cursor=pointer]:
              - /url: /wiki/Military%E2%80%93entertainment_complex
            - text: . Kaur wrote Call of Duty was one example of entertainment media the authorities had exploited since
            - link "World War II" [ref=e1532] [cursor=pointer]:
              - /url: /wiki/World_War_II
            - text: to promote certain narratives in their favor;
            - superscript [ref=e1533]:
              - link "[114]" [ref=e1534] [cursor=pointer]:
                - /url: "#cite_note-TheGamer_COD-118"
            - text: Mayall noted
            - link "the Pentagon" [ref=e1535] [cursor=pointer]:
              - /url: /wiki/United_States_Department_of_Defense
            - text: had consulted on "more than a thousand movies and dozens of video games".
            - superscript [ref=e1536]:
              - link "[113]" [ref=e1537] [cursor=pointer]:
                - /url: "#cite_note-The_Progressive_COD-117"
            - text: "Alan MacLeod, a writer on the subject of propaganda, suggested that Call of Duty: Modern Warfare II was a \"psychological operation\" for the US."
            - superscript [ref=e1538]:
              - link "[115]" [ref=e1539] [cursor=pointer]:
                - /url: "#cite_note-UnHerd_COD-119"
            - text: Affiliations between Call of Duty staff and the U.S. government have been felt to contribute to this.
            - superscript [ref=e1540]:
              - link "[114]" [ref=e1541] [cursor=pointer]:
                - /url: "#cite_note-TheGamer_COD-118"
            - superscript [ref=e1542]:
              - link "[115]" [ref=e1543] [cursor=pointer]:
                - /url: "#cite_note-UnHerd_COD-119"
            - superscript [ref=e1544]:
              - link "[116]" [ref=e1545] [cursor=pointer]:
                - /url: "#cite_note-The_Guardian_COD-120"
            - text: "In an interview with The Guardian, Call of Duty: Black Ops II writer Dave Anthony said how he was contacted by a former Pentagon official to join an expert panel to discuss the future of warfare. He consequently joined a Washington-based"
            - link "think tank" [ref=e1546] [cursor=pointer]:
              - /url: /wiki/Think_tank
            - text: that advises on the future of unknown conflicts and threats.
            - superscript [ref=e1547]:
              - link "[116]" [ref=e1548] [cursor=pointer]:
                - /url: "#cite_note-The_Guardian_COD-120"
            - text: "Similarly, while plotting Call of Duty: Advanced Warfare, Michael Condrey of Sledgehammer Games revealed the studio had consulted with a Pentagon advisor to discuss the likeliest future military threat to the US."
            - superscript [ref=e1549]:
              - link "[113]" [ref=e1550] [cursor=pointer]:
                - /url: "#cite_note-The_Progressive_COD-117"
            - superscript [ref=e1551]:
              - link "[116]" [ref=e1552] [cursor=pointer]:
                - /url: "#cite_note-The_Guardian_COD-120"
            - superscript [ref=e1553]:
              - link "[117]" [ref=e1554] [cursor=pointer]:
                - /url: "#cite_note-The_Guardian_COD_2-121"
            - text: Some wrote of how Call of Duty had also been used as a recruitment tool by the U.S. military.
            - superscript [ref=e1555]:
              - link "[114]" [ref=e1556] [cursor=pointer]:
                - /url: "#cite_note-TheGamer_COD-118"
            - superscript [ref=e1557]:
              - link "[115]" [ref=e1558] [cursor=pointer]:
                - /url: "#cite_note-UnHerd_COD-119"
            - text: Kaur said they had once considered plans to grow its audience by paying Call of Duty streamers and organising
            - link "esports" [ref=e1559] [cursor=pointer]:
              - /url: /wiki/Esports
            - text: tournaments involving soldiers and streamers; they had backed out when reports of
            - link "sexual harassment at Activision Blizzard" [ref=e1560] [cursor=pointer]:
              - /url: /wiki/Activision_Blizzard#Workplace_misconduct_lawsuit_and_acquisition_by_Microsoft_(2021–present)
            - text: were publicized.
            - superscript [ref=e1561]:
              - link "[114]" [ref=e1562] [cursor=pointer]:
                - /url: "#cite_note-TheGamer_COD-118"
          - heading "Fallout with Infinity Ward leadership" [level=3] [ref=e1564]
          - note [ref=e1565]:
            - text: "Main article:"
            - link "Infinity Ward" [ref=e1566] [cursor=pointer]:
              - /url: /wiki/Infinity_Ward
          - paragraph [ref=e1567]:
            - text: As Infinity Ward's founders Jason West and Vince Zampella started new contract negotiations to continue developing the Call of Duty Activision around 2007, a number of legal issues arose between Infinity Ward and Activision. Ultimately, West and Zampella were forced out of Infinity Ward, later forming
            - link "Respawn Entertainment" [ref=e1568] [cursor=pointer]:
              - /url: /wiki/Respawn_Entertainment
            - text: within
            - link "Electronic Arts" [ref=e1569] [cursor=pointer]:
              - /url: /wiki/Electronic_Arts
            - text: . West and Zampella, as well as several Infinity Ward staff that departed the studio alongside them to join Respawn, filed lawsuits against Activision related to unpaid royalties and bonuses.
          - heading "No Russian" [level=3] [ref=e1571]
          - note [ref=e1572]:
            - text: "Main article:"
            - link "No Russian" [ref=e1573] [cursor=pointer]:
              - /url: /wiki/No_Russian
          - paragraph [ref=e1574]:
            - text: Modern Warfare 2 received significant controversy due to its inclusion of the level "
            - link "No Russian" [ref=e1575] [cursor=pointer]:
              - /url: /wiki/No_Russian
            - text: "\", in which the player participates in a massacre of civilians at a Russian airport."
          - heading "Trademark infringement claims by AM General" [level=3] [ref=e1577]
          - paragraph [ref=e1578]:
            - link "AM General" [ref=e1579] [cursor=pointer]:
              - /url: /wiki/AM_General
            - text: ", the manufacturer of the"
            - link "Humvee" [ref=e1580] [cursor=pointer]:
              - /url: /wiki/Humvee
            - text: ", sued Activision in 2017 for using the Humvee in multiple Call of Duty games."
            - superscript [ref=e1581]:
              - link "[118]" [ref=e1582] [cursor=pointer]:
                - /url: "#cite_note-122"
            - text: A federal district judge gave Activision a summary motion in its favor to dismiss the case in April 2020, stating that the purpose of the use of the Humvee in the games, to provide military realism, was quite different from the trademark purpose that AM General had established, for selling to the military.
            - superscript [ref=e1583]:
              - link "[119]" [ref=e1584] [cursor=pointer]:
                - /url: "#cite_note-123"
          - heading "References" [level=2] [ref=e1586]
          - list [ref=e1589]:
            - listitem [ref=e1590]:
              - link "^" [ref=e1593] [cursor=pointer]:
                - /url: "#cite_ref-1"
              - generic [ref=e1594]:
                - link "At half a billion sales, Call of Duty is as good as it's ever been" [ref=e1595] [cursor=pointer]:
