          - 'heading "Call of Duty: Modern Warfare: Mobilized" [level=4] [ref=e1149]'
          - note [ref=e1150]:
            - text: "Main article:"
            - 'link "Call of Duty: Modern Warfare: Mobilized" [ref=e1151] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare:_Mobilized
          - paragraph [ref=e1152]:
            - text: "Call of Duty: Modern Warfare: Mobilized is the Nintendo DS companion game for"
            - link "Modern Warfare 2" [ref=e1154] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_2
            - text: . Developed by
            - link "n-Space" [ref=e1155] [cursor=pointer]:
              - /url: /wiki/N-Space
            - text: ", the game takes place in the same setting as the main console game but follows a different storyline and cast of characters. Playing as the S.A.S. and the Marines in campaign mode, both forces are trying to find a nuclear bomb."
          - 'heading "Call of Duty: Black Ops (for Nintendo DS)" [level=4] [ref=e1157]': "Call of Duty: Black Ops (for Nintendo DS)"
          - paragraph [ref=e1158]:
