          - paragraph [ref=e134]:
            - generic [ref=e135]: Call of Duty
            - text: (
            - generic [ref=e136]: CoD
            - text: ) is a
            - link "first-person shooter" [ref=e137] [cursor=pointer]:
              - /url: /wiki/First-person_shooter
            - text: military
            - link "video game" [ref=e138] [cursor=pointer]:
              - /url: /wiki/Video_game
            - text: series and
            - link "media franchise" [ref=e139] [cursor=pointer]:
              - /url: /wiki/Media_franchise
            - text: published by
            - link "Activision" [ref=e140] [cursor=pointer]:
              - /url: /wiki/Activision
            - text: ", starting in 2003. The games were first developed by"
            - link "Infinity Ward" [ref=e141] [cursor=pointer]:
              - /url: /wiki/Infinity_Ward
            - text: ", then by"
            - link "Treyarch" [ref=e142] [cursor=pointer]:
              - /url: /wiki/Treyarch
            - text: and
            - link "Sledgehammer Games" [ref=e143] [cursor=pointer]:
              - /url: /wiki/Sledgehammer_Games
            - text: . Several spin-off and handheld games were made by other developers. The most recent,
            - 'link "Call of Duty: Black Ops 7" [ref=e145] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops_7
            - text: ", was released on November 14, 2025."
          - paragraph [ref=e146]:
            - text: The series originally focused on a
            - link "World War II" [ref=e147] [cursor=pointer]:
              - /url: /wiki/World_War_II
            - text: setting, with Infinity Ward developing
            - link "Call of Duty" [ref=e149] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty_(video_game)
            - text: (2003) and
            - link "Call of Duty 2" [ref=e151] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty_2
            - text: (2005) and
            - link "Treyarch" [ref=e152] [cursor=pointer]:
              - /url: /wiki/Treyarch
            - text: developing
            - link "Call of Duty 3" [ref=e154] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty_3
            - text: (2006). Infinity Ward's
            - 'link "Call of Duty 4: Modern Warfare" [ref=e156] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty_4:_Modern_Warfare
            - text: (2007) introduced a modern setting and proved to be the breakthrough title for the series, creating the Modern Warfare sub-series; a
            - link "Modern Warfare remastered version" [ref=e157] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_Remastered
            - text: was released in 2016. Two other entries,
            - link "Modern Warfare 2" [ref=e159] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_2
            - text: (2009) and
            - link "Modern Warfare 3" [ref=e161] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_3
            - text: (2011), were made. The sub-series received a reboot with
            - link "Modern Warfare" [ref=e163] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_(2019_video_game)
            - text: in 2019,
            - link "Modern Warfare II" [ref=e165] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_II_(2022_video_game)
            - text: in 2022, and
            - link "Modern Warfare III" [ref=e167] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_III_(2023_video_game)
            - text: in 2023. Infinity Ward has also developed two games outside of the Modern Warfare sub-series,
            - link "Ghosts" [ref=e169] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Ghosts
            - text: (2013) and
            - link "Infinite Warfare" [ref=e171] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Infinite_Warfare
            - text: (2016).
          - paragraph [ref=e172]:
            - text: Treyarch made one last World War II-based game,
            - link "World at War" [ref=e174] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_World_at_War
            - text: (2008), before releasing
            - link "Black Ops" [ref=e176] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Black_Ops
            - text: (2010) and subsequently creating the Black Ops sub-series. Six more entries,
            - link "Black Ops II" [ref=e178] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Black_Ops_II
            - text: (2012),
            - link "Black Ops III" [ref=e180] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Black_Ops_III
            - text: (2015),
            - link "Black Ops 4" [ref=e182] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Black_Ops_4
            - text: (2018),
            - link "Black Ops Cold War" [ref=e184] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Black_Ops_Cold_War
            - text: (2020),
            - link "Black Ops 6" [ref=e186] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Black_Ops_6
            - text: (2024), and
            - link "Black Ops 7" [ref=e188] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Black_Ops_7
            - text: (2025) were made, the latter three in conjunction with
            - link "Raven Software" [ref=e189] [cursor=pointer]:
              - /url: /wiki/Raven_Software
            - text: . Sledgehammer Games, which were co-developers for Modern Warfare 3, have also developed three titles,
            - link "Advanced Warfare" [ref=e191] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Advanced_Warfare
            - text: (2014),
            - link "WWII" [ref=e193] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_WWII
            - text: (2017), and
            - link "Vanguard" [ref=e195] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Vanguard
            - text: (2021). They are also the lead developer for Modern Warfare III (2023), the third entry in the Modern Warfare reboot sub-series.
          - paragraph [ref=e196]:
            - text: As of October 2023 , Call of Duty has sold over 500 million copies and has 100 million monthly active players across all platforms.
            - superscript [ref=e197]:
              - link "[1]" [ref=e198] [cursor=pointer]:
                - /url: "#cite_note-1"
            - superscript [ref=e199]:
              - link "[2]" [ref=e200] [cursor=pointer]:
                - /url: "#cite_note-2"
            - text: The franchise generated $30 billion in revenue by 2022.
            - superscript [ref=e201]:
              - link "[3]" [ref=e202] [cursor=pointer]:
                - /url: "#cite_note-3"
            - text: The series is verified by the
            - link "Guinness World Records" [ref=e203] [cursor=pointer]:
              - /url: /wiki/Guinness_World_Records
            - text: as the best-selling first-person shooter game series. It is also the most successful video game franchise created in the
            - link "United States" [ref=e204] [cursor=pointer]:
              - /url: /wiki/United_States
            - text: and the third
            - link "best-selling video game franchise of all time" [ref=e205] [cursor=pointer]:
              - /url: /wiki/List_of_best-selling_video_game_franchises
            - text: . Other products in the franchise include a line of
            - link "action figures" [ref=e206] [cursor=pointer]:
              - /url: /wiki/Action_figure
            - text: designed by
            - link "Plan B Toys" [ref=e207] [cursor=pointer]:
              - /url: /wiki/Plan_B_Toys
            - text: ", a"
            - link "card game" [ref=e208] [cursor=pointer]:
              - /url: /wiki/Card_game
            - text: created by
            - link "Upper Deck Company" [ref=e209] [cursor=pointer]:
              - /url: /wiki/Upper_Deck_Company
            - text: ", Mega Bloks sets by"
            - link "Mega Brands" [ref=e210] [cursor=pointer]:
              - /url: /wiki/Mega_Brands
            - text: ", and a"
            - link "comic book" [ref=e211] [cursor=pointer]:
              - /url: /wiki/Comic_book
            - text: miniseries published by
            - link "WildStorm Productions" [ref=e212] [cursor=pointer]:
              - /url: /wiki/WildStorm_Productions
            - text: ", and a feature film in development."
