          - heading "Call of Duty Online" [level=3] [ref=e859]
          - note [ref=e860]:
            - text: "Main article:"
            - link "Call of Duty Online" [ref=e861] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty_Online
          - paragraph [ref=e862]:
            - text: Call of Duty Online was announced by
            - link "Activision" [ref=e863] [cursor=pointer]:
              - /url: /wiki/Activision_Blizzard
            - text: when the company first stated their interest in a
            - link "Massively multiplayer online game" [ref=e864] [cursor=pointer]:
              - /url: /wiki/Massively_multiplayer_online_game
            - text: (MMO) in early 2011. By then, it had been in development for two years. Call of Duty Online is
            - link "free-to-play" [ref=e865] [cursor=pointer]:
              - /url: /wiki/Free-to-play
            - text: for mainland China and is hosted by
            - link "Tencent" [ref=e866] [cursor=pointer]:
              - /url: /wiki/Tencent
            - text: ", since Activision had lost the publishing rights to Call of Duty and several other franchises in China due to a legal dispute on most of the gaming consoles ("
            - link "Xbox 360" [ref=e867] [cursor=pointer]:
              - /url: /wiki/Xbox_360
            - text: ","
            - link "PlayStation 3" [ref=e868] [cursor=pointer]:
              - /url: /wiki/PlayStation_3
            - text: ", and"
            - link "Wii" [ref=e869] [cursor=pointer]:
              - /url: /wiki/Wii
            - text: ).
          - 'heading "Call of Duty: Heroes" [level=3] [ref=e871]'
          - note [ref=e872]:
            - text: "Main article:"
            - 'link "Call of Duty: Heroes" [ref=e873] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Heroes
          - paragraph [ref=e874]: "Call of Duty: Heroes was a real-time strategy game developed by Faceroll Games and published by Activision for Android and iOS."
          - 'heading "Call of Duty: Mobile" [level=3] [ref=e876]'
          - note [ref=e877]:
            - text: "Main article:"
            - 'link "Call of Duty: Mobile" [ref=e878] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Mobile
          - paragraph [ref=e879]:
            - text: "Call of Duty: Mobile is the franchise's mobile title for iOS and Android developed by"
            - link "Tencent" [ref=e880] [cursor=pointer]:
              - /url: /wiki/Tencent
            - text: Games'
            - link "TiMi Studios" [ref=e881] [cursor=pointer]:
              - /url: /wiki/TiMi_Studios
            - text: . It was released globally on October 1, 2019.
            - superscript [ref=e882]:
              - link "[58]" [ref=e883] [cursor=pointer]:
                - /url: "#cite_note-62"
            - text: Previously, it was first announced on March 18, 2019, at the year's
            - link "Game Developers Conference" [ref=e884] [cursor=pointer]:
              - /url: /wiki/Game_Developers_Conference
            - text: .
            - superscript [ref=e885]:
              - link "[59]" [ref=e886] [cursor=pointer]:
                - /url: "#cite_note-63"
            - text: As of October 4, 2019, the game has surpassed over 35 million downloads worldwide.
            - superscript [ref=e887]:
              - link "[60]" [ref=e888] [cursor=pointer]:
                - /url: "#cite_note-64"
          - 'heading "Call of Duty: Warzone (2020)" [level=3] [ref=e890]': "Call of Duty: Warzone (2020)"
          - note [ref=e891]:
            - text: "Main article:"
            - 'link "Call of Duty: Warzone" [ref=e892] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Warzone
          - paragraph [ref=e893]:
            - text: "Call of Duty: Warzone is an online battle royale game developed by Infinity Ward and Raven Software and released by Activision. The game was released on March 10, 2020, as part of Modern Warfare (2019), but can be downloaded without ownership of the former title. The game shares progression with, and uses gameplay items from Modern Warfare, as well as Black Ops Cold War and Vanguard following several integration updates to incorporate content from these titles. Activision has announced that a mobile version of Warzone was in development, slated to be released sometime in the future."
            - superscript [ref=e894]:
              - link "[61]" [ref=e895] [cursor=pointer]:
                - /url: "#cite_note-65"
          - 'heading "Call of Duty: Warzone (2022)" [level=3] [ref=e897]': "Call of Duty: Warzone (2022)"
          - note [ref=e898]:
            - text: "Main article:"
            - 'link "Call of Duty: Warzone (2022 video game)" [ref=e899] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Warzone_(2022_video_game)
          - paragraph [ref=e900]: "A successor to Warzone, initially titled Call of Duty: Warzone 2.0, also developed by Infinity Ward and Raven Software, was released on November 16, 2022, as part of a content update for Modern Warfare II. Following its fourth seasonal update, Warzone 2.0 was renamed to simply Warzone. Like the previous iteration, Warzone (2022) is available for separate download without requiring ownership of Modern Warfare II, and was subsequently integrated with gameplay items and progression from Modern Warfare III. In addition to sharing progression with the aforementioned titles, the game is also linked to Warzone Mobile, a standalone mobile game that incorporates Modern Warfare II and Modern Warfare III gameplay items while played on separate maps and game modes."
          - 'heading "Call of Duty: Warzone Mobile" [level=3] [ref=e902]'
          - note [ref=e903]:
            - text: "Main article:"
            - 'link "Call of Duty: Warzone Mobile" [ref=e904] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Warzone_Mobile
          - paragraph [ref=e905]:
            - text: "Call of Duty: Warzone Mobile is a discontinued mobile battle royale game developed by Activision Shanghai, Beenox, Digital Legends Entertainment, and Solid State Studios, in partnership with other Activision studios."
            - superscript [ref=e906]:
              - text: "["
              - link "citation needed" [ref=e908] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
            - text: The game has cross-progression with Modern Warfare II, Modern Warfare III and Warzone 2.0 and uses their gameplay items but does not support cross-platform play with the aforementioned titles. The game was released on November 30, 2022, in Australia and March 24, 2023, in Chile, Norway and Sweden, as part of a "Limited Release" phase, with the first map being a ported version of Verdansk, which first appeared in the original Warzone. The game was officially released for
            - link "iOS" [ref=e909] [cursor=pointer]:
              - /url: /wiki/IOS
            - text: and
            - link "Android" [ref=e910] [cursor=pointer]:
              - /url: /wiki/Android_(operating_system)
            - text: devices on March 21, 2024.
