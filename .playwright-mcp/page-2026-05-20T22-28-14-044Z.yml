          - heading "World War II games" [level=3] [ref=e464]
          - heading "Call of Duty" [level=4] [ref=e466]
          - note [ref=e467]:
            - text: "Main article:"
            - link "Call of Duty (video game)" [ref=e468] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty_(video_game)
          - paragraph [ref=e469]:
            - text: Call of Duty is a first-person shooter video game based on
            - link "id Tech 3" [ref=e470] [cursor=pointer]:
              - /url: /wiki/Id_Tech_3
            - text: ", and was released on October 29, 2003. The game was developed by"
            - link "Infinity Ward" [ref=e471] [cursor=pointer]:
              - /url: /wiki/Infinity_Ward
            - text: and published by
            - link "Activision" [ref=e472] [cursor=pointer]:
              - /url: /wiki/Activision
            - text: . The game simulates the
            - link "infantry" [ref=e473] [cursor=pointer]:
              - /url: /wiki/Infantry
            - text: and
            - link "combined arms" [ref=e474] [cursor=pointer]:
              - /url: /wiki/Combined_arms
            - text: warfare of
            - link "World War II" [ref=e475] [cursor=pointer]:
              - /url: /wiki/World_War_II
            - text: .
            - superscript [ref=e476]:
              - link "[4]" [ref=e477] [cursor=pointer]:
                - /url: "#cite_note-CoD1-8"
            - text: An expansion pack,
            - 'link "Call of Duty: United Offensive" [ref=e479] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_United_Offensive
            - text: ", was developed by"
            - link "Gray Matter Studios" [ref=e480] [cursor=pointer]:
              - /url: /wiki/Gray_Matter_Studios
            - text: with contributions from Pi Studios and produced by Activision. The game follows American and British paratroopers and the Red Army. The
            - link "Mac OS X" [ref=e481] [cursor=pointer]:
              - /url: /wiki/Mac_OS_X
            - text: version of the game was ported by
            - link "Aspyr Media" [ref=e482] [cursor=pointer]:
              - /url: /wiki/Aspyr_Media
            - text: . In late 2004, the
            - link "N-Gage" [ref=e483] [cursor=pointer]:
              - /url: /wiki/N-Gage_(device)
            - text: version was developed by
            - link "Nokia" [ref=e484] [cursor=pointer]:
              - /url: /wiki/Nokia
            - text: "and published by Activision. Other versions were released for PC, including Collector's Edition (with soundtrack and strategy guide), Game of the Year Edition (includes game updates), and the Deluxe Edition (which contains the United Offensive expansion and soundtrack; in Europe the soundtrack was not included). On September 22, 2006, Call of Duty, United Offensive, and Call of Duty 2 were released together as Call of Duty: War Chest for PC."
            - superscript [ref=e485]:
              - link "[5]" [ref=e486] [cursor=pointer]:
                - /url: "#cite_note-9"
            - text: Since November 12, 2007, Call of Duty games have been available for purchase via
            - link "Valve" [ref=e487] [cursor=pointer]:
              - /url: /wiki/Valve_Corporation
            - text: "'s content delivery platform"
            - link "Steam" [ref=e488] [cursor=pointer]:
              - /url: /wiki/Steam_(service)
            - text: .
            - superscript [ref=e489]:
              - link "[6]" [ref=e490] [cursor=pointer]:
                - /url: "#cite_note-10"
          - heading "Call of Duty 2" [level=4] [ref=e492]
          - note [ref=e493]:
            - text: "Main article:"
            - link "Call of Duty 2" [ref=e494] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty_2
          - paragraph [ref=e495]:
            - text: Call of Duty 2 is a first-person shooter video game and the sequel to Call of Duty. It was developed by Infinity Ward and published by Activision. The game is set during World War II and is experienced through the perspectives of soldiers in the
            - link "Red Army" [ref=e496] [cursor=pointer]:
              - /url: /wiki/Red_Army
            - text: ","
            - link "British Army" [ref=e497] [cursor=pointer]:
              - /url: /wiki/British_Army
            - text: ", and"
            - link "United States Army" [ref=e498] [cursor=pointer]:
              - /url: /wiki/United_States_Army
            - text: . It was released on October 25, 2005, for
            - link "Windows" [ref=e499] [cursor=pointer]:
              - /url: /wiki/Windows
            - text: ", November 15, 2005, for the"
            - link "Xbox 360" [ref=e500] [cursor=pointer]:
              - /url: /wiki/Xbox_360
            - text: ", and June 13, 2006, for Mac OS X. Other versions were made for"
            - link "mobile phones" [ref=e501] [cursor=pointer]:
              - /url: /wiki/Mobile_phone
            - text: ","
            - link "Pocket PCs" [ref=e502] [cursor=pointer]:
              - /url: /wiki/Pocket_PC
            - text: ", and"
            - link "smartphones" [ref=e503] [cursor=pointer]:
              - /url: /wiki/Smartphone
            - text: .
          - heading "Call of Duty 3" [level=4] [ref=e505]
          - note [ref=e506]:
            - text: "Main article:"
            - link "Call of Duty 3" [ref=e507] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty_3
          - paragraph [ref=e508]:
            - text: Call of Duty 3 is a first-person shooter and the third installment in the Call of Duty video game series. Released on November 7, 2006, the game was developed by
            - link "Treyarch" [ref=e509] [cursor=pointer]:
              - /url: /wiki/Treyarch
            - text: ", and was the first major installment in the Call of Duty series not to be developed by Infinity Ward. It was also the first not to be released on the PC platform. It was released on the"
            - link "PlayStation 2" [ref=e510] [cursor=pointer]:
              - /url: /wiki/PlayStation_2
            - text: ","
            - link "PlayStation 3" [ref=e511] [cursor=pointer]:
              - /url: /wiki/PlayStation_3
            - text: ","
            - link "Wii" [ref=e512] [cursor=pointer]:
              - /url: /wiki/Wii
            - text: ", Xbox, and Xbox 360."
            - superscript [ref=e513]:
              - link "[7]" [ref=e514] [cursor=pointer]:
                - /url: "#cite_note-11"
          - 'heading "Call of Duty: WWII" [level=4] [ref=e516]'
          - note [ref=e517]:
            - text: "Main article:"
            - 'link "Call of Duty: WWII" [ref=e518] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_WWII
          - paragraph [ref=e519]:
            - text: "Call of Duty: WWII is the fourteenth game in the series and was developed by"
            - link "Sledgehammer Games" [ref=e520] [cursor=pointer]:
              - /url: /wiki/Sledgehammer_Games
            - text: .
            - superscript [ref=e521]:
              - link "[8]" [ref=e522] [cursor=pointer]:
                - /url: "#cite_note-12"
            - text: It was released worldwide on November 3, 2017, for Windows,
            - link "PlayStation 4" [ref=e523] [cursor=pointer]:
              - /url: /wiki/PlayStation_4
            - text: and
            - link "Xbox One" [ref=e524] [cursor=pointer]:
              - /url: /wiki/Xbox_One
            - text: .
            - superscript [ref=e525]:
              - link "[9]" [ref=e526] [cursor=pointer]:
                - /url: "#cite_note-13"
            - text: The game is set in the
            - link "European theatre" [ref=e527] [cursor=pointer]:
              - /url: /wiki/European_theatre_of_World_War_II
            - text: ", and is centered around a squad in the"
            - link "1st Infantry Division" [ref=e528] [cursor=pointer]:
              - /url: /wiki/1st_Infantry_Division_(United_States)
            - text: ", following their battles on the Western Front, and set mainly in the historical events of"
            - link "Operation Overlord" [ref=e529] [cursor=pointer]:
              - /url: /wiki/Operation_Overlord
            - text: .
          - 'heading "Call of Duty: Vanguard" [level=4] [ref=e531]'
          - note [ref=e532]:
            - text: "Main article:"
            - 'link "Call of Duty: Vanguard" [ref=e533] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Vanguard
          - paragraph [ref=e534]:
            - text: "Call of Duty: Vanguard is the eighteenth game in the series and is developed by"
            - link "Sledgehammer Games" [ref=e535] [cursor=pointer]:
              - /url: /wiki/Sledgehammer_Games
            - text: ", with"
            - link "Treyarch" [ref=e536] [cursor=pointer]:
              - /url: /wiki/Treyarch
            - text: developing the game's Zombies mode. It was released on November 5, 2021, for PC,
            - link "PlayStation 4" [ref=e537] [cursor=pointer]:
              - /url: /wiki/PlayStation_4
            - text: ","
            - link "PlayStation 5" [ref=e538] [cursor=pointer]:
              - /url: /wiki/PlayStation_5
            - text: ", Xbox One and Xbox Series X/S. The story depicts the birth of special forces to face an emerging threat at the end of the war during various"
            - link "theaters of World War II" [ref=e539] [cursor=pointer]:
              - /url: /wiki/List_of_theaters_and_campaigns_of_World_War_II
            - text: .
          - heading "Modern Warfare series" [level=3] [ref=e541]
          - heading "Original Trilogy" [level=4] [ref=e543]
          - 'heading "Call of Duty 4: Modern Warfare" [level=5] [ref=e545]'
          - note [ref=e546]:
            - text: "Main article:"
            - 'link "Call of Duty 4: Modern Warfare" [ref=e547] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty_4:_Modern_Warfare
          - paragraph [ref=e548]:
            - text: "Call of Duty 4: Modern Warfare is the fourth installment of the main series and was the first game in the Modern Warfare timeline. Developed by Infinity Ward, it is the first game in the series not to be set during World War II. The game was released for Windows, Nintendo DS, PlayStation 3, and Xbox 360 on November 7, 2007. Download and retail versions for Mac OS X were released by"
            - link "Aspyr" [ref=e549] [cursor=pointer]:
              - /url: /wiki/Aspyr_Media
            - text: "in September 2008. As of May 2009, Call of Duty 4: Modern Warfare has sold over 13 million copies."
            - superscript [ref=e550]:
              - link "[10]" [ref=e551] [cursor=pointer]:
                - /url: "#cite_note-14"
          - 'heading "Call of Duty: Modern Warfare Remastered" [level=6] [ref=e553]'
          - note [ref=e554]:
            - text: "Main article:"
            - 'link "Call of Duty: Modern Warfare Remastered" [ref=e555] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_Remastered
          - paragraph [ref=e556]:
            - text: "Call of Duty: Modern Warfare Remastered is a remastered version of"
            - 'link "Call of Duty 4: Modern Warfare" [ref=e558] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty_4:_Modern_Warfare
            - text: that was released alongside the Legacy Edition, Legacy Pro Edition and Digital Deluxe Edition of
            - 'link "Call of Duty: Infinite Warfare" [ref=e560] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Infinite_Warfare
            - text: on November 4, 2016, for PlayStation 4, Xbox One, and PC.
            - superscript [ref=e561]:
              - link "[11]" [ref=e562] [cursor=pointer]:
                - /url: "#cite_note-15"
            - text: It was later released standalone on June 27, 2017, for PS4, and July 27, 2017, for Xbox One and PC.
            - superscript [ref=e563]:
              - link "[12]" [ref=e564] [cursor=pointer]:
                - /url: "#cite_note-16"
            - text: The game was developed by
            - link "Raven Software" [ref=e565] [cursor=pointer]:
              - /url: /wiki/Raven_Software
            - text: and executive produced by Infinity Ward.
            - superscript [ref=e566]:
              - link "[13]" [ref=e567] [cursor=pointer]:
                - /url: "#cite_note-17"
            - superscript [ref=e568]:
              - link "[14]" [ref=e569] [cursor=pointer]:
                - /url: "#cite_note-18"
          - 'heading "Call of Duty: Modern Warfare 2" [level=5] [ref=e571]'
          - note [ref=e572]:
            - text: "Main article:"
            - 'link "Call of Duty: Modern Warfare 2" [ref=e573] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_2
          - paragraph [ref=e574]:
            - text: "Call of Duty: Modern Warfare 2 is the sixth installment of the main series, and the second game in the Modern Warfare timeline. It was developed by Infinity Ward and published by Activision."
            - superscript [ref=e575]:
              - link "[15]" [ref=e576] [cursor=pointer]:
                - /url: "#cite_note-GDC_Trailer,_Title_Cut-19"
            - superscript [ref=e577]:
              - link "[16]" [ref=e578] [cursor=pointer]:
                - /url: "#cite_note-20"
            - link "Activision Blizzard" [ref=e579] [cursor=pointer]:
              - /url: /wiki/Activision_Blizzard
            - text: announced Modern Warfare 2 on February 11, 2009.
            - superscript [ref=e580]:
              - link "[17]" [ref=e581] [cursor=pointer]:
                - /url: "#cite_note-Reannounced-21"
            - superscript [ref=e582]:
              - link "[18]" [ref=e583] [cursor=pointer]:
                - /url: "#cite_note-ModWar2-22"
            - text: The game was released worldwide on November 10, 2009, for the Xbox 360, PlayStation 3 and Windows.
            - superscript [ref=e584]:
              - link "[15]" [ref=e585] [cursor=pointer]:
                - /url: "#cite_note-GDC_Trailer,_Title_Cut-19"
            - text: A Nintendo DS iteration of the game, titled
            - 'link "Call of Duty: Modern Warfare: Mobilized" [ref=e587] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare:_Mobilized
            - text: ", was released alongside the game and the Wii port of Call of Duty: Modern Warfare."
            - superscript [ref=e588]:
              - link "[19]" [ref=e589] [cursor=pointer]:
                - /url: "#cite_note-23"
            - superscript [ref=e590]:
              - link "[20]" [ref=e591] [cursor=pointer]:
                - /url: "#cite_note-24"
            - text: Modern Warfare 2 is the direct sequel to Call of Duty 4 and continues the same storyline, taking place five years after the first game and featuring several returning characters including
            - link "Captain Price" [ref=e592] [cursor=pointer]:
              - /url: /wiki/Captain_Price
            - text: and
            - link "\"Soap\" MacTavish" [ref=e593] [cursor=pointer]:
              - /url: /wiki/Soap_MacTavish
            - text: .
            - superscript [ref=e594]:
              - link "[21]" [ref=e595] [cursor=pointer]:
                - /url: "#cite_note-25"
          - 'heading "Call of Duty: Modern Warfare 2 Campaign Remastered" [level=6] [ref=e597]'
          - note [ref=e598]:
            - text: "Main article:"
            - 'link "Call of Duty: Modern Warfare 2 § Remastered version" [ref=e599] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_2#Remastered_version
          - paragraph [ref=e600]: "A visually updated version of the original, it was released for PlayStation 4 on March 31, 2020, and for Xbox One and Windows on April 30, 2020. It only includes the campaign mode with no multiplayer and Spec Ops components. When purchased, players can unlock various cosmetic items in 2019's Call of Duty: Modern Warfare and 2020's Call of Duty: Warzone."
          - 'heading "Call of Duty: Modern Warfare 3" [level=5] [ref=e602]'
          - note [ref=e603]:
            - text: "Main article:"
            - 'link "Call of Duty: Modern Warfare 3" [ref=e604] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_3
          - paragraph [ref=e605]:
            - text: "Call of Duty: Modern Warfare 3 is the eighth installment of the main series and the third installment of the Modern Warfare arc. Due to a legal dispute between the game's publisher Activision and the former co-executives of Infinity Ward – which caused several lay-offs and departures within the company"
            - superscript [ref=e606]:
              - link "[22]" [ref=e607] [cursor=pointer]:
                - /url: "#cite_note-26"
            - text: – Sledgehammer Games assisted in the development of the game, while Raven Software was brought in to make cosmetic changes to the menus of the game.
            - superscript [ref=e608]:
              - link "[23]" [ref=e609] [cursor=pointer]:
                - /url: "#cite_note-latimes-27"
            - text: "The game was said to have been in development since only two weeks after the release of Call of Duty: Modern Warfare 2."
            - superscript [ref=e610]:
              - link "[23]" [ref=e611] [cursor=pointer]:
                - /url: "#cite_note-latimes-27"
            - text: Sledgehammer was aiming for a "bug free" first outing in the Call of Duty franchise, and had also set a goal for
            - link "Metacritic" [ref=e612] [cursor=pointer]:
              - /url: /wiki/Metacritic
            - text: review scores above 95 percent.
            - superscript [ref=e613]:
              - link "[24]" [ref=e614] [cursor=pointer]:
                - /url: "#cite_note-28"
          - paragraph [ref=e615]:
            - text: The game continues the story from the point at which it ended in the
            - 'link "Call of Duty: Modern Warfare 2" [ref=e617] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_2
            - text: and continues the fictional battle story between the United States and
            - link "Russia" [ref=e618] [cursor=pointer]:
              - /url: /wiki/Russia
            - text: ", which evolves into the"
            - link "Third World War" [ref=e619] [cursor=pointer]:
              - /url: /wiki/Third_World_War
            - text: between
            - link "NATO" [ref=e620] [cursor=pointer]:
              - /url: /wiki/NATO
            - text: allied nations and ultra-nationalist Russia.
          - heading "Reboot" [level=4] [ref=e622]
          - 'heading "Call of Duty: Modern Warfare" [level=5] [ref=e624]'
          - note [ref=e625]:
            - text: "Main article:"
            - 'link "Call of Duty: Modern Warfare (2019 video game)" [ref=e626] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_(2019_video_game)
          - paragraph [ref=e627]:
            - text: "Call of Duty: Modern Warfare is the sixteenth entry in the Call of Duty series and is also a"
            - link "reboot" [ref=e628] [cursor=pointer]:
              - /url: /wiki/Reboot_(fiction)
            - text: of the Modern Warfare sub-series. The story has been described to be darker and more realistic than previous Call of Duty games. It is set in the Black Ops timeline,
            - superscript [ref=e629]:
              - link "[25]" [ref=e630] [cursor=pointer]:
                - /url: "#cite_note-29"
            - text: separate from the other Modern Warfare games (however, characters such as Captain Price and other fan favorites from the series make a return). The game was officially revealed on May 30, 2019, and released on October 25, 2019.
          - paragraph [ref=e631]:
            - text: The second main
            - link "battle royale" [ref=e632] [cursor=pointer]:
              - /url: /wiki/Battle_royale_game
            - text: installment in the Call of Duty franchise, titled
            - generic [ref=e633]:
              - 'link "Call of Duty: Warzone" [ref=e634] [cursor=pointer]':
                - /url: /wiki/Call_of_Duty:_Warzone
              - text: ","
            - text: "was released in March 2020, as a part of the Call of Duty: Modern Warfare video game but does not require purchase of it."
            - superscript [ref=e635]:
              - link "[26]" [ref=e636] [cursor=pointer]:
                - /url: "#cite_note-30"
            - text: The title exceeded 50 million players in the first month after release.
            - superscript [ref=e637]:
              - link "[27]" [ref=e638] [cursor=pointer]:
                - /url: "#cite_note-31"
          - 'heading "Call of Duty: Modern Warfare II" [level=5] [ref=e640]'
          - note [ref=e641]:
            - text: "Main article:"
            - 'link "Call of Duty: Modern Warfare II (2022 video game)" [ref=e642] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_II_(2022_video_game)
          - paragraph [ref=e643]:
            - text: Activision confirmed a sequel to the 2019 Modern Warfare game on February 11, 2022, to be developed by Infinity Ward.
            - superscript [ref=e644]:
              - link "[28]" [ref=e645] [cursor=pointer]:
                - /url: "#cite_note-COD2022-32"
            - text: The game's logo and title was revealed on April 28, 2022.
            - superscript [ref=e646]:
              - link "[29]" [ref=e647] [cursor=pointer]:
                - /url: "#cite_note-Scullion_2022-33"
            - text: During Activision's 'Call of Duty NEXT' broadcast on September 15, 2022, the game's multiplayer was fully revealed, along with details on the
            - link "next version of Warzone" [ref=e648] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty:_Warzone_2.0
            - text: and a mobile version of Warzone, both set to launch slightly after Modern Warfare II's launch.
            - superscript [ref=e649]:
              - link "[30]" [ref=e650] [cursor=pointer]:
                - /url: "#cite_note-34"
            - superscript [ref=e651]:
              - link "[31]" [ref=e652] [cursor=pointer]:
                - /url: "#cite_note-35"
          - paragraph [ref=e653]:
            - text: "Call of Duty: Modern Warfare II was released on October 28, with Campaign Early Access for pre-orders on October 20."
            - superscript [ref=e654]:
              - link "[32]" [ref=e655] [cursor=pointer]:
                - /url: "#cite_note-36"
          - 'heading "Call of Duty: Modern Warfare III" [level=5] [ref=e657]'
          - note [ref=e658]:
            - text: "Main article:"
            - 'link "Call of Duty: Modern Warfare III (2023 video game)" [ref=e659] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Modern_Warfare_III_(2023_video_game)
          - heading "Black Ops series" [level=3] [ref=e661]
          - 'heading "Call of Duty: World at War" [level=4] [ref=e663]'
          - note [ref=e664]:
            - text: "Main article:"
            - 'link "Call of Duty: World at War" [ref=e665] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_World_at_War
          - paragraph [ref=e666]:
            - text: "Call of Duty: World at War, developed by Treyarch, is the fifth installment of the main series. Released after Modern Warfare, it returns to the World War II setting of earlier titles,"
            - superscript [ref=e667]:
              - link "[33]" [ref=e668] [cursor=pointer]:
                - /url: "#cite_note-37"
            - text: featuring the
            - link "Pacific theater" [ref=e669] [cursor=pointer]:
              - /url: /wiki/Pacific_Ocean_theater_of_World_War_II
            - text: and
            - link "Eastern front" [ref=e670] [cursor=pointer]:
              - /url: /wiki/Eastern_Front_(World_War_II)
            - text: . The game uses the same proprietary game engine as Call of Duty 4 and was released for the PC, PlayStation 3, Wii, Xbox 360 consoles and the
            - link "Nintendo DS" [ref=e671] [cursor=pointer]:
              - /url: /wiki/Nintendo_DS
            - text: "handheld in North America on November 11, 2008, and November 14, 2008, in Europe. As of June 2009, Call of Duty: World at War has sold over 11 million copies."
            - superscript [ref=e672]:
              - link "[34]" [ref=e673] [cursor=pointer]:
                - /url: "#cite_note-38"
            - text: It acts as a prologue for Treyarch's next game, Black Ops, which is in the same universe, sharing characters and story references.
            - superscript [ref=e674]:
              - link "[35]" [ref=e675] [cursor=pointer]:
                - /url: "#cite_note-39"
            - superscript [ref=e676]:
              - link "[36]" [ref=e677] [cursor=pointer]:
                - /url: "#cite_note-40"
            - text: It was also the first title to include the
            - link "cooperative Zombies mode" [ref=e678] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty_Zombies
            - text: which would return in later editions of the series.
            - superscript [ref=e679]:
              - link "[37]" [ref=e680] [cursor=pointer]:
                - /url: "#cite_note-41"
          - 'heading "Call of Duty: Black Ops" [level=4] [ref=e682]'
          - note [ref=e683]:
            - text: "Main article:"
            - 'link "Call of Duty: Black Ops" [ref=e684] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops
          - paragraph [ref=e685]:
            - text: "Call of Duty: Black Ops is the seventh installment in the series,"
            - superscript [ref=e686]:
              - link "[38]" [ref=e687] [cursor=pointer]:
                - /url: "#cite_note-SiteRevealed-42"
            - superscript [ref=e688]:
              - link "[39]" [ref=e689] [cursor=pointer]:
                - /url: "#cite_note-43"
            - superscript [ref=e690]:
              - link "[40]" [ref=e691] [cursor=pointer]:
                - /url: "#cite_note-Press-44"
            - text: the third developed by Treyarch and was published by Activision for release on November 9, 2010. It is the first game in the series to take place during the
            - link "Cold War" [ref=e692] [cursor=pointer]:
              - /url: /wiki/Cold_War
            - text: and also takes place partially in the
            - link "Vietnam War" [ref=e693] [cursor=pointer]:
              - /url: /wiki/Vietnam_War
            - text: . It was initially available for Windows, Xbox 360, and PlayStation 3 and was later released for the
            - link "Wii" [ref=e694] [cursor=pointer]:
              - /url: /wiki/Wii
            - text: as well as the Nintendo DS.
            - superscript [ref=e695]:
              - link "[41]" [ref=e696] [cursor=pointer]:
                - /url: "#cite_note-Wii_confirmed-45"
          - 'heading "Call of Duty: Black Ops II" [level=4] [ref=e698]'
          - note [ref=e699]:
            - text: "Main article:"
            - 'link "Call of Duty: Black Ops II" [ref=e700] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops_II
          - paragraph [ref=e701]:
            - text: "Call of Duty: Black Ops II is the ninth main installment in the series, developed by Treyarch and published by Activision. The game was revealed on May 1, 2012."
            - superscript [ref=e702]:
              - link "[42]" [ref=e703] [cursor=pointer]:
                - /url: "#cite_note-Kelly-46"
            - superscript [ref=e704]:
              - link "[43]" [ref=e705] [cursor=pointer]:
                - /url: "#cite_note-Ivan-47"
            - text: It was the first game in the series to feature future warfare technology, and the campaign features multiple branching storylines driven by player choice and multiple endings. It was later released on November 13, 2012.
          - 'heading "Call of Duty: Black Ops III" [level=4] [ref=e707]'
          - note [ref=e708]:
            - text: "Main article:"
            - 'link "Call of Duty: Black Ops III" [ref=e709] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops_III
          - paragraph [ref=e710]:
            - text: "Call of Duty: Black Ops III is the twelfth main installment in the series, developed by Treyarch and published by Activision. The game was released on November 6, 2015."
            - superscript [ref=e711]:
              - link "[44]" [ref=e712] [cursor=pointer]:
                - /url: "#cite_note-48"
          - 'heading "Call of Duty: Black Ops 4" [level=4] [ref=e714]'
          - note [ref=e715]:
            - text: "Main article:"
            - 'link "Call of Duty: Black Ops 4" [ref=e716] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops_4
          - paragraph [ref=e717]:
            - text: "Call of Duty: Black Ops 4 is the fifteenth main installment in the series. It was developed by Treyarch and published by Activision. The game was released on October 12, 2018."
            - superscript [ref=e718]:
              - link "[45]" [ref=e719] [cursor=pointer]:
                - /url: "#cite_note-49"
            - text: It was the first featured Call of Duty game to forgo a
            - link "single-player" [ref=e720] [cursor=pointer]:
              - /url: /wiki/Single-player_video_game
            - text: campaign game mode, focusing only on the multiplayer aspect of the game. The game also introduced an entirely new
            - link "battle royale" [ref=e721] [cursor=pointer]:
              - /url: /wiki/Battle_royale_game
            - text: game mode, called Blackout, in addition to multiplayer and
            - link "Zombies co-op mode" [ref=e722] [cursor=pointer]:
              - /url: /wiki/Call_of_Duty_Zombies
            - text: .
            - superscript [ref=e723]:
              - link "[46]" [ref=e724] [cursor=pointer]:
                - /url: "#cite_note-50"
          - 'heading "Call of Duty: Black Ops Cold War" [level=4] [ref=e726]'
          - note [ref=e727]:
            - text: "Main article:"
            - 'link "Call of Duty: Black Ops Cold War" [ref=e728] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops_Cold_War
          - paragraph [ref=e729]:
            - text: "Call of Duty: Black Ops Cold War is the seventeenth main installment in the series. It was developed by Treyarch and"
            - link "Raven Software" [ref=e730] [cursor=pointer]:
              - /url: /wiki/Raven_Software
            - text: ", and published by Activision. The game was released on November 13, 2020. Set during the 1980s and focusing on Soviet and American espionage during the Cold War, the game is chronologically set between Call of Duty: Black Ops and Black Ops II."
            - superscript [ref=e731]:
              - link "[47]" [ref=e732] [cursor=pointer]:
                - /url: "#cite_note-51"
          - 'heading "Call of Duty: Black Ops 6" [level=4] [ref=e734]'
          - note [ref=e735]:
            - text: "Main article:"
            - 'link "Call of Duty: Black Ops 6" [ref=e736] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops_6
          - paragraph [ref=e737]:
            - text: "Call of Duty: Black Ops 6 is the 21st major work in the series. It was developed by"
            - link "Treyarch" [ref=e738] [cursor=pointer]:
              - /url: /wiki/Treyarch
            - text: and
            - link "Raven Software" [ref=e739] [cursor=pointer]:
              - /url: /wiki/Raven_Software
            - text: and released by Activision on October 25, 2024.
          - 'heading "Call of Duty: Black Ops 7" [level=4] [ref=e741]'
          - note [ref=e742]:
            - text: "Main article:"
            - 'link "Call of Duty: Black Ops 7" [ref=e743] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Black_Ops_7
          - paragraph [ref=e744]:
            - text: "Call of Duty: Black Ops 7 is the 22nd major work in the series. It was developed by"
            - link "Treyarch" [ref=e745] [cursor=pointer]:
              - /url: /wiki/Treyarch
            - text: and
            - link "Raven Software" [ref=e746] [cursor=pointer]:
              - /url: /wiki/Raven_Software
            - text: and published by Activision. It was first revealed through a teaser trailer on June 8, 2025 and was released on November 14, 2025.
            - superscript [ref=e747]:
              - link "[48]" [ref=e748] [cursor=pointer]:
                - /url: "#cite_note-52"
          - heading "Standalone games" [level=3] [ref=e750]
          - 'heading "Call of Duty: Ghosts" [level=4] [ref=e752]'
          - note [ref=e753]:
            - text: "Main article:"
            - 'link "Call of Duty: Ghosts" [ref=e754] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Ghosts
          - paragraph [ref=e755]:
            - text: "Call of Duty: Ghosts is the tenth main installment in the series and was developed by Infinity Ward. The game was released on November 5, 2013."
            - superscript [ref=e756]:
              - link "[49]" [ref=e757] [cursor=pointer]:
                - /url: "#cite_note-53"
            - superscript [ref=e758]:
              - link "[50]" [ref=e759] [cursor=pointer]:
                - /url: "#cite_note-54"
            - text: It was the first game to be developed for
            - link "eighth-gen consoles" [ref=e760] [cursor=pointer]:
              - /url: /wiki/Eighth_generation_of_video_game_consoles
            - text: such as PlayStation 4 and Xbox One.
            - superscript [ref=e761]:
              - link "[51]" [ref=e762] [cursor=pointer]:
                - /url: "#cite_note-55"
          - 'heading "Call of Duty: Advanced Warfare" [level=4] [ref=e764]'
          - note [ref=e765]:
            - text: "Main article:"
            - 'link "Call of Duty: Advanced Warfare" [ref=e766] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Advanced_Warfare
          - paragraph [ref=e767]:
            - text: "Call of Duty: Advanced Warfare is the eleventh main installment in the series, developed by Sledgehammer Games with assistance from Raven Software and"
            - link "High Moon Studios" [ref=e768] [cursor=pointer]:
              - /url: /wiki/High_Moon_Studios
            - text: . It was released on November 4, 2014.
            - superscript [ref=e769]:
              - link "[52]" [ref=e770] [cursor=pointer]:
                - /url: "#cite_note-56"
            - text: The game was the first game in the series to feature advanced movements, such as
            - link "double jump" [ref=e771] [cursor=pointer]:
              - /url: /wiki/Double_jump_(game_mechanic)
            - text: and boost slide.
            - superscript [ref=e772]:
              - link "[53]" [ref=e773] [cursor=pointer]:
                - /url: "#cite_note-57"
          - 'heading "Call of Duty: Infinite Warfare" [level=4] [ref=e775]'
          - note [ref=e776]:
            - text: "Main article:"
            - 'link "Call of Duty: Infinite Warfare" [ref=e777] [cursor=pointer]':
              - /url: /wiki/Call_of_Duty:_Infinite_Warfare
          - paragraph [ref=e778]:
            - text: "Call of Duty: Infinite Warfare is the thirteenth main installment in the series, developed by Infinity Ward, and was published by Activision. The game was released on November 4, 2016."
            - superscript [ref=e779]:
              - link "[54]" [ref=e780] [cursor=pointer]:
                - /url: "#cite_note-58"
          - heading "Primary developer rotation" [level=2] [ref=e782]
          - paragraph [ref=e783]:
            - text: "In 2006, Treyarch released Call of Duty 3, their first Call of Duty game of the main series. Treyarch and Infinity Ward signed a contract stating that the producer of each upcoming title in the series would alternate between the two companies. In 2010, Sledgehammer Games announced they were working on a main series title for the franchise. This game was postponed to help Infinity Ward produce Modern Warfare 3. In 2014, it was confirmed that Sledgehammer Games would produce the 2014 title, Call of Duty: Advanced Warfare, and the studios would begin a three-year rotation."
            - superscript [ref=e784]:
              - link "[55]" [ref=e785] [cursor=pointer]:
                - /url: "#cite_note-59"
            - superscript [ref=e786]:
              - link "[56]" [ref=e787] [cursor=pointer]:
                - /url: "#cite_note-60"
            - text: "After Sledgehammer developed Call of Duty: WWII (2017), they began developing a new Call of Duty entry alongside"
            - link "Raven Software" [ref=e788] [cursor=pointer]:
              - /url: /wiki/Raven_Software
            - text: due for release in 2020. However, there were conflicts of interest between the two, which resulted in Treyarch taking over control of the project to speed up the development process.
            - superscript [ref=e789]:
              - link "[57]" [ref=e790] [cursor=pointer]:
                - /url: "#cite_note-61"
          - heading "Free-to-play games" [level=2] [ref=e792]
          - table "Free-to-play titles in the Call of Duty series" [ref=e793]:
