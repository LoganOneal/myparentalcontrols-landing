              - row "5 Fortune's Favor May 12, 2020 – August 18, 2020[60] A new Legend known as Loba was introduced, a thief with the ability to steal loot from nearby areas and teleport. Loba was out for revenge against Revenant, a simulacrum hitman who had killed her parents. Ranked Series 4 was largely identical to Series 3 and reconnect was added, allowing players to rejoin a session if they disconnected. A new \"quest\" system was also introduced, which allowed players to fight in PvE missions either solo or with a squad to earn unique rewards. A new battle pass was also introduced.[61] Respawn Entertainment announced they would be expanding their Apex servers to the Middle East.[62] Skull Town and Thunderdome were also destroyed." [ref=e982]:
