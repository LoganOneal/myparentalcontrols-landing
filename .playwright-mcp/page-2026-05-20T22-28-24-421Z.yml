              - row "11 Escape November 2, 2021 – February 8, 2022 A new simulacrum Legend named Ash was introduced, a returning character who was previously one of the main antagonists from Titanfall 2. A new weapon, the CAR SMG was introduced, which was a gun originally from Titanfall 2. A new tropical Battle Royale map called Storm Point was introduced. A new battle pass was introduced, along with a new Ranked season with tweaks to how the Ranked system worked.[73][74]" [ref=e1045]:
