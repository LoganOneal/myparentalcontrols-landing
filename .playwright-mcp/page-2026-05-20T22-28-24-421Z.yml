              - row "2 Battle Charge July 2, 2019 – October 1, 2019[55] With season 2, the developers introduced another playable character called Wattson and also re-designed the layout of the game's island. Following an explosion (shown in the season's trailer), roaming alien wildlife, known as leviathans and flyers, have been attracted to the island and destroyed large areas, rendering parts of the map unrecognizable from the previous season.[53] Season 2 also released a new weapon and introduced a new ranked mode of play, allowing players of a similar skill to play against each other, and adjusting a player's ranking based on their game performance.[56]" [ref=e950]:
