              - row "4 Assimilation February 4, 2020 – May 12, 2020[58] A new Legend named Revenant was introduced,[c] a Simulacrum with the memories of his human self. A new sniper weapon known as the Sentinel was added. World's Edge was devastated by a Harvester that appeared in the middle of the map, creating lava faults and changing the environment. Major changes to ranked were made, as a new tier known as \"Master\" tier was introduced, while the Apex Predator tier was designated for the top 500 players on each platform, meaning players could be pushed out of it.[59]" [ref=e971]:
