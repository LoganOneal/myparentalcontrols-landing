              - row "1 Wild Frontier March 19, 2019 – June 18, 2019 The first season of Apex Legends introduced the playable character Octane and implemented several bug fixes and quality‑of‑life improvements, including adjustments to so‑called hitboxes—each Legend's predefined damageable zone based on their size and shape—and enhancements to the characters' unique abilities. It also launched the game's inaugural battle pass and added numerous new cosmetic items.[54]" [ref=e942]:
