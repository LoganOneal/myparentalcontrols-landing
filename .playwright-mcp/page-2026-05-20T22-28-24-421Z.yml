            - rowgroup
          - heading "Player-count and revenue" [level=3] [ref=e1666]
          - paragraph [ref=e1667]:
            - text: Eight hours after its launch, Apex Legends surpassed one million unique players,
            - superscript [ref=e1668]:
              - link "[156]" [ref=e1669] [cursor=pointer]:
                - /url: "#cite_note-159"
            - text: and reached 2.5 million unique players within 24 hours.
            - superscript [ref=e1670]:
              - link "[157]" [ref=e1671] [cursor=pointer]:
                - /url: "#cite_note-160"
            - text: In one week it achieved a total of 25 million players, with over 2 million peak concurrent,
            - superscript [ref=e1672]:
              - link "[158]" [ref=e1673] [cursor=pointer]:
                - /url: "#cite_note-161"
            - text: and by the end of its first month it reached 50 million players in total.
            - superscript [ref=e1674]:
              - link "[159]" [ref=e1675] [cursor=pointer]:
                - /url: "#cite_note-162"
          - paragraph [ref=e1676]:
            - text: Within the first month of its release, Apex Legends made $92 million in revenue across all platforms, the highest amount earned by any free-to-play game during its month of launch.
            - superscript [ref=e1677]:
              - link "[160]" [ref=e1678] [cursor=pointer]:
                - /url: "#cite_note-163"
          - paragraph [ref=e1679]:
            - text: As news and popularity of Apex Legends spread, analysts saw the game as something to challenge the dominance of
            - link "Fortnite Battle Royale" [ref=e1681] [cursor=pointer]:
              - /url: /wiki/Fortnite_Battle_Royale
            - text: ", and by February 8, 2019—four days after the game's release—EA had seen its largest growth in stock value since 2014 on the basis of Apex Legends' sudden success."
            - superscript [ref=e1682]:
              - link "[161]" [ref=e1683] [cursor=pointer]:
                - /url: "#cite_note-164"
            - superscript [ref=e1684]:
              - link "[162]" [ref=e1685] [cursor=pointer]:
                - /url: "#cite_note-165"
            - text: Throughout April, the game was estimated to have earned $24 million in revenue, representing 74 percent less than the amount it earned during its first month, as the game failed to sustain the same level of interest generated by its launch.
            - superscript [ref=e1686]:
              - link "[163]" [ref=e1687] [cursor=pointer]:
                - /url: "#cite_note-166"
          - paragraph [ref=e1688]:
            - text: In July 2019,
            - link "EA" [ref=e1689] [cursor=pointer]:
              - /url: /wiki/EA
            - text: told investors that the game had 8 to 10 million players a week
            - superscript [ref=e1690]:
              - link "[164]" [ref=e1691] [cursor=pointer]:
                - /url: "#cite_note-167"
            - text: and also credited Apex Legends with the company's recent upturn in live services earnings as their Q1 2020 financial results exceeded expectations.
            - superscript [ref=e1692]:
              - link "[165]" [ref=e1693] [cursor=pointer]:
                - /url: "#cite_note-168"
            - text: With the release of season 3 in October, Apex Legends reached a playerbase of 70 million people internationally and is believed to have earned $45 million in that month alone.
            - superscript [ref=e1694]:
              - link "[166]" [ref=e1695] [cursor=pointer]:
                - /url: "#cite_note-169"
          - paragraph [ref=e1696]:
            - text: In February 2021, EA's CFO, Blake Jorgensen, confirmed that Apex Legends has surpassed $1 billion in revenue.
            - superscript [ref=e1697]:
              - link "[167]" [ref=e1698] [cursor=pointer]:
                - /url: "#cite_note-170"
            - text: In April, right before the release of the game's 9th season, Respawn announced that Apex Legends had reached a playerbase of over 100 million people and was expected to pull in $500 million that year.
            - superscript [ref=e1699]:
              - link "[168]" [ref=e1700] [cursor=pointer]:
                - /url: "#cite_note-171"
          - paragraph [ref=e1701]:
            - text: In May 2022, it was stated in EA's earnings call that Apex Legends had surpassed $2 billion in revenue.
            - superscript [ref=e1702]:
              - link "[169]" [ref=e1703] [cursor=pointer]:
                - /url: "#cite_note-172"
            - superscript [ref=e1704]:
              - link "[170]" [ref=e1705] [cursor=pointer]:
                - /url: "#cite_note-173"
            - text: On August 11, the game broke its all-time record for number of concurrent players on Steam with 510,286, according to stat-tracking database Steamcharts.
            - superscript [ref=e1706]:
              - link "[171]" [ref=e1707] [cursor=pointer]:
                - /url: "#cite_note-174"
          - paragraph [ref=e1708]:
            - text: From February to December 2024, the game lost 70% of its Steam playerbase, potentially indicating waning interest.
            - superscript [ref=e1709]:
              - link "[172]" [ref=e1710] [cursor=pointer]:
                - /url: "#cite_note-175"
            - text: On an earnings call, EA noted that revenue had declined during 2024, and expectations needed to be adjusted downwards as a result.
            - superscript [ref=e1711]:
              - link "[173]" [ref=e1712] [cursor=pointer]:
                - /url: "#cite_note-176"
          - heading "Controversies" [level=3] [ref=e1714]
          - paragraph [ref=e1715]:
            - text: With the introduction of the 'Iron Crown' limited-time event in August 2019, the developers released several purchasable in-game cosmetic items. The vast majority of these items could only be acquired through purchasing
            - link "loot boxes" [ref=e1716] [cursor=pointer]:
              - /url: /wiki/Loot_box
            - text: ", and the most sought-after item (a cosmetic axe for one of the player characters) could only be purchased at an additional cost after first having obtained 24 other purchasable items. Players and media outlets decried that as a result of this transaction model, the cost of the most sought-after item was approximately $170"
            - superscript [ref=e1717]:
              - link "[174]" [ref=e1718] [cursor=pointer]:
                - /url: "#cite_note-PC_gamer_mtx2-177"
            - text: (or £130
            - superscript [ref=e1719]:
              - link "[175]" [ref=e1720] [cursor=pointer]:
                - /url: "#cite_note-Eurogamer_mtx2-178"
            - text: )—a price point which Forbes called "hilariously out of touch" and compared negatively to most other major microtransaction models in the industry.
            - superscript [ref=e1721]:
              - link "[176]" [ref=e1722] [cursor=pointer]:
                - /url: "#cite_note-Forbes_mtx2-179"
          - paragraph [ref=e1723]:
            - text: This resulted in a negative backlash from the player community and industry journalists, particularly on
            - link "Reddit" [ref=e1724] [cursor=pointer]:
              - /url: /wiki/Reddit
            - text: ", where members of the Apex Legends community forum traded insults with developers of the game with the increasingly strong language being used by both parties."
            - superscript [ref=e1725]:
              - link "[177]" [ref=e1726] [cursor=pointer]:
                - /url: "#cite_note-Forbes_Reddit2-180"
          - paragraph [ref=e1727]:
            - text: As a result, Respawn Entertainment apologized for what they agreed was unfair monetization and promised to allow players the chance to purchase cosmetic items directly (rather than rely on loot boxes), albeit at an increased price.
            - superscript [ref=e1728]:
              - link "[178]" [ref=e1729] [cursor=pointer]:
                - /url: "#cite_note-CNN_mtx2-181"
            - text: Respawn Entertainment
            - link "CEO" [ref=e1730] [cursor=pointer]:
              - /url: /wiki/CEO
            - text: Vince Zampella later apologized for members of the development team "crossing a line with their comments", while also defending that they stood up for themselves against alleged death threats and insults aimed at their family members.
            - superscript [ref=e1731]:
              - link "[179]" [ref=e1732] [cursor=pointer]:
                - /url: "#cite_note-Polygon_reddit2-182"
          - note [ref=e1733]:
            - text: "See also:"
            - link "Titanfall (video game) § Cheating and current status" [ref=e1734] [cursor=pointer]:
              - /url: /wiki/Titanfall_(video_game)#Cheating_and_current_status
          - paragraph [ref=e1735]:
            - text: Around July 4, 2021, unknown agents appeared to have broken EA and Respawn's server security as to change in-game messages to point to a website that purportedly was trying to "Save Titanfall". The site and messages spoke of the weak security that both Titanfall and Titanfall 2 servers had, leading to the games becoming unplayable due to the number of other hackers using
            - link "denial of service" [ref=e1736] [cursor=pointer]:
              - /url: /wiki/Denial_of_service
            - text: attacks to bring down the servers.
            - superscript [ref=e1737]:
              - link "[180]" [ref=e1738] [cursor=pointer]:
                - /url: "#cite_note-183"
            - text: A community-led investigation determined that the owners of the website were directly involved in hacking the Apex servers and were also behind some of the denial attacks on the Titanfall servers as a type of
            - link "false flag" [ref=e1739] [cursor=pointer]:
              - /url: /wiki/False_flag
            - text: ", to get Respawn to bring back the cancelled Titanfall Online game."
            - superscript [ref=e1740]:
              - link "[181]" [ref=e1741] [cursor=pointer]:
                - /url: "#cite_note-184"
          - paragraph [ref=e1742]:
            - text: The 'Monsters Within' event released on October 12, 2021, as the 2021 Halloween Event. People were upset when it was announced because the event was not launching with the Shadow Royale gamemode, and it was instead only going to be available for the final week of the event. There was also controversy over the way that Respawn sold the event skins, as players could not buy them by themselves. People were also upset because the game was in a state of constant crashes and many game breaking bugs.
            - superscript [ref=e1743]:
              - link "[182]" [ref=e1744] [cursor=pointer]:
                - /url: "#cite_note-185"
            - superscript [ref=e1745]:
              - link "[183]" [ref=e1746] [cursor=pointer]:
                - /url: "#cite_note-186"
          - heading "Spinoff media" [level=2] [ref=e1748]
          - paragraph [ref=e1749]:
            - text: "In February 2023, it was announced that Apex Legends: The Board Game would begin a crowdfunding campaign on Kickstarter on May 17."
            - superscript [ref=e1750]:
              - link "[184]" [ref=e1751] [cursor=pointer]:
                - /url: "#cite_note-187"
            - text: The crowdfunding campaign launched as planned,
            - superscript [ref=e1752]:
              - link "[185]" [ref=e1753] [cursor=pointer]:
                - /url: "#cite_note-:12-188"
            - text: reaching its goal in just seven hours.
            - superscript [ref=e1754]:
              - link "[186]" [ref=e1755] [cursor=pointer]:
                - /url: "#cite_note-189"
            - text: The game is being developed by Glass Cannon Unplugged, and features team-based skirmish battles for up to four players.
            - superscript [ref=e1756]:
              - link "[185]" [ref=e1757] [cursor=pointer]:
                - /url: "#cite_note-:12-188"
          - heading "Notes" [level=2] [ref=e1759]
          - list [ref=e1761]:
