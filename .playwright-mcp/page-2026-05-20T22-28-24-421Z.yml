              - row "13 Saviors May 10, 2022 – August 9, 2022 A new legend named Newcastle was introduced, known to be Bangalore's missing brother Jackson. Storm Point was the map that received a map update, where a sea creature, killed by all the legends, was incorporated into the map alongside new IMC bunkers, which could provide high tier loot. Ranked also received a rework, where it focused more on team play; points were granted to team players even if they didn't get the assist. Players could also fall out of ranks (Masters could rank down to Diamond I as an example).[76]" [ref=e1061]:
