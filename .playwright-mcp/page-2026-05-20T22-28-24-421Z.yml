          - paragraph [ref=e1398]:
            - text: Apex Legends received "generally favorable" reviews for most platforms according to
            - link "review aggregator" [ref=e1399] [cursor=pointer]:
              - /url: /wiki/Review_aggregator
            - text: website
            - link "Metacritic" [ref=e1400] [cursor=pointer]:
              - /url: /wiki/Metacritic
            - text: ; the Nintendo Switch version received "mixed or average" reviews. Some publications, including
            - link "Destructoid" [ref=e1402] [cursor=pointer]:
              - /url: /wiki/Destructoid
            - text: ","
            - link "Game Informer" [ref=e1404] [cursor=pointer]:
              - /url: /wiki/Game_Informer
            - text: ","
            - link "GamesRadar+" [ref=e1406] [cursor=pointer]:
              - /url: /wiki/GamesRadar%2B
            - text: ", and"
            - link "PC Gamer" [ref=e1408] [cursor=pointer]:
              - /url: /wiki/PC_Gamer
            - text: ", called it one of the best takes on the battle royale genre thus far, and a worthy challenger to"
            - link "Fortnite Battle Royale" [ref=e1410] [cursor=pointer]:
              - /url: /wiki/Fortnite_Battle_Royale
            - text: "'s dominance of the genre."
          - paragraph [ref=e1411]: Critics lauded the combat in Apex Legends. Destructoid referred to the gunplay as the best they had experienced in a battle royale thus far; however, they felt let down that some of the mechanics from the previous Titanfall games were not present. Javy Gwaltney of Game Informer, on the other hand, claimed that the omission of the Titans and other elements from previous Respawn games was not a problem and found the combat to be satisfying and the gunplay powerful. He added that the addition of heroes can make for more exciting combat than in other battle royale games.
          - paragraph [ref=e1412]:
            - text: Reviewers praised the
            - link "non-verbal communication" [ref=e1413] [cursor=pointer]:
              - /url: /wiki/Non-verbal_communication
            - text: system in the game (known as the "ping system") with most considering it to be highly innovative.
            - link "Polygon" [ref=e1414] [cursor=pointer]:
              - /url: /wiki/Polygon_(website)
            - text: "'s Khee Hoon Chan opined that it \"rendered voice chat with strangers largely unnecessary\", and was emblematic of Apex Legends' accessibility and astuteness."
            - superscript [ref=e1415]:
              - link "[1]" [ref=e1416] [cursor=pointer]:
                - /url: "#cite_note-Polygon_review2-3"
            - text: Destructoid likewise enjoyed the mechanic, predicting that it would become the new norm for the video games industry in battle royale games.
            - link "Rock Paper Shotgun" [ref=e1418] [cursor=pointer]:
              - /url: /wiki/Rock_Paper_Shotgun
            - text: called it the "gold standard for non-verbal communication in games" and noted that, while not an entirely new concept, Respawn Entertainment had refined the idea.
            - superscript [ref=e1419]:
              - link "[124]" [ref=e1420] [cursor=pointer]:
                - /url: "#cite_note-RPS_ping2-127"
          - paragraph [ref=e1421]:
            - text: While Electronic Arts had received a U.S. patent for the ping system in 2021,
            - superscript [ref=e1422]:
              - link "[125]" [ref=e1423] [cursor=pointer]:
                - /url: "#cite_note-128"
            - text: the company announced that the ping system patent and four others related to
            - link "game accessibility" [ref=e1424] [cursor=pointer]:
              - /url: /wiki/Game_accessibility
            - text: would be made available for free to game developers to use without fear of litigation starting in August 2021.
            - superscript [ref=e1425]:
              - link "[126]" [ref=e1426] [cursor=pointer]:
                - /url: "#cite_note-129"
            - link "IGN" [ref=e1428] [cursor=pointer]:
              - /url: /wiki/IGN
            - text: awarded the game score of 9 out of 10, summing up the review by saying "Apex Legends is squad-based battle royale done right, complete with cool heroes, a superb communication system, and polished mechanics"
            - superscript [ref=e1429]:
              - link "[127]" [ref=e1430] [cursor=pointer]:
                - /url: "#cite_note-130"
          - paragraph [ref=e1431]:
            - text: Apex Legends received critical praise for the perceived
            - link "diversity" [ref=e1432] [cursor=pointer]:
              - /url: /wiki/Multiculturalism
            - text: of its playable characters. Several characters are
            - link "LGBTQ" [ref=e1433] [cursor=pointer]:
              - /url: /wiki/LGBTQ
            - text: ", including one"
            - link "non-binary" [ref=e1434] [cursor=pointer]:
              - /url: /wiki/Non-binary_gender
            - text: character,
            - superscript [ref=e1435]:
              - link "[128]" [ref=e1436] [cursor=pointer]:
                - /url: "#cite_note-131"
            - text: though some reviewers felt that the nature of the game did not allow for a narrative which properly highlights this diversity.
            - superscript [ref=e1437]:
              - link "[1]" [ref=e1438] [cursor=pointer]:
                - /url: "#cite_note-Polygon_review2-3"
            - superscript [ref=e1439]:
              - link "[129]" [ref=e1440] [cursor=pointer]:
                - /url: "#cite_note-132"
            - superscript [ref=e1441]:
              - link "[130]" [ref=e1442] [cursor=pointer]:
                - /url: "#cite_note-133"
