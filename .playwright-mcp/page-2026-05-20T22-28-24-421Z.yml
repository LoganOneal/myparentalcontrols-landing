          - paragraph [ref=e899]:
            - text: Minor events occasionally introduced only purchasable cosmetics (e.g., "Summer of Plunder" and "Arena Flash Events" across Seasons 9–10) or limited-time modes without exclusive collectibles, such as the Battle Armor mode (April 28 to May 12, 2020), where players started matches with armor and a gun.
            - superscript [ref=e900]:
              - link "[45]" [ref=e901] [cursor=pointer]:
                - /url: "#cite_note-48"
          - heading "Arenas" [level=6] [ref=e903]
          - paragraph [ref=e904]:
            - text: Season 9 introduced a new mode named "Arenas". In this mode, players form into three-player squads and fight against another squad in a 3v3
            - link "team deathmatch" [ref=e905] [cursor=pointer]:
              - /url: /wiki/Team_deathmatch
            - text: over a series of rounds to determine the winner of the match. Teams win when their team has at least 3 points and is 2 points ahead. Additionally, if a game should drag on to round 9 (where both teams have 4 points) a final
            - link "sudden death" [ref=e906] [cursor=pointer]:
              - /url: /wiki/Tiebreaker
            - text: round begins. Respawn stated this scoring system "prevents total blowout games from dragging on for too long" and also "lets more competitive games keep the heat going for longer".
            - superscript [ref=e907]:
              - link "[46]" [ref=e908] [cursor=pointer]:
                - /url: "#cite_note-49"
          - paragraph [ref=e909]:
            - text: Rather than skydiving onto the map and gathering equipment like in the battle royale mode, players spawn in a "shop" where they can purchase equipment and charges of their Legend's abilities using materials earned in the previous rounds to prepare for the next fight. This variation of the game borrows mechanics from other shooters such as
            - link "Counter-Strike" [ref=e911] [cursor=pointer]:
              - /url: /wiki/Counter-Strike
            - text: and
            - link "Valorant" [ref=e913] [cursor=pointer]:
              - /url: /wiki/Valorant
            - text: .
            - superscript [ref=e914]:
              - link "[47]" [ref=e915] [cursor=pointer]:
                - /url: "#cite_note-50"
            - text: The mode is the first permanent deviation away from the battle royale format. It would later be removed in Season 16. Now Season 20 update, Breakout, introduces significant changes with upgradeable skill trees for playable Legends, offering MOBA-like progression and promising intense battles.
            - superscript [ref=e916]:
              - link "[48]" [ref=e917] [cursor=pointer]:
                - /url: "#cite_note-51"
          - heading "Seasons" [level=2] [ref=e919]
          - paragraph [ref=e920]:
            - text: Every new season is accompanied by the release of a new
            - link "playable character" [ref=e921] [cursor=pointer]:
              - /url: /wiki/Player_character
            - text: ", new weapons, or purchasable cosmetic items."
            - superscript [ref=e922]:
              - link "[49]" [ref=e923] [cursor=pointer]:
                - /url: "#cite_note-Polygon_season2-52"
          - paragraph [ref=e924]:
            - text: The game's first season began on March 19, 2019. Associated with seasons are time‑limited
            - link "battle passes" [ref=e925] [cursor=pointer]:
              - /url: /wiki/Battle_pass
            - text: that reward players with new cosmetic items, provided that they complete in‑game challenges during the season.
            - superscript [ref=e926]:
              - link "[50]" [ref=e927] [cursor=pointer]:
                - /url: "#cite_note-53"
            - superscript [ref=e928]:
              - link "[51]" [ref=e929] [cursor=pointer]:
