              - row "3 Meltdown October 1, 2019 – February 4, 2020[57] A new Legend named Crypto was introduced, who had tried to rig the Apex Games. A new weapon known as the Charge Rifle was added and changes to Ranked were made. The season also came with a brand new battle pass. A brand new map, named \"World's Edge,\" was also introduced, which had players fighting through volcanic and frozen landscapes. The map also included a train that traveled throughout World's Edge. The season also changed up the meta by removing certain attachments and introducing new ones whilst altering what existing items could do." [ref=e963]:
