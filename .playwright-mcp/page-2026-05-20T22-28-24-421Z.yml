          - heading "Limited-time modes" [level=5] [ref=e615]
          - paragraph [ref=e616]:
            - text: In addition to the season contents, Apex Legends featured limited-time events. These events offered unique, limited-time cosmetics themed to the event (for example, in the case of the Holo-Day Bash, Christmas-themed outfits) that could be earned in-game.
            - superscript [ref=e617]:
              - link "[14]" [ref=e618] [cursor=pointer]:
                - /url: "#cite_note-17"
            - text: Events also provided unique limited-time game modes (such as shotguns and snipers only). Some events also introduced changes to the current season map with a new point of interest (known as a "Town Takeover"), which was themed around one of the legends.
