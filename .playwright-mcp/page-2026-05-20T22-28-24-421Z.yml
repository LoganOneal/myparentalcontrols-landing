            - superscript [ref=e930]:
              - link "[52]" [ref=e931] [cursor=pointer]:
                - /url: "#cite_note-55"
            - text: In addition to new cosmetic items, the release of a season adds changes to the map and additional gameplay elements.
            - superscript [ref=e932]:
              - link "[53]" [ref=e933] [cursor=pointer]:
                - /url: "#cite_note-Polygon_season_22-56"
