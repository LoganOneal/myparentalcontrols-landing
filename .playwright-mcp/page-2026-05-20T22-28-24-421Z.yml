              - row "12 Defiance February 8, 2022 – May 10, 2022 A new legend named Mad Maggie was introduced, an old friend of Fuse, responsible for Season 8's map destruction and who briefly took over the Apex games. The season began with a three-week period of a limited time mode named \"Control\", a 9v9 mode where players held control points. Olympus was the map that also got an update. The season also arrived during the third anniversary, where players could obtain special packs based on various legends.[75]" [ref=e1054]:
