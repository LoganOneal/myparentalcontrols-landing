          - paragraph [ref=e199]:
            - generic [ref=e200]: Apex Legends
            - text: is a 2019
            - link "battle royale" [ref=e201] [cursor=pointer]:
              - /url: /wiki/Battle_royale_game
            - text: "-"
            - link "hero shooter" [ref=e202] [cursor=pointer]:
              - /url: /wiki/Hero_shooter
            - link "video game" [ref=e203] [cursor=pointer]:
              - /url: /wiki/Video_game
            - text: developed by
            - link "Respawn Entertainment" [ref=e204] [cursor=pointer]:
              - /url: /wiki/Respawn_Entertainment
            - text: and published by
            - link "Electronic Arts" [ref=e205] [cursor=pointer]:
              - /url: /wiki/Electronic_Arts
            - text: ", set in the same science fiction universe as Respawn's"
            - link "Titanfall" [ref=e207] [cursor=pointer]:
              - /url: /wiki/Titanfall
            - text: series. It is offered
            - link "free-to-play" [ref=e208] [cursor=pointer]:
              - /url: /wiki/Free-to-play
            - text: and is continuously updated under the
            - link "games as a service" [ref=e209] [cursor=pointer]:
              - /url: /wiki/Games_as_a_service
            - text: model; the game was originally released for
            - link "PlayStation 4" [ref=e210] [cursor=pointer]:
              - /url: /wiki/PlayStation_4
            - text: ","
            - link "Windows" [ref=e211] [cursor=pointer]:
              - /url: /wiki/Windows
            - text: ", and"
            - link "Xbox One" [ref=e212] [cursor=pointer]:
              - /url: /wiki/Xbox_One
            - text: in February 2019 and was followed by versions for
            - link "Nintendo Switch" [ref=e213] [cursor=pointer]:
              - /url: /wiki/Nintendo_Switch
            - text: in 2021 and both
            - link "PlayStation 5" [ref=e214] [cursor=pointer]:
              - /url: /wiki/PlayStation_5
            - text: and
            - link "Xbox Series X/S" [ref=e215] [cursor=pointer]:
              - /url: /wiki/Xbox_Series_X/S
            - text: in 2022, and
            - link "Nintendo Switch 2" [ref=e216] [cursor=pointer]:
              - /url: /wiki/Nintendo_Switch_2
            - text: in 2025. All versions support
            - link "cross-platform multiplayer" [ref=e217] [cursor=pointer]:
              - /url: /wiki/Cross-platform_play
            - text: . A
            - link "mobile" [ref=e218] [cursor=pointer]:
              - /url: /wiki/Mobile_game
            - text: version designed for
            - link "touchscreens" [ref=e219] [cursor=pointer]:
              - /url: /wiki/Touchscreens
            - text: was briefly available until its discontinuation in 2023.
          - paragraph [ref=e220]:
            - text: Before the match, players form into 1 to 4-player
            - link "squads" [ref=e221] [cursor=pointer]:
              - /url: /wiki/Squad
            - text: and select from
            - link "pre-designed characters" [ref=e222] [cursor=pointer]:
              - /url: /wiki/Player_character
            - text: with distinct abilities, known as "Legends". The game has multiple gameplay modes - with a range of team sizes. The
            - link "battle royale" [ref=e223] [cursor=pointer]:
              - /url: /wiki/Battle_royale_game
            - text: mode hosts up to 20 three-person squads or 15 two-person duos. In "Arenas", players form into three-player squads and fight against another squad in a 3v3
            - link "team deathmatch" [ref=e224] [cursor=pointer]:
              - /url: /wiki/Team_deathmatch
            - text: over a series of rounds to determine the winner of the match. Teams win when their team has at least 3 points and is 2 points ahead.
          - paragraph [ref=e225]: Work on Apex Legends began around late 2016, though the project remained a secret right up until its launch. The game's release in 2019 came as a surprise, as the game released suddenly without any prior marketing or official announcement. Until that point, it had been assumed that Respawn Entertainment was working on a third installment to the Titanfall franchise, the studio's previous major game, although a number of Titanfall characters do appear as minor characters or playable Legends.
          - paragraph [ref=e226]: Apex Legends received generally positive reviews from critics, who praised its gameplay, progression system, and fusion of elements from various genres. Some considered it a worthy competitor to other battle royale games. Apex Legends surpassed 25 million players by the end of its first week, and 50 million within its first month. By April 2021, it had approximately 100 million players, making it one of the most played video games of all time by player count.
          - heading "Gameplay" [level=2] [ref=e228]
          - paragraph [ref=e229]:
            - text: Apex Legends is an
            - link "online" [ref=e230] [cursor=pointer]:
              - /url: /wiki/Online_game
            - link "multiplayer" [ref=e231] [cursor=pointer]:
              - /url: /wiki/Multiplayer_video_game
            - link "battle royale game" [ref=e232] [cursor=pointer]:
              - /url: /wiki/Battle_royale_game
            - text: featuring squads of three players using
            - link "pre-made characters" [ref=e233] [cursor=pointer]:
              - /url: /wiki/Player_character
            - text: with distinctive abilities, called "Legends", similar to those of
            - link "hero shooters" [ref=e234] [cursor=pointer]:
              - /url: /wiki/Hero_shooter
            - text: .
            - superscript [ref=e235]:
              - link "[1]" [ref=e236] [cursor=pointer]:
                - /url: "#cite_note-Polygon_review2-3"
            - text: Alternate modes have been introduced allowing for up to four-player squads since the game's release.
            - superscript [ref=e237]:
              - link "[2]" [ref=e238] [cursor=pointer]:
                - /url: "#cite_note-4"
            - superscript [ref=e239]:
              - link "[3]" [ref=e240] [cursor=pointer]:
                - /url: "#cite_note-5"
            - superscript [ref=e241]:
              - link "[4]" [ref=e242] [cursor=pointer]:
                - /url: "#cite_note-6"
            - text: The game is
            - link "free-to-play" [ref=e243] [cursor=pointer]:
              - /url: /wiki/Free-to-play
            - text: and monetized through
            - link "microtransactions" [ref=e244] [cursor=pointer]:
              - /url: /wiki/Microtransaction
            - text: and
            - link "loot boxes" [ref=e245] [cursor=pointer]:
              - /url: /wiki/Loot_box
            - text: ", which allow the player to spend both real money and in-game currency on cosmetic items, such as outfits for the Legends and new colors for weapons."
            - superscript [ref=e246]:
              - link "[5]" [ref=e247] [cursor=pointer]:
                - /url: "#cite_note-Guardian_parents2-7"
            - superscript [ref=e248]:
              - link "[6]" [ref=e249] [cursor=pointer]:
                - /url: "#cite_note-Polygon_mtx2-8"
          - heading "Characters" [level=3] [ref=e251]
          - note [ref=e252]:
            - text: "Main article:"
            - link "Characters of Apex Legends" [ref=e253] [cursor=pointer]:
              - /url: /wiki/Characters_of_Apex_Legends
          - paragraph [ref=e254]: "Each character in the squad has a unique design, personality, and abilities that provide different playstyles to the team. Starting with Season 16, each legend is assigned to one of the five unique class styles: Assault, Skirmisher, Recon, Controller and Support."
