              - row "7 Ascension November 4, 2020 – February 2, 2021 A new Legend named Horizon was introduced, an astrophysicist who was trapped on the edge of a black hole for 87 real-time years. A brand new map, Olympus, was also introduced, known as a \"city in the clouds\". The new map also allowed players to traverse it using \"Tridents\", a form of vehicle for the whole squad. A new battle pass was added, community \"clubs\" were also added to allow players to meet other like-minded players, and the launch of Season 7 also brought Apex Legends to Steam. The season also introduced a map rotation to the game's normal mode, with Kings Canyon becoming unplayable for the season as a result.[26][65]" [ref=e1005]:
                - cell "7" [ref=e1006]
                - cell "Ascension" [ref=e1007]
