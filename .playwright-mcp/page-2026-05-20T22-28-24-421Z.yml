          - heading "Core" [level=4] [ref=e469]
          - heading "Battle Royale" [level=5] [ref=e471]
          - list [ref=e472]:
            - listitem [ref=e473]: Up to 60 players per match
            - listitem [ref=e474]: Shrinking ring
            - listitem [ref=e475]: Looting
            - listitem [ref=e476]:
              - text: Win by being in the last surviving squad
              - superscript [ref=e477]:
                - link "[8]" [ref=e478] [cursor=pointer]:
                  - /url: "#cite_note-11"
          - paragraph [ref=e479]:
            - text: Each match generally features twenty teams of three-player
            - link "squads" [ref=e480] [cursor=pointer]:
              - /url: /wiki/Squad
            - text: . Players can join friends in a squad or can be matched randomly with other players. Before the match, each player on the squad selects one of the 25
            - link "playable characters" [ref=e481] [cursor=pointer]:
              - /url: /wiki/Player_character
            - text: (as of season 19), with the exception that no character may be selected more than once by a squad.
          - paragraph [ref=e482]:
            - text: All teams are then placed on an aircraft that passes over the game map. One player in each squad is the
            - link "jumpmaster" [ref=e483] [cursor=pointer]:
              - /url: /wiki/Jumpmaster
            - text: ", selecting when the squad should skydive out of the aircraft and where to land with the concurrence of the other squad members. However, players are free to deviate from the squad's path."
          - figure "A gameplay screenshot showing the game's ping system" [ref=e484]:
            - link [ref=e485] [cursor=pointer]:
              - /url: /wiki/File:Apex_Legends_gameplay_screenshot.jpg
              - img [ref=e486]
            - generic [ref=e487]: A gameplay screenshot showing the game's ping system
          - paragraph [ref=e488]:
            - text: Once on the ground, the squad can scavenge for weapons, armor, and other equipment that is scattered around buildings, or in crates randomly distributed around the map, while keeping an eye out for other squads. Apex Legends includes a
            - link "nonverbal communication" [ref=e489] [cursor=pointer]:
              - /url: /wiki/Nonverbal_communication
            - text: "\"ping system\" which allows players to use their"
            - link "game controller" [ref=e490] [cursor=pointer]:
              - /url: /wiki/Game_controller
            - text: to communicate to their squad certain directions, weapon locations, enemies, and suggested
            - link "strategies" [ref=e491] [cursor=pointer]:
              - /url: /wiki/Strategies
            - text: .
            - superscript [ref=e492]:
              - link "[9]" [ref=e493] [cursor=pointer]:
                - /url: "#cite_note-Telegraph_review2-12"
            - text: While the game offers movement options similar to other shooters, it includes some of the gameplay features of previous Titanfall games, such as the ability to climb over short walls, slide down inclined surfaces, and use zip-lines to traverse an area quickly.
            - superscript [ref=e494]:
              - link "[10]" [ref=e495] [cursor=pointer]:
                - /url: "#cite_note-Guardian_review2-13"
          - paragraph [ref=e496]:
            - text: Over time, the game's safe zone will reduce in size around a randomly-selected point on the map; players outside the safe zone take damage and may die if they do not reach the safe zone in time. This also confines squads to smaller spaces to force encounters. The last squad with any members left alive is crowned the "Apex Champions" of that match. Players who become
            - link "knocked down" [ref=e497] [cursor=pointer]:
              - /url: /wiki/Knockout
            - text: in the course of a game can be revived by their squadmates. Should a player be killed completely, they can still be
            - link "resurrected" [ref=e498] [cursor=pointer]:
              - /url: /wiki/Resurrection
            - text: if their team member(s) collect their respawn
            - link "banner" [ref=e499] [cursor=pointer]:
              - /url: /wiki/Banner
            - text: ", which appears at the place where they died, and bring it to one of several"
            - link "beacons" [ref=e500] [cursor=pointer]:
              - /url: /wiki/Beacons
            - text: on the island. The banner, however, must be collected within a time limit, before expiring and eliminating the player.
            - superscript [ref=e501]:
              - link "[1]" [ref=e502] [cursor=pointer]:
                - /url: "#cite_note-Polygon_review2-3"
