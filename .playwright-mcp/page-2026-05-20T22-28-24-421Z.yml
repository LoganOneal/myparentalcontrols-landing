          - heading "Modes" [level=3] [ref=e449]
          - paragraph [ref=e450]:
            - text: Apex Legends is primarily divided into 2 categories, core and freestyle.
            - superscript [ref=e451]:
              - link "[7]" [ref=e452] [cursor=pointer]:
                - /url: "#cite_note-10"
