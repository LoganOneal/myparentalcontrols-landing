              - row "8 Mayhem February 2, 2021 – May 4, 2021 A new Legend named Fuse was introduced, a psychopath who joined the Apex Games after his planet, Salvo, joined forces with the Syndicate. A new gun called the 30-30 Repeater was introduced, a lever-action rifle. The ranked system received multiple changes, including increasing the number of people in the Apex Predator rank per platform from 500 to 750 players.[66] A new battle pass was introduced, and Kings Canyon was also re-introduced into the map rotation, albeit changed from its previous appearance in the rotation.[67] These changes included adding a previously unplayable area in the north.[68] A golden rarity of an extended magazine was also introduced, which automatically reloaded the holstered weapon after a few seconds.[69]" [ref=e1014]:
