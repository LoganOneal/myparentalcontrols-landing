              - row "14 Hunted August 9, 2022 – November 1, 2022 A new legend named Vantage was introduced, who used abilities best suited for sniper players. King's Canyon was the map that received a \"reforged\" update, with Skull Town, now renamed to \"Relic\", making a return; various other locations around King's Canyon were aptly updated for better rotations. There was also a level cap increase, from level 500 to level 2000, where once a player reached 500, they could revert to level 1 and progress again.[77]" [ref=e1068]:
                - cell "14" [ref=e1069]
                - cell "Hunted" [ref=e1070]
                - cell "August 9, 2022 – November 1, 2022" [ref=e1071]
                - cell "A new legend named Vantage was introduced, who used abilities best suited for sniper players. King's Canyon was the map that received a \"reforged\" update, with Skull Town, now renamed to \"Relic\", making a return; various other locations around King's Canyon were aptly updated for better rotations. There was also a level cap increase, from level 500 to level 2000, where once a player reached 500, they could revert to level 1 and progress again.[77]" [ref=e1072]:
                  - text: A new legend named Vantage was introduced, who used abilities best suited for sniper players. King's Canyon was the map that received a "reforged" update, with Skull Town, now renamed to "Relic", making a return; various other locations around King's Canyon were aptly updated for better rotations. There was also a level cap increase, from level 500 to level 2000, where once a player reached 500, they could revert to level 1 and progress again.
                  - superscript [ref=e1073]:
                    - link "[77]" [ref=e1074] [cursor=pointer]:
                      - /url: "#cite_note-80"
              - row "15 Eclipse November 1, 2022 – February 14, 2023 A new legend named Catalyst was introduced, who used ferrofluid to create structures at will. A new lunar map, Broken Moon, was released, which had a distinct feature of using zip rails to traverse across the map. Gifting was also added to allow players to purchase cosmetic items for their friends." [ref=e1075]:
                - cell "15" [ref=e1076]
                - cell "Eclipse" [ref=e1077]
                - cell "November 1, 2022 – February 14, 2023" [ref=e1078]
                - cell "A new legend named Catalyst was introduced, who used ferrofluid to create structures at will. A new lunar map, Broken Moon, was released, which had a distinct feature of using zip rails to traverse across the map. Gifting was also added to allow players to purchase cosmetic items for their friends." [ref=e1079]
              - row "16 Revelry February 14, 2023 – May 9, 2023 For the first time since the game launched, a new Legend was not introduced to the game this season, instead using this season to implement various changes with remastered classes and the introduction of an orientation match system. Whilst removing the Arena mode from the game, Team Deathmatch was made available as a new mode, which rotated out in a new permanent \"Mixtape\" playlist with Control and Gun Run. A brand new weapon called the Nemesis was added, and a rework was implemented of various legends and their classes." [ref=e1080]:
                - cell "16" [ref=e1081]
                - cell "Revelry" [ref=e1082]
                - cell "February 14, 2023 – May 9, 2023" [ref=e1083]
                - cell "For the first time since the game launched, a new Legend was not introduced to the game this season, instead using this season to implement various changes with remastered classes and the introduction of an orientation match system. Whilst removing the Arena mode from the game, Team Deathmatch was made available as a new mode, which rotated out in a new permanent \"Mixtape\" playlist with Control and Gun Run. A brand new weapon called the Nemesis was added, and a rework was implemented of various legends and their classes." [ref=e1084]
              - row "17 Arsenal May 9, 2023 – August 8, 2023 The seventeenth season of Apex Legends brought significant updates and changes to the game. World's Edge received a major map update, and Ballistic became a new legend that focused on weapon-based fighting. Players could also expect improvements to Ranked mode, as well as an overhaul of the Firing Range. A highly anticipated Weapon Progression system was added to the game that rewarded players with desirable items such as Legendary-rarity Banner Frames, weapon-based Stat Trackers and Badges, Loading Screens, and a Legendary weapon Apex Pack for completing special challenges. The weapon level remained the same even after seasons, as the progress did not reset. Another addition was the Evac Tower, which players could use to quickly escape danger." [ref=e1085]:
                - cell "17" [ref=e1086]
                - cell "Arsenal" [ref=e1087]
                - cell "May 9, 2023 – August 8, 2023" [ref=e1088]
                - cell "The seventeenth season of Apex Legends brought significant updates and changes to the game. World's Edge received a major map update, and Ballistic became a new legend that focused on weapon-based fighting. Players could also expect improvements to Ranked mode, as well as an overhaul of the Firing Range. A highly anticipated Weapon Progression system was added to the game that rewarded players with desirable items such as Legendary-rarity Banner Frames, weapon-based Stat Trackers and Badges, Loading Screens, and a Legendary weapon Apex Pack for completing special challenges. The weapon level remained the same even after seasons, as the progress did not reset. Another addition was the Evac Tower, which players could use to quickly escape danger." [ref=e1089]
              - row "18 Resurrection August 8, 2023 – October 31, 2023 there was no introduction of a new Legend. Instead, Revenant, an existing Legend, underwent a complete rework of his abilities and appearance. Mixtape then offered Control, Team Deathmatch, and Gun Run maps on the Battle Royale map Broken Moon. The Control map was on Production Yard, while the TDM/Gun Run map was on Perpetual Core (or simply The Core). The season commenced with the Death Dynasty Collection Event, where the collection reward was a recolored heirloom for Revenant. Additionally, the Charge Rifle underwent major adjustments, with the removal of its pre-fire laser and hitscan features, transforming it into a projectile weapon with significantly enhanced damage." [ref=e1090]:
                - cell "18" [ref=e1091]
                - cell "Resurrection" [ref=e1092]
                - cell "August 8, 2023 – October 31, 2023" [ref=e1093]
                - cell "there was no introduction of a new Legend. Instead, Revenant, an existing Legend, underwent a complete rework of his abilities and appearance. Mixtape then offered Control, Team Deathmatch, and Gun Run maps on the Battle Royale map Broken Moon. The Control map was on Production Yard, while the TDM/Gun Run map was on Perpetual Core (or simply The Core). The season commenced with the Death Dynasty Collection Event, where the collection reward was a recolored heirloom for Revenant. Additionally, the Charge Rifle underwent major adjustments, with the removal of its pre-fire laser and hitscan features, transforming it into a projectile weapon with significantly enhanced damage." [ref=e1094]
              - row "19 Ignite October 31, 2023 – February 13, 2024 Season 19 ushered in a new legend, named Conduit. In the new season, the Storm Point map got a partial rework to bring players a new combat experience. In Season 19, promotion trials were added to the ranking matches. When players reached the top of a certain rank, they entered the promotion trial state. During the trial, LP did not decrease or increase, allowing players to focus on completing the trial, and the pre-set rank gap limit was removed. Players could also play with friends regardless of their rank." [ref=e1095]:
                - cell "19" [ref=e1096]
                - cell "Ignite" [ref=e1097]
                - cell "October 31, 2023 – February 13, 2024" [ref=e1098]
                - cell "Season 19 ushered in a new legend, named Conduit. In the new season, the Storm Point map got a partial rework to bring players a new combat experience. In Season 19, promotion trials were added to the ranking matches. When players reached the top of a certain rank, they entered the promotion trial state. During the trial, LP did not decrease or increase, allowing players to focus on completing the trial, and the pre-set rank gap limit was removed. Players could also play with friends regardless of their rank." [ref=e1099]
              - row "20 Breakout February 13, 2024 – May 6, 2024 In this season, no new legends were added. However, major gameplay changes related to \"Evo Shields\" were made. Evo Shields were removed from the ground loot entirely, and the option to upgrade your shield via \"replicators\" was removed. Now, the \"Shield Core\" is automatically attached to your character at the beginning of a match, and will level up as the player deals damage or completes other tasks. Every new level adds a unique \"upgrade\" to each legend, expanding how their abilities work." [ref=e1100]:
                - cell "20" [ref=e1101]
                - cell "Breakout" [ref=e1102]
                - cell "February 13, 2024 – May 6, 2024" [ref=e1103]
                - cell "In this season, no new legends were added. However, major gameplay changes related to \"Evo Shields\" were made. Evo Shields were removed from the ground loot entirely, and the option to upgrade your shield via \"replicators\" was removed. Now, the \"Shield Core\" is automatically attached to your character at the beginning of a match, and will level up as the player deals damage or completes other tasks. Every new level adds a unique \"upgrade\" to each legend, expanding how their abilities work." [ref=e1104]
              - row "21 Upheaval May 6, 2024 – August 6, 2024 A new legend, Alter, was added as a \"Skirmisher.\" Also, the Broken Moon map was updated and changed. \"Apex Artifacts,\" also referred to as \"heirlooms,\" were changed, and a universal heirloom, one that could be used by each legend, was added. (Apex Legends Mobile previously had a universal heirloom, though these were not the same.)" [ref=e1105]:
                - cell "21" [ref=e1106]
                - cell "Upheaval" [ref=e1107]
                - cell "May 6, 2024 – August 6, 2024" [ref=e1108]
                - cell "A new legend, Alter, was added as a \"Skirmisher.\" Also, the Broken Moon map was updated and changed. \"Apex Artifacts,\" also referred to as \"heirlooms,\" were changed, and a universal heirloom, one that could be used by each legend, was added. (Apex Legends Mobile previously had a universal heirloom, though these were not the same.)" [ref=e1109]
              - row "22 Shockwave August 6, 2024 – October 22, 2024 This season was the first to be divided into 2 splits, with the second starting on September 17, 2024. There were no new legends added, although the \"E-District\" map was added. Also, the ability to dual wield both the \"Mozambique\" and the \"P2020,\" which is called \"akimbo\" in-game. Also, changes to the Battle Pass were made, which added a \"Premium\" and \"Premium+\" tier, which cannot be bought with Apex Coins, and cost $9.99 and $19.99 respectively." [ref=e1110]:
                - cell "22" [ref=e1111]
                - cell "Shockwave" [ref=e1112]
                - cell "August 6, 2024 – October 22, 2024" [ref=e1113]
                - cell "This season was the first to be divided into 2 splits, with the second starting on September 17, 2024. There were no new legends added, although the \"E-District\" map was added. Also, the ability to dual wield both the \"Mozambique\" and the \"P2020,\" which is called \"akimbo\" in-game. Also, changes to the Battle Pass were made, which added a \"Premium\" and \"Premium+\" tier, which cannot be bought with Apex Coins, and cost $9.99 and $19.99 respectively." [ref=e1114]
              - row "23 Into The Rift October 22, 2024 – February 11, 2025 This season added no new legends, but \"revived\" Lifeline similarly to the Revenant \"revival\" in Season 18. This gave her new abilities and expanded her base abilities. It also added the \"Rift Relics\" to the normal modes, which brought back versions of weapons from the first season of Apex Legends, as well as adding \"Boost Kits\" and the \"EPG-1\" from Titanfall and Titanfall 2. This season also added the Launch Royale LTM, which brought back the Season One version of the King's Canyon map." [ref=e1115]:
                - cell "23" [ref=e1116]
                - cell "Into The Rift" [ref=e1117]
                - cell "October 22, 2024 – February 11, 2025" [ref=e1118]
                - cell "This season added no new legends, but \"revived\" Lifeline similarly to the Revenant \"revival\" in Season 18. This gave her new abilities and expanded her base abilities. It also added the \"Rift Relics\" to the normal modes, which brought back versions of weapons from the first season of Apex Legends, as well as adding \"Boost Kits\" and the \"EPG-1\" from Titanfall and Titanfall 2. This season also added the Launch Royale LTM, which brought back the Season One version of the King's Canyon map." [ref=e1119]
              - row "24 Takeover February 11, 2025 – May 6, 2025 This season significantly reduced the time to kill on all guns with a flat damage increase to most weapons, a reduction in the maximum shield attainable through EVO points, and removed headshot damage reduction entirely. Arsenal Stations were added to POIs which contained every gun for a specific weapon class. This season reworked the legend Ash to have a dash ability and buffed Ballistic to be more powerful. The Assault class received a buff initially, with the Skirmisher class receiving a buff in Split 2." [ref=e1120]:
                - cell "24" [ref=e1121]
                - cell "Takeover" [ref=e1122]
                - cell "February 11, 2025 – May 6, 2025" [ref=e1123]
                - cell "This season significantly reduced the time to kill on all guns with a flat damage increase to most weapons, a reduction in the maximum shield attainable through EVO points, and removed headshot damage reduction entirely. Arsenal Stations were added to POIs which contained every gun for a specific weapon class. This season reworked the legend Ash to have a dash ability and buffed Ballistic to be more powerful. The Assault class received a buff initially, with the Skirmisher class receiving a buff in Split 2." [ref=e1124]
              - row "25 Prodigy May 6, 2025 – present" [ref=e1125]:
                - cell "25" [ref=e1126]
                - cell "Prodigy" [ref=e1127]
                - cell "May 6, 2025 – present" [ref=e1128]
                - cell [ref=e1129]
          - heading "Development" [level=2] [ref=e1131]
          - paragraph [ref=e1132]:
            - text: Developer
            - link "Respawn Entertainment" [ref=e1133] [cursor=pointer]:
              - /url: /wiki/Respawn_Entertainment
            - text: had previously developed
            - link "Titanfall" [ref=e1135] [cursor=pointer]:
              - /url: /wiki/Titanfall_(video_game)
            - text: (2014) and its sequel
            - link "Titanfall 2" [ref=e1137] [cursor=pointer]:
              - /url: /wiki/Titanfall_2
            - text: (2016), both of which were published by
            - link "Electronic Arts" [ref=e1138] [cursor=pointer]:
              - /url: /wiki/Electronic_Arts
            - text: (EA) who eventually
            - link "acquired" [ref=e1139] [cursor=pointer]:
              - /url: /wiki/Mergers_and_acquisitions
            - text: Respawn Entertainment in 2017.
            - superscript [ref=e1140]:
              - link "[78]" [ref=e1141] [cursor=pointer]:
                - /url: "#cite_note-verge_announce2-81"
          - paragraph [ref=e1142]:
            - text: According to design director Mackey McCandlish, initial design on Apex Legends started before Titanfall 2 had shipped in 2016 and as of 2018 the entire Titanfall team at Respawn Entertainment was working on the project;
            - superscript [ref=e1143]:
              - link "[79]" [ref=e1144] [cursor=pointer]:
                - /url: "#cite_note-Venture_Beat_interview2-82"
            - text: however, executive producer Drew McCoy stated that work on the game did not begin until the spring of 2017. He also confirmed that the game had approximately 115 developers working on it, making it the studio's most labor-intensive project. Titanfall 2, by way of comparison, had around 85 developers.
            - superscript [ref=e1145]:
              - link "[80]" [ref=e1146] [cursor=pointer]:
                - /url: "#cite_note-Gameinformer_interview2-83"
          - paragraph [ref=e1147]:
            - text: According to McCoy, the studio was not sure what their next game would be after completing the post-release support for Titanfall 2, though they knew they wanted to keep making Titanfall games. As with the development of Titanfall 2, the studio broke into several small teams to create "action blocks", small game prototypes that showcase a gameplay element, a weapon, or similar feature of a game that would fit into a Titanfall sequel. One such "action block" was inspired by the success of the
            - link "battle royale game" [ref=e1148] [cursor=pointer]:
              - /url: /wiki/Battle_royale_game
            - text: genre led by
            - link "PlayerUnknown's Battlegrounds" [ref=e1150] [cursor=pointer]:
              - /url: /wiki/PlayerUnknown%27s_Battlegrounds
            - text: ; this prototype, which applied gameplay mechanics of previous Titanfall games in a battle royale format, was considered very successful and the studio decided to expand this model.
            - superscript [ref=e1151]:
              - link "[81]" [ref=e1152] [cursor=pointer]:
                - /url: "#cite_note-gi.biz_nov_20192-84"
          - paragraph [ref=e1153]:
            - text: The designers decided that having the pilotable Titans (large
            - link "mecha" [ref=e1154] [cursor=pointer]:
              - /url: /wiki/Mecha
            - text: ) from their previous games would not work well in a battle-royale setting and instead focused on creating strong
            - link "character classes" [ref=e1155] [cursor=pointer]:
              - /url: /wiki/Player_character
            - text: which felt appropriate for the Titanfall franchise.
            - superscript [ref=e1156]:
              - link "[82]" [ref=e1157] [cursor=pointer]:
                - /url: "#cite_note-85"
            - text: They also found that some maneuverability features of prior Titanfall titles, such as wall-running, would make gameplay too challenging in a battle royale format, as identifying the direction of threats would be too difficult.
            - superscript [ref=e1158]:
              - link "[81]" [ref=e1159] [cursor=pointer]:
                - /url: "#cite_note-gi.biz_nov_20192-84"
          - paragraph [ref=e1160]:
            - text: Respawn Entertainment CEO Vince Zampella told
            - link "VentureBeat" [ref=e1162] [cursor=pointer]:
              - /url: /wiki/VentureBeat
            - text: that Apex Legends, as a live-service and free-to-play battle-royale game, was a new challenge for the studio and represented a new way for them of developing games. Their design philosophy was focused on "chasing the fun" and designing all the mechanics around team-based play, rather than solo play. The final decision on major design factors, such as the size of the teams, the number of teams and the size of the map, were all based on what felt "most fun" to the developers and were strongly guided by "
            - link "gut feeling" [ref=e1163] [cursor=pointer]:
              - /url: /wiki/Gut_feeling
            - text: "\"."
            - superscript [ref=e1164]:
              - link "[83]" [ref=e1165] [cursor=pointer]:
                - /url: "#cite_note-Venture_Beat_interview_Z2-86"
          - paragraph [ref=e1166]:
            - text: Design director Mackey McCandlish also stated that with Apex Legends, they were looking to challenge the conventions of the still relatively young battle-royale genre and to add their studio's unique touch to that class of games. They felt that the choice of three-man squads and a limit of 20 teams gave players on average a greater chance to win and also felt more in line with the type of intimate gameplay they were hoping to achieve. McCandlish claimed that the studio felt the need to create a "defensible space" in the battle-royale mode which could not be easily imitated and that the communication system, the three-man squads, and the smaller playing area were all aligned with this goal.
            - superscript [ref=e1167]:
              - link "[79]" [ref=e1168] [cursor=pointer]:
                - /url: "#cite_note-Venture_Beat_interview2-82"
          - paragraph [ref=e1169]:
            - text: As part of the development process, the game underwent extensive play-testing to ensure that all elements felt fun and balanced. Collectively the developers spent 100 to 200 hours a day trying out the game, a process which executive producer Drew McCoy called "probably the most important part of development".
            - superscript [ref=e1170]:
              - link "[80]" [ref=e1171] [cursor=pointer]:
                - /url: "#cite_note-Gameinformer_interview2-83"
            - text: To refine the game's non-verbal communication system, the studio play-tested the game for a month without the use of voice chat and applied fake names to the play-testers to predict how most players would experience the game.
            - superscript [ref=e1172]:
              - link "[84]" [ref=e1173] [cursor=pointer]:
                - /url: "#cite_note-87"
          - paragraph [ref=e1174]:
            - text: With the game mostly completed, Respawn's director of brand marketing, Arturo Castro, began working on how the studio would name and market it. Castro recognized that the game featured many elements which players would expect from a Titanfall franchise game, but lacked core elements such as Titans, Pilots and a single-player experience.
            - superscript [ref=e1175]:
              - link "[81]" [ref=e1176] [cursor=pointer]:
                - /url: "#cite_note-gi.biz_nov_20192-84"
            - text: Additionally, it had already been reported that Respawn was working on Titanfall 3 from a source at the studio.
            - superscript [ref=e1177]:
              - link "[85]" [ref=e1178] [cursor=pointer]:
                - /url: "#cite_note-Eurogamer_interview2-88"
            - text: Respawn therefore decided that attempting to market the game as part of the Titanfall series would have been difficult and would risk alienating Titanfall fans. They, therefore, opted to treat the game as a new
            - link "intellectual property" [ref=e1179] [cursor=pointer]:
              - /url: /wiki/Intellectual_property
            - text: (IP).
            - superscript [ref=e1180]:
              - link "[81]" [ref=e1181] [cursor=pointer]:
                - /url: "#cite_note-gi.biz_nov_20192-84"
            - superscript [ref=e1182]:
              - link "[85]" [ref=e1183] [cursor=pointer]:
                - /url: "#cite_note-Eurogamer_interview2-88"
          - paragraph [ref=e1184]:
            - text: Respawn were also concerned that as they at that time had recently been acquired by EA, players would think that EA had forced them to make a battle royale game.
            - superscript [ref=e1185]:
              - link "[81]" [ref=e1186] [cursor=pointer]:
                - /url: "#cite_note-gi.biz_nov_20192-84"
            - text: "McCoy affirmed that they had to convince Electronic Arts to allow them to make this game: \"we decided to make this game. Not to be throwing EA under the bus, but this wasn't the game they were expecting. I had to go to executives, show it to them, and explain it and...not convince but more, 'Hey, trust us! This is the thing you want out of us.' [...] This is a game where we had to say, 'This is what we want to do. Help us get there.'\""
            - superscript [ref=e1187]:
              - link "[80]" [ref=e1188] [cursor=pointer]:
                - /url: "#cite_note-Gameinformer_interview2-83"
          - paragraph [ref=e1189]:
            - text: Concerned that a standard six-month marketing campaign for the game would have generated negative publicity from disgruntled Titanfall fans, Castro claims they eventually took inspiration from musical artist
            - link "Beyoncé" [ref=e1190] [cursor=pointer]:
              - /url: /wiki/Beyonc%C3%A9
            - text: whose release of her
            - link "self-titled album" [ref=e1191] [cursor=pointer]:
              - /url: /wiki/Beyonc%C3%A9_(album)
            - text: came as a surprise to fans—a strategy which proved financially successful.
            - superscript [ref=e1192]:
              - link "[81]" [ref=e1193] [cursor=pointer]:
                - /url: "#cite_note-gi.biz_nov_20192-84"
            - superscript [ref=e1194]:
              - link "[85]" [ref=e1195] [cursor=pointer]:
                - /url: "#cite_note-Eurogamer_interview2-88"
            - text: Wanting to generate some
            - link "buzz" [ref=e1196] [cursor=pointer]:
              - /url: /wiki/Marketing_buzz
            - text: about this new product before its release, the studio secretly arranged for about 100 social media influencers to travel to their studio to try the game and then instructed them to "tease" news of it on their social media accounts during halftime of the
            - link "Super Bowl LIII" [ref=e1197] [cursor=pointer]:
              - /url: /wiki/Super_Bowl_LIII
            - text: ", the day before Apex Legends' formal release."
            - superscript [ref=e1198]:
              - link "[81]" [ref=e1199] [cursor=pointer]:
                - /url: "#cite_note-gi.biz_nov_20192-84"
          - paragraph [ref=e1200]:
            - text: Respawn CEO Vince Zampella felt the approach was "gross", according to Castro, as he found it reminiscent of the infamous
            - link "Fyre Festival" [ref=e1201] [cursor=pointer]:
              - /url: /wiki/Fyre_Festival
            - text: "\"hype\" which later turned out to be a fraudulent event. However, as Apex Legends was already ready for release at this point, Castro felt the approach was an appropriate marketing strategy."
            - superscript [ref=e1202]:
              - link "[81]" [ref=e1203] [cursor=pointer]:
                - /url: "#cite_note-gi.biz_nov_20192-84"
            - text: Because of the game's performance in terms of player-count and viewership on streaming services, Castro felt vindicated in this decision.
            - superscript [ref=e1204]:
              - link "[81]" [ref=e1205] [cursor=pointer]:
                - /url: "#cite_note-gi.biz_nov_20192-84"
            - text: This approach was uncharacteristic of any prior EA title.
            - superscript [ref=e1206]:
              - link "[78]" [ref=e1207] [cursor=pointer]:
                - /url: "#cite_note-verge_announce2-81"
          - paragraph [ref=e1208]:
            - text: The game is built using a modified version of
            - link "Source engine" [ref=e1209] [cursor=pointer]:
              - /url: /wiki/Source_(game_engine)
            - text: ; Source had previously been used for Titanfall 2, however for Apex Legends several necessary adjustments to allow for the increased draw distances and the large game map were made. Apex Legends is believed to be pushing at the technological limits of its game engine and as a result, the game compromises on dynamic
            - link "display resolution" [ref=e1210] [cursor=pointer]:
              - /url: /wiki/Display_resolution
            - text: ", with the quality of the image and"
            - link "frame rate" [ref=e1211] [cursor=pointer]:
              - /url: /wiki/Frame_rate
            - text: suffering particularly on console versions and on lower-end PC devices.
            - superscript [ref=e1212]:
              - link "[86]" [ref=e1213] [cursor=pointer]:
                - /url: "#cite_note-Eurogamer_specs2-89"
          - paragraph [ref=e1214]:
            - text: Prior to launch, McCoy confirmed there were plans to implement
            - link "cross-platform play" [ref=e1215] [cursor=pointer]:
              - /url: /wiki/Cross-platform_play
            - text: to the game in the future, though claimed that game progression and in-game purchases cannot be transferred across systems due to hardware limitations. McCoy has also expressed the desire to eventually bring Apex Legends to
            - link "iOS" [ref=e1216] [cursor=pointer]:
              - /url: /wiki/IOS
            - text: ","
            - link "Android" [ref=e1217] [cursor=pointer]:
              - /url: /wiki/Android_(operating_system)
            - text: ", and"
            - link "Nintendo Switch" [ref=e1218] [cursor=pointer]:
              - /url: /wiki/Nintendo_Switch
            - text: .
            - superscript [ref=e1219]:
              - link "[87]" [ref=e1220] [cursor=pointer]:
                - /url: "#cite_note-90"
            - superscript [ref=e1221]:
              - link "[88]" [ref=e1222] [cursor=pointer]:
                - /url: "#cite_note-91"
          - paragraph [ref=e1223]:
            - text: According to anonymous reports,
            - link "Tencent Games" [ref=e1224] [cursor=pointer]:
              - /url: /wiki/Tencent_Games
            - text: is working with Electronic Arts to bring Apex Legends to
            - link "China" [ref=e1225] [cursor=pointer]:
              - /url: /wiki/China
            - text: ", as"
            - link "partnering with a local Chinese firm" [ref=e1226] [cursor=pointer]:
              - /url: /wiki/Video_gaming_in_China
            - text: is a requirement for Western media companies wishing to make their products legally available in the country.
            - superscript [ref=e1227]:
              - link "[89]" [ref=e1228] [cursor=pointer]:
                - /url: "#cite_note-92"
            - text: In January 2020, EA confirmed to investors that it was working with a local partner in order to bring the game to PC in China, though it did not mention the partner by name.
            - superscript [ref=e1229]:
              - link "[90]" [ref=e1230] [cursor=pointer]:
                - /url: "#cite_note-93"
          - paragraph [ref=e1231]:
            - text: Respawn established a new Vancouver, British Columbia, studio, within the
            - link "EA Vancouver" [ref=e1232] [cursor=pointer]:
              - /url: /wiki/EA_Vancouver
            - text: campus, dedicated to supporting Apex Legends in May 2020.
            - superscript [ref=e1233]:
              - link "[91]" [ref=e1234] [cursor=pointer]:
                - /url: "#cite_note-94"
          - paragraph [ref=e1235]:
            - text: As part of the June 2020 EA Play presentation, Respawn announced that Apex Legends would be brought to the
            - link "Steam" [ref=e1236] [cursor=pointer]:
              - /url: /wiki/Steam_(service)
            - text: storefront for Windows players, as well as to the
            - link "Nintendo Switch" [ref=e1237] [cursor=pointer]:
              - /url: /wiki/Nintendo_Switch
            - text: by late 2020. Further, the game would support
            - link "cross-platform play" [ref=e1238] [cursor=pointer]:
              - /url: /wiki/Cross-platform_play
            - text: across all supported platforms on these releases.
            - superscript [ref=e1239]:
              - link "[92]" [ref=e1240] [cursor=pointer]:
                - /url: "#cite_note-95"
            - text: Cross-platform play was introduced into the game with the Aftermarket Collection Event.
            - superscript [ref=e1241]:
              - link "[29]" [ref=e1242] [cursor=pointer]:
                - /url: "#cite_note-Cross-Play2-32"
            - text: In a blog post by Respawn in late October 2020, it was revealed that the Steam version will launch on November 4, the same day as the launch of season 7. However, the Nintendo Switch version was delayed to March 9, 2021.
            - superscript [ref=e1243]:
              - link "[93]" [ref=e1244] [cursor=pointer]:
                - /url: "#cite_note-96"
            - superscript [ref=e1245]:
              - link "[94]" [ref=e1246] [cursor=pointer]:
                - /url: "#cite_note-Switch2-97"
            - text: The Nintendo Switch version of Apex Legends was developed by
            - link "Panic Button" [ref=e1247] [cursor=pointer]:
              - /url: /wiki/Panic_Button_(company)
            - text: ", known for their Switch ports of the"
            - link "DOOM" [ref=e1249] [cursor=pointer]:
              - /url: /wiki/Doom_(franchise)
            - text: series and
            - link "Rocket League" [ref=e1251] [cursor=pointer]:
              - /url: /wiki/Rocket_League
            - text: .
            - superscript [ref=e1252]:
              - link "[95]" [ref=e1253] [cursor=pointer]:
                - /url: "#cite_note-98"
          - paragraph [ref=e1254]:
            - text: Electronic Arts also confirmed that mobile launches on iOS and Android were in development in collaboration with a Chinese mobile company. The mobile ports are set to release by the end of 2022.
            - superscript [ref=e1255]:
              - link "[96]" [ref=e1256] [cursor=pointer]:
                - /url: "#cite_note-:02-99"
            - text: In April 2021,
            - link "Electronic Arts" [ref=e1257] [cursor=pointer]:
              - /url: /wiki/Electronic_Arts
            - text: announced that the mobile version of the game would be titled Apex Legends Mobile, and would begin beta testing in the coming months.
            - superscript [ref=e1258]:
              - link "[97]" [ref=e1259] [cursor=pointer]:
                - /url: "#cite_note-100"
            - text: In July 2021, Apex Legends was
            - link "hacked" [ref=e1260] [cursor=pointer]:
              - /url: /wiki/Hacking_of_consumer_electronics
            - text: by individuals wishing to draw attention to persistent problems with cheating in the Titanfall series that had been unaddressed by Electronic Arts and Respawn. Large banners pointed players of Apex Legends to a website outlining their concerns.
            - superscript [ref=e1261]:
              - link "[98]" [ref=e1262] [cursor=pointer]:
                - /url: "#cite_note-101"
          - paragraph [ref=e1263]:
            - text: In February 2022, Respawn announced that a native version of Apex Legends for
            - link "PlayStation 5" [ref=e1264] [cursor=pointer]:
              - /url: /wiki/PlayStation_5
            - text: and
            - link "Xbox Series X/S" [ref=e1265] [cursor=pointer]:
              - /url: /wiki/Xbox_Series_X/S
            - text: was "coming very soon..." and that it would introduce new features specifically for the next generation consoles.
            - superscript [ref=e1266]:
              - link "[99]" [ref=e1267] [cursor=pointer]:
                - /url: "#cite_note-102"
            - superscript [ref=e1268]:
              - link "[100]" [ref=e1269] [cursor=pointer]:
                - /url: "#cite_note-103"
            - text: These versions were released on March 29, 2022.
            - superscript [ref=e1270]:
              - link "[101]" [ref=e1271] [cursor=pointer]:
                - /url: "#cite_note-104"
          - paragraph [ref=e1272]:
            - text: Apex Legends Mobile released on May 17, 2022, for iOS and Android devices. The game was published by Electronic Arts and developed by Chinese company Lightspeed and Quantum Studios, a subsidiary of
            - link "Tencent" [ref=e1273] [cursor=pointer]:
              - /url: /wiki/Tencent
            - text: and the developer of
            - link "PUBG Mobile" [ref=e1275] [cursor=pointer]:
              - /url: /wiki/PUBG_Mobile
            - text: .
            - superscript [ref=e1276]:
              - link "[102]" [ref=e1277] [cursor=pointer]:
                - /url: "#cite_note-105"
            - text: The game was shut down on May 1, 2023.
            - superscript [ref=e1278]:
              - link "[103]" [ref=e1279] [cursor=pointer]:
                - /url: "#cite_note-106"
          - paragraph [ref=e1280]:
            - text: On January 30, 2026, Respawn announced that the Nintendo Switch version would be discontinued following the end of Season 29.
            - superscript [ref=e1281]:
              - link "[104]" [ref=e1282] [cursor=pointer]:
                - /url: "#cite_note-107"
          - heading "Esports" [level=3] [ref=e1284]
          - paragraph [ref=e1285]:
            - text: Shortly after Apex Legends' launch, it was seen as a potential
            - link "esport" [ref=e1286] [cursor=pointer]:
              - /url: /wiki/Esport
            - text: competition, and Respawn had anticipated establishing events once the game had been established. As early as March 2019, various esport team sponsors began to assemble Apex Legends teams for these competitions.
            - superscript [ref=e1287]:
              - link "[105]" [ref=e1288] [cursor=pointer]:
                - /url: "#cite_note-108"
            - link "ESPN" [ref=e1289] [cursor=pointer]:
              - /url: /wiki/ESPN
            - text: launched its EXP program to showcase esports events running alongside other ESPN-managed sporting events. The first such event was the EXP Pro-Am Apex Legends Exhibition, run on July 11, 2019, alongside the
            - link "2019 ESPY Awards" [ref=e1290] [cursor=pointer]:
              - /url: /wiki/2019_ESPY_Awards
            - text: .
            - superscript [ref=e1291]:
              - link "[106]" [ref=e1292] [cursor=pointer]:
                - /url: "#cite_note-109"
            - text: An EXP Invitational event with a $150,000 prize pool took place alongside the X Games Minneapolis 2019 from August 1 to 4, 2019. However, as a result of the
            - link "El Paso" [ref=e1293] [cursor=pointer]:
              - /url: /wiki/2019_El_Paso_shooting
            - text: and
            - link "Dayton" [ref=e1294] [cursor=pointer]:
              - /url: /wiki/2019_Dayton_shooting
            - text: mass shootings that occurred over that weekend, both ESPN and ABC opted to delay broadcast of the event out of respect for the victims of the shootings.
            - superscript [ref=e1295]:
              - link "[107]" [ref=e1296] [cursor=pointer]:
                - /url: "#cite_note-110"
          - paragraph [ref=e1297]:
            - text: Respawn and EA announced the
            - link "Apex Legends Global Series" [ref=e1298] [cursor=pointer]:
              - /url: /wiki/Apex_Legends_Global_Series
            - text: in December 2019, consisting of several online events and twelve live events during 2020 with a total US$3 million prize pool. The Global Series follows a similar approach as Fortnite Battle Royale by using multiple tiers of events to qualify players. Players will qualify for the Global Series through Online Tournaments. Top players and teams from these events will be invited to either regional Challenger events or to global Premier events, where the winners have a chance for a cash payout and invitations to one of the three major events. Three Major events will be held for one hundred teams to accumulate points in the Global Series to vie for placement in the final Major event as well as part of a US$500,000 prize pool. The fourth Major event had up to sixty teams competing for a portion of a US$1 million pool.
            - superscript [ref=e1299]:
              - link "[108]" [ref=e1300] [cursor=pointer]:
                - /url: "#cite_note-111"
          - paragraph [ref=e1301]:
            - text: Year 2 of the ALGS began in September 2021.
            - superscript [ref=e1302]:
              - text: "["
              - link "citation needed" [ref=e1304] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
          - paragraph [ref=e1305]:
            - text: Year 3 of the ALGS began on July 7, 2022, consisting of 40 teams around the world with a total US$2 million prize pool. The first place belongs to Darkzero Esports, with the prize of US$500,000.
            - superscript [ref=e1306]:
              - text: "["
              - link "citation needed" [ref=e1308] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
