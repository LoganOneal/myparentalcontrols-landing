              - 'row "6 Boosted August 18, 2020 – November 4, 2020 A new Legend named Rampart was introduced, a gun modder who can could emplace a minigun which she called \"Sheila\", and provided amped cover for her team. World''s Edge was updated with new points of interest built by Hammond Industries: Launch Site, Countdown, and Staging.[63] A new battle pass was added, which included a new cosmetic reward of \"Holo-Sprays\", a new crafting mechanic allowed players to upgrade their gear with materials found around the map, and the fan-favorite weapon from Titanfall 2, the Volt SMG, also made its debut. Additionally, all normal armor (except gold armor) was removed from the game.[64]" [ref=e994]':
