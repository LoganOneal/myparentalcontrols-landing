<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; fill: #2D2A33; }
    .muted { fill: #7A7480; }
    .faint { fill: #B0A8B6; }
    .invert { fill: #FFFFFF; }
    .h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .h2 { font-size: 15px; font-weight: 600; }
    .h3 { font-size: 14px; font-weight: 600; }
    .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; }
    .body { font-size: 12px; font-weight: 400; }
    .small { font-size: 11px; font-weight: 500; }
    .pill { font-size: 9.5px; font-weight: 700; letter-spacing: 0.3px; }
    .tab { font-size: 9.5px; font-weight: 600; letter-spacing: 0.2px; }
    .time { font-size: 10.5px; font-weight: 500; }
  </style>
  <defs>
    <clipPath id="screen"><rect x="9" y="9" width="342" height="722" rx="46"/></clipPath>
  </defs>

  <!-- Phone bezel -->
  <rect width="360" height="740" rx="54" fill="#1a1a1a"/>
  <rect x="0.5" y="0.5" width="359" height="739" rx="53.5" fill="none" stroke="#2d2d2d"/>
  <rect x="6" y="6" width="348" height="728" rx="48" fill="#0d0d0d"/>

  <g clip-path="url(#screen)">
    <!-- Screen -->
    <rect x="9" y="9" width="342" height="722" fill="#FAF8F5"/>
    <!-- Lavender wash behind header -->
    <rect x="9" y="9" width="342" height="220" fill="#EFE9F7"/>
    <circle cx="305" cy="55" r="120" fill="#E4DAF1" opacity="0.6"/>

    <!-- Status bar -->
    <text x="32" y="38" class="small">9:41</text>
    <g transform="translate(285, 30)">
      <rect x="0" y="6" width="3" height="3" rx="0.5" fill="#2D2A33"/>
      <rect x="5" y="4" width="3" height="5" rx="0.5" fill="#2D2A33"/>
      <rect x="10" y="2" width="3" height="7" rx="0.5" fill="#2D2A33"/>
      <rect x="15" y="0" width="3" height="9" rx="0.5" fill="#2D2A33"/>
      <path d="M26,7 Q31,2 36,7 M28,9 Q31,6 34,9" fill="none" stroke="#2D2A33" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="31" cy="10.5" r="1" fill="#2D2A33"/>
      <rect x="42" y="2" width="22" height="9" rx="2.5" fill="none" stroke="#2D2A33" stroke-width="1"/>
      <rect x="64.5" y="4.5" width="1.5" height="4" rx="0.5" fill="#2D2A33"/>
      <rect x="43.5" y="3.5" width="16" height="6" rx="1" fill="#2D2A33"/>
    </g>
    <!-- Dynamic Island -->
    <rect x="135" y="22" width="90" height="28" rx="14" fill="#0d0d0d"/>

    <!-- Header -->
    <text x="26" y="92" class="eyebrow muted">LIVE FEED</text>
    <text x="26" y="124" class="h1">Alerts</text>
    <text x="26" y="148" class="body muted">3 new this morning · Lily, 12</text>

    <!-- Bell button -->
    <g transform="translate(312, 108)">
      <circle r="20" fill="#FFFFFF" stroke="#E4DAF1"/>
      <path d="M-6,-3 C-6,-9 -3,-11 0,-11 C3,-11 6,-9 6,-3 L6.5,2 C6.5,3 7.5,4 8.5,4 L-8.5,4 C-7.5,4 -6.5,3 -6.5,2 Z" fill="#7C6BAA"/>
      <path d="M-2.5,5 C-2.5,7.2 -1.2,8 0,8 C1.2,8 2.5,7.2 2.5,5 Z" fill="#7C6BAA"/>
      <circle cx="7" cy="-7" r="4" fill="#FAF8F5"/>
      <circle cx="7" cy="-7" r="2.8" fill="#7DA395"/>
    </g>

    <!-- Featured alert card -->
    <g transform="translate(20, 188)">
      <rect width="320" height="148" rx="22" fill="#FFFFFF" stroke="#ECE7DE"/>
      <!-- left accent stripe -->
      <rect width="4" height="148" rx="2" fill="#7C6BAA"/>

      <!-- Platform chip -->
      <g transform="translate(20, 20)">
        <rect width="76" height="22" rx="11" fill="#2C2C2C"/>
        <circle cx="13" cy="11" r="6" fill="#FFFFFF"/>
        <circle cx="13" cy="11" r="3" fill="#2C2C2C"/>
        <text x="24" y="15" class="pill invert">ROBLOX</text>
      </g>

      <!-- Severity tag -->
      <g transform="translate(104, 20)">
        <rect width="116" height="22" rx="11" fill="#F1DCD4"/>
        <circle cx="13" cy="11" r="3" fill="#C77F6F"/>
        <text x="22" y="15" class="pill" fill="#8C4F40">PREDATOR CONTACT</text>
      </g>

      <!-- Time -->
      <text x="305" y="34" class="time muted" text-anchor="end">2m ago</text>

      <!-- Title -->
      <text x="20" y="68" class="h2">Stranger asked Lily to move</text>
      <text x="20" y="86" class="h2">the chat to Discord</text>

      <!-- Quote -->
      <text x="20" y="108" class="body muted">"hey lol, my mic is broken on here.</text>
      <text x="20" y="123" class="body muted">add me on disc? user is xx_…"</text>

      <!-- Action row -->
      <g transform="translate(20, 132)">
        <text class="pill" fill="#7C6BAA">SEE FULL CONTEXT →</text>
      </g>
    </g>

    <!-- Alert card 2 -->
    <g transform="translate(20, 354)">
      <rect width="320" height="78" rx="18" fill="#FFFFFF" stroke="#ECE7DE"/>
      <!-- Icon chip -->
      <g transform="translate(16, 16)">
        <rect width="42" height="42" rx="11" fill="#FFFC00"/>
        <path d="M21,9 C13,9 7,15 7,22 C7,29 12,32 13,33 L13,36 L17,33 C18,33 19,33 21,33 C29,33 35,28 35,21 C35,14 29,9 21,9 Z" fill="#FFFFFF" transform="scale(0.7) translate(4,4)"/>
        <text x="21" y="27" class="pill" fill="#000000" text-anchor="middle">SC</text>
      </g>
      <text x="70" y="36" class="h3">Vanished Snap recovered</text>
      <text x="70" y="54" class="body muted">From contact "kai_skater" · suggestive image</text>
      <text x="304" y="36" class="time muted" text-anchor="end">8:14 AM</text>
      <g transform="translate(266, 46)">
        <rect width="46" height="18" rx="9" fill="#F2E5D2"/>
        <text x="23" y="13" class="pill" fill="#8E6B3F" text-anchor="middle">REVIEW</text>
      </g>
    </g>

    <!-- Alert card 3 -->
    <g transform="translate(20, 450)">
      <rect width="320" height="78" rx="18" fill="#FFFFFF" stroke="#ECE7DE"/>
      <g transform="translate(16, 16)">
        <rect width="42" height="42" rx="11" fill="#5865F2"/>
        <text x="21" y="28" class="h3 invert" text-anchor="middle">D</text>
      </g>
      <text x="70" y="36" class="h3">Bullying language flagged</text>
      <text x="70" y="54" class="body muted">In #middle-school server · 4 messages</text>
      <text x="304" y="36" class="time muted" text-anchor="end">7:02 AM</text>
      <g transform="translate(266, 46)">
        <rect width="46" height="18" rx="9" fill="#F2E5D2"/>
        <text x="23" y="13" class="pill" fill="#8E6B3F" text-anchor="middle">REVIEW</text>
      </g>
    </g>

    <!-- Alert card 4 -->
    <g transform="translate(20, 546)">
      <rect width="320" height="78" rx="18" fill="#FFFFFF" stroke="#ECE7DE"/>
      <g transform="translate(16, 16)">
        <rect width="42" height="42" rx="11" fill="#E1ECE7"/>
        <path d="M14,10 L14,18 C14,24 18,28 21,29 C24,28 28,24 28,18 L28,10 Z" fill="none" stroke="#7DA395" stroke-width="2" stroke-linejoin="round"/>
        <path d="M17,18 L20,21 L25,15" fill="none" stroke="#7DA395" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="70" y="36" class="h3">All clear · Minecraft, Fortnite</text>
      <text x="70" y="54" class="body muted">12 chats reviewed, nothing flagged</text>
      <text x="304" y="36" class="time muted" text-anchor="end">6:30 AM</text>
    </g>

    <!-- Tab bar background -->
    <rect x="9" y="660" width="342" height="71" fill="#FFFFFF"/>
    <rect x="9" y="660" width="342" height="1" fill="#ECE7DE"/>

    <!-- Tabs -->
    <g transform="translate(48, 678)">
      <!-- Alerts (active) -->
      <g>
        <path d="M-7,-3 C-7,-8 -3,-11 0,-11 C3,-11 7,-8 7,-3 L8,3 L-8,3 Z" fill="#7C6BAA"/>
        <path d="M-2,4 C-2,6 -1,7 0,7 C1,7 2,6 2,4 Z" fill="#7C6BAA"/>
        <text y="22" class="tab" fill="#7C6BAA" text-anchor="middle">Alerts</text>
      </g>
    </g>
    <g transform="translate(132, 678)">
      <path d="M-8,4 L-3,-1 L1,3 L7,-5" fill="none" stroke="#B0A8B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="22" class="tab muted" text-anchor="middle">Activity</text>
    </g>
    <g transform="translate(216, 678)">
      <circle cx="-4" cy="-2" r="4" fill="none" stroke="#B0A8B6" stroke-width="1.8"/>
      <circle cx="4" cy="-2" r="4" fill="none" stroke="#B0A8B6" stroke-width="1.8"/>
      <path d="M-10,8 C-10,4 -7,2 -4,2 M10,8 C10,4 7,2 4,2" fill="none" stroke="#B0A8B6" stroke-width="1.8" stroke-linecap="round"/>
      <text y="22" class="tab muted" text-anchor="middle">Children</text>
    </g>
    <g transform="translate(300, 678)">
      <circle r="6" fill="none" stroke="#B0A8B6" stroke-width="1.8"/>
      <path d="M0,-8.5 L0,-6 M0,6 L0,8.5 M-8.5,0 L-6,0 M6,0 L8.5,0 M-6,-6 L-4,-4 M4,4 L6,6 M-6,6 L-4,4 M4,-4 L6,-6" stroke="#B0A8B6" stroke-width="1.8" stroke-linecap="round"/>
      <text y="22" class="tab muted" text-anchor="middle">Settings</text>
    </g>

    <!-- Home indicator -->
    <rect x="123" y="717" width="114" height="5" rx="2.5" fill="#2D2A33"/>
  </g>
</svg>
