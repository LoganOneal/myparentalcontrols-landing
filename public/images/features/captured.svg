    <g transform="translate(180, 178)">
      <line x1="-130" y1="0" x2="-44" y2="0" stroke="#ECE7DE"/>
      <line x1="44" y1="0" x2="130" y2="0" stroke="#ECE7DE"/>
      <text class="stamp muted" text-anchor="middle">Today · 2:31 PM</text>
    </g>

    <!-- Message 1: stranger -->
    <g transform="translate(20, 198)">
      <path d="M0,12 Q0,0 12,0 L220,0 Q232,0 232,12 L232,32 Q232,44 220,44 L20,44 Q12,44 8,48 L4,52 L6,44 Q0,42 0,32 Z" fill="#F0EBE2"/>
      <text x="16" y="28" class="body">i bet ur cute w/o makeup</text>
    </g>
    <text x="20" y="263" class="stamp muted">stranger_249x · 2:31</text>
    <g transform="translate(108, 253)">
      <rect width="50" height="14" rx="7" fill="#F1DCD4"/>
      <text x="25" y="10" class="pill" fill="#8C4F40" text-anchor="middle">EXPIRED</text>
    </g>

    <!-- Message 2: stranger - more concerning -->
    <g transform="translate(20, 280)">
      <path d="M0,12 Q0,0 12,0 L240,0 Q252,0 252,12 L252,40 Q252,52 240,52 L20,52 Q12,52 8,56 L4,60 L6,52 Q0,50 0,40 Z" fill="#F0EBE2"/>
      <text x="16" y="22" class="body">send a pic 😜 it disappears</text>
      <text x="16" y="40" class="body">anyway i swear</text>
    </g>
    <text x="20" y="353" class="stamp muted">stranger_249x · 2:33</text>
    <g transform="translate(132, 343)">
      <rect width="50" height="14" rx="7" fill="#F1DCD4"/>
      <text x="25" y="10" class="pill" fill="#8C4F40" text-anchor="middle">EXPIRED</text>
    </g>

    <!-- Message 3: child reply -->
    <g transform="translate(208, 370)">
      <path d="M132,12 Q132,0 120,0 L12,0 Q0,0 0,12 L0,32 Q0,44 12,44 L124,44 Q132,44 128,48 L132,52 L130,44 Q132,42 132,32 Z" fill="#DBEAFE"/>
      <text x="120" y="28" class="body" text-anchor="end">i can't, my mom checks</text>
    </g>
    <text x="340" y="435" class="stamp muted" text-anchor="end">Lily · 2:35</text>

    <!-- Message 4: stranger - escalation -->
    <g transform="translate(20, 452)">
      <path d="M0,12 Q0,0 12,0 L256,0 Q268,0 268,12 L268,40 Q268,52 256,52 L20,52 Q12,52 8,56 L4,60 L6,52 Q0,50 0,40 Z" fill="#F0EBE2"/>
      <text x="16" y="22" class="body">switch to telegram its safer</text>
      <text x="16" y="40" class="body">ill send u my @ here</text>
    </g>
    <text x="20" y="525" class="stamp muted">stranger_249x · 2:37</text>
    <g transform="translate(132, 515)">
      <rect width="84" height="14" rx="7" fill="#EFF6FF"/>
      <text x="42" y="10" class="pill" fill="#1D4ED8" text-anchor="middle">FLAGGED · OFF-PLATFORM</text>
    </g>

    <!-- AI summary card -->
    <g transform="translate(20, 548)">
      <rect width="320" height="88" rx="18" fill="#FFFFFF" stroke="#ECE7DE"/>
      <g transform="translate(18, 20)">
        <rect width="32" height="32" rx="10" fill="#EFF6FF"/>
        <path d="M16,8 L19,14 L25,15 L21,19 L22,25 L16,22 L10,25 L11,19 L7,15 L13,14 Z" fill="#2563EB"/>
      </g>
      <text x="62" y="32" class="h2">Why this was flagged</text>
      <text x="62" y="52" class="small muted">Stranger requested off-platform move</text>
      <text x="62" y="68" class="small muted">+ image of minor · classic grooming pattern</text>
      <g transform="translate(304, 32)">
        <text class="pill" fill="#2563EB" text-anchor="end">SEE PLAYBOOK →</text>
      </g>
    </g>

    <!-- Tab bar -->
    <rect x="9" y="660" width="342" height="71" fill="#FFFFFF"/>
    <rect x="9" y="660" width="342" height="1" fill="#ECE7DE"/>
    <g transform="translate(48, 678)">
      <path d="M-7,-3 C-7,-8 -3,-11 0,-11 C3,-11 7,-8 7,-3 L8,3 L-8,3 Z" fill="#2563EB"/>
      <path d="M-2,4 C-2,6 -1,7 0,7 C1,7 2,6 2,4 Z" fill="#2563EB"/>
      <circle cx="6" cy="-7" r="3" fill="#FFFFFF"/>
      <circle cx="6" cy="-7" r="1.8" fill="#2563EB"/>
      <text y="22" class="tab" fill="#2563EB" text-anchor="middle">Alerts</text>
    </g>
    <g transform="translate(132, 678)">
      <path d="M-8,4 L-3,-1 L1,3 L7,-5" fill="none" stroke="#B0A8B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="22" class="tab muted" text-anchor="middle">Activity</text>
    </g>
    <g transform="translate(216, 678)">
      <circle cx="-4" cy="-2" r="4" fill="none" stroke="#B0A8B6" stroke-width="1.8"/>
      <circle cx="4" cy="-2" r="4" fill="none" stroke="#B0A8B6" stroke-width="1.8"/>
      <path d="M-10,8 C-10,4 -7,2 -4,2 M10,8 C10,4 7,2 4,2" fill="none" stroke="#B0A8B6" stroke-width="1.8" stroke-linecap="round"/>
      <text y="22" class="tab muted" text-anchor="middle">Children</text>
    </g>
    <g transform="translate(300, 678)">
      <circle r="6" fill="none" stroke="#B0A8B6" stroke-width="1.8"/>
      <path d="M0,-8.5 L0,-6 M0,6 L0,8.5 M-8.5,0 L-6,0 M6,0 L8.5,0 M-6,-6 L-4,-4 M4,4 L6,6 M-6,6 L-4,4 M4,-4 L6,-6" stroke="#B0A8B6" stroke-width="1.8" stroke-linecap="round"/>
      <text y="22" class="tab muted" text-anchor="middle">Settings</text>
    </g>

    <rect x="123" y="717" width="114" height="5" rx="2.5" fill="#2D2A33"/>
  </g>
</svg>
