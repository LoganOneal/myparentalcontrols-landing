<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; fill: #2D2A33; }
    .muted { fill: #7A7480; }
    .faint { fill: #B0A8B6; }
    .invert { fill: #FFFFFF; }
    .h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
    .h2 { font-size: 14px; font-weight: 600; }
    .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; }
    .body { font-size: 13px; font-weight: 500; }
    .small { font-size: 11px; font-weight: 500; }
    .pill { font-size: 9.5px; font-weight: 700; letter-spacing: 0.3px; }
    .tab { font-size: 9.5px; font-weight: 600; letter-spacing: 0.2px; }
    .stamp { font-size: 9.5px; font-weight: 500; }
  </style>
  <defs>
    <clipPath id="screen"><rect x="9" y="9" width="342" height="722" rx="46"/></clipPath>
  </defs>

  <rect width="360" height="740" rx="54" fill="#1a1a1a"/>
  <rect x="0.5" y="0.5" width="359" height="739" rx="53.5" fill="none" stroke="#2d2d2d"/>
  <rect x="6" y="6" width="348" height="728" rx="48" fill="#0d0d0d"/>

  <g clip-path="url(#screen)">
    <rect x="9" y="9" width="342" height="722" fill="#FFFFFF"/>
    <rect x="9" y="9" width="342" height="138" fill="#FFFFFF"/>
    <rect x="9" y="146" width="342" height="1" fill="#ECE7DE"/>

    <!-- Status bar -->
    <text x="32" y="38" class="small">9:41</text>
    <g transform="translate(285, 30)">
      <rect x="0" y="6" width="3" height="3" rx="0.5" fill="#2D2A33"/>
      <rect x="5" y="4" width="3" height="5" rx="0.5" fill="#2D2A33"/>
      <rect x="10" y="2" width="3" height="7" rx="0.5" fill="#2D2A33"/>
      <rect x="15" y="0" width="3" height="9" rx="0.5" fill="#2D2A33"/>
      <path d="M26,7 Q31,2 36,7 M28,9 Q31,6 34,9" fill="none" stroke="#2D2A33" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="31" cy="10.5" r="1" fill="#2D2A33"/>
      <rect x="42" y="2" width="22" height="9" rx="2.5" fill="none" stroke="#2D2A33" stroke-width="1"/>
      <rect x="64.5" y="4.5" width="1.5" height="4" rx="0.5" fill="#2D2A33"/>
      <rect x="43.5" y="3.5" width="16" height="6" rx="1" fill="#2D2A33"/>
    </g>
    <rect x="135" y="22" width="90" height="28" rx="14" fill="#0d0d0d"/>

    <!-- Back arrow -->
    <g transform="translate(30, 88)">
      <path d="M0,-7 L-8,0 L0,7 M-8,0 L10,0" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Header info -->
    <g transform="translate(78, 70)">
      <!-- Avatar with Snap brand -->
      <circle cx="20" cy="20" r="20" fill="#FFFC00"/>
      <path d="M20,8 C15,8 12,12 12,17 C12,21 13,24 11,26 C11,27 14,28 16,27 C17,28 18,29 20,29 C22,29 23,28 24,27 C26,28 29,27 29,26 C27,24 28,21 28,17 C28,12 25,8 20,8 Z" fill="#FFFFFF"/>
      <text x="50" y="18" class="h2">stranger_249x</text>
      <text x="50" y="34" class="small muted">Snapchat · vanished 6 min ago</text>
    </g>

    <!-- Recovery banner -->
    <g transform="translate(20, 122)">
      <rect width="320" height="34" rx="12" fill="#EFF6FF"/>
      <g transform="translate(18, 17)">
        <rect x="-6" y="-2" width="12" height="9" rx="1.5" fill="none" stroke="#2563EB" stroke-width="1.6"/>
        <path d="M-4,-2 L-4,-5 C-4,-7 -2,-9 0,-9 C2,-9 4,-7 4,-5 L4,-2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
      </g>
      <text x="40" y="22" class="small" fill="#1D4ED8">6 disappearing messages recovered on device</text>
    </g>

