      <text x="30" y="40" class="mono" text-anchor="middle">S</text>
      <circle cx="55" cy="5" r="5" fill="#FFFFFF"/>
      <circle cx="55" cy="5" r="3" fill="#14B8A6"/>
      <text x="30" y="76" class="label" text-anchor="middle">Snap</text>
