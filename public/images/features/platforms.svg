      <text x="30" y="40" class="mono invert" text-anchor="middle">R</text>
      <circle cx="55" cy="5" r="5" fill="#FFFFFF"/>
      <circle cx="55" cy="5" r="3" fill="#14B8A6"/>
      <text x="30" y="76" class="label" text-anchor="middle">Roblox</text>
    </g>
    <g transform="translate(108, 294)">
      <rect width="60" height="60" rx="16" fill="#5865F2"/>
      <text x="30" y="40" class="mono invert" text-anchor="middle">D</text>
      <circle cx="55" cy="5" r="5" fill="#FFFFFF"/>
      <circle cx="55" cy="5" r="3" fill="#14B8A6"/>
