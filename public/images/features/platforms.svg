      <circle cx="22" cy="22" r="6" fill="none" stroke="#B0A8B6" stroke-width="1.8"/>
      <line x1="26.5" y1="26.5" x2="31" y2="31" stroke="#B0A8B6" stroke-width="1.8" stroke-linecap="round"/>
