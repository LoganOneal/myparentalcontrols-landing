    <rect x="9" y="660" width="342" height="1" fill="#ECE7DE"/>
    <g transform="translate(48, 678)">
      <path d="M-7,-3 C-7,-8 -3,-11 0,-11 C3,-11 7,-8 7,-3 L8,3 L-8,3 Z" fill="none" stroke="#B0A8B6" stroke-width="1.8"/>
      <path d="M-2,4 C-2,6 -1,7 0,7 C1,7 2,6 2,4 Z" fill="none" stroke="#B0A8B6" stroke-width="1.8"/>
